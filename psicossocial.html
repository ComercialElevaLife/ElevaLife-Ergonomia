/profissionais e o que a função exige","Moderado","H5","PRE","Reduzir o conflito entre valores pessoais/profissionais e as exigências da função","Instituir canal de diálogo com RH/liderança para trabalhadores que reportem conflito de valores relevante com as exigências da função, buscando ajuste possível.","EC-00","CP","Trabalhador reportando conflito de valores com a função exercida","Número de casos de conflito de valores tratados formalmente"],["PAP-P02-EST-002","car","Conflito de Papel","Liderança que exige lealdade pessoal em conflito com política formal da empresa","Alto","H1","EST","Eliminar exigência de lealdade pessoal em conflito com política formal","Capacitar e monitorar lideranças quanto à vedação de exigir lealdade pessoal em detrimento da política formal da empresa, com canal de reporte para desvios.","EC-00","CP","Casos de exigência de lealdade pessoal em conflito com política formal","Número de reportes de exigência de lealdade pessoal indevida"],["PAP-P02-PRE-003","car","Conflito de Papel","Função que exige fiscalizar colegas de mesmo nível hierárquico","Moderado","H2","PRE","Reduzir o desconforto de papel de fiscalização entre pares de mesmo nível","Formalizar e comunicar amplamente o papel de fiscalização entre pares quando existir, com respaldo institucional explícito para reduzir o desconforto relacional.","EC-00","CP","Desconforto relacional por papel de fiscalização entre pares","Índice de percepção de legitimidade do papel de fiscalização entre pares"],["PAP-P02-EST-003","car","Conflito de Papel","Papel de representação de duas áreas com interesses conflitantes","Alto","H1","EST","Reduzir o conflito de papel de representação de áreas com interesses conflitantes","Revisar a estrutura de posições que representam formalmente duas áreas com interesses conflitantes, buscando desenho organizacional que reduza o conflito estrutural de papel.","EC-06","MP","Posições com conflito estrutural de representação entre áreas","Número de posições com conflito estrutural de representação identificado"],["PAP-P02-PRE-004","car","Conflito de Papel","Conflito entre o papel de proteger o cliente e o de proteger a empresa","Moderado","H1","PRE","Reduzir o conflito entre proteger o cliente e proteger a empresa","Estabelecer diretriz clara de priorização entre interesse do cliente e interesse da empresa para situações típicas de conflito, com escalonamento para casos não previstos.","EC-00","CP","Trabalhador em dúvida sobre priorizar cliente ou empresa em conflito","Percentual de funções com diretriz de priorização cliente/empresa definida"],["PAP-P02-PRE-005","car","Conflito de Papel","Cobrança simultânea de padronização e de personalização no atendimento","Moderado","H3","PRE","Estabelecer critério de equilíbrio entre padronização e personalização","Definir claramente os pontos do atendimento que exigem padronização estrita e os que permitem personalização, comunicando o critério à equipe.","EC-04","CP","Trabalhador pressionado por padronização e personalização sem critério","Percentual de processos de atendimento com critério de padronização/personalização definido"],["PAP-P02-EST-004","car","Conflito de Papel","Trabalhador dividido entre reportar-se a dois gestores com prioridades distintas (matriz)","Alto","H1","EST","Reduzir o conflito de papel em estruturas matriciais com dois gestores","Formalizar protocolo de resolução de conflito de prioridade em estruturas matriciais, com gestor de desempate definido previamente.","EC-06","MP","Conflitos de prioridade não resolvidos em estrutura matricial","Percentual de estruturas matriciais com protocolo de desempate formalizado"],["PAP-P03-COR-001","car","Sobrecarga/Adequação de Papel","Escopo do cargo maior do que o originalmente contratado, sem ajuste formal","Alto","H1","COR","Ajustar formalmente o escopo do cargo ao efetivamente exercido","Revisar contratualmente e salarialmente cargos cujo escopo tenha se expandido significativamente além do originalmente contratado.","EC-06","MP","Escopo de cargo expandido sem ajuste contratual/salarial correspondente","Percentual de cargos com escopo revisado formalmente após expansão"],["PAP-P03-COR-002","car","Sobrecarga/Adequação de Papel","Papel exercido incompatível com o nível de senioridade contratado","Moderado","H3","COR","Adequar o papel exercido ao nível de senioridade contratado","Revisar a distribuição de atividades para adequar o papel exercido ao nível de senioridade contratado, redistribuindo tarefas incompatíveis.","EC-06","MP","Papel exercido incompatível com nível de senioridade contratado","Percentual de trabalhadores com papel revisado quanto à adequação de senioridade"],["PAP-P03-PRE-001","car","Sobrecarga/Adequação de Papel","Ausência de revisão periódica da adequação do papel ao perfil do ocupante","Baixo","H3","PRE","Instituir revisão periódica da adequação do papel ao perfil do ocupante","Incluir, na avaliação periódica, uma etapa específica de revisão da adequação entre o papel exercido e o perfil/potencial do ocupante.","EC-00","LP","Ausência de revisão periódica de adequação de papel","Percentual de trabalhadores com revisão de adequação de papel realizada"],["PAP-P03-COR-003","car","Sobrecarga/Adequação de Papel","Papel que exige competências não previstas no processo seletivo original","Moderado","H2","COR","Alinhar as competências exigidas no papel às previstas no processo seletivo","Revisar o papel para alinhar competências exigidas às previstas no processo seletivo original, ou oferecer capacitação formal para a lacuna identificada.","EC-00","MP","Papel exigindo competência não avaliada/prevista na seleção","Percentual de lacunas de competência endereçadas por capacitação ou redesenho de papel"],["PAP-P03-EST-001","car","Sobrecarga/Adequação de Papel","Acúmulo de papéis distintos na mesma pessoa sem redesenho formal do cargo","Alto","H1","EST","Redesenhar formalmente cargos com acúmulo de papéis distintos","Mapear e redesenhar formalmente cargos com acúmulo de papéis distintos, formalizando o escopo ampliado ou redistribuindo entre diferentes posições.","EC-06","MP","Acúmulo de papéis distintos sem redesenho formal do cargo","Percentual de cargos com acúmulo de papéis redesenhados formalmente"],["PAP-P03-PRE-002","car","Sobrecarga/Adequação de Papel","Papel de 'faz-tudo' sem definição de prioridade entre as diferentes frentes","Moderado","H3","PRE","Definir prioridade entre as diferentes frentes do papel de 'faz-tudo'","Estabelecer, junto à liderança, critério explícito de prioridade entre as diferentes frentes de atuação de papéis multifuncionais amplos.","EC-00","CP","Papel multifuncional sem critério de prioridade entre frentes","Percentual de papéis multifuncionais com critério de prioridade definido"],["PAP-P03-PRE-003","car","Sobrecarga/Adequação de Papel","Trabalhador em papel abaixo de sua capacitação/potencial (subutilização)","Moderado","H3","PRE","Reduzir a subutilização de capacitação/potencial do trabalhador","Incluir a avaliação de subutilização de potencial como critério na revisão de carreira, com plano de desenvolvimento/redesenho de papel quando identificada.","EC-00","MP","Trabalhadores subutilizados em relação à sua capacitação/potencial","Percentual de trabalhadores com plano de ação para subutilização identificada"],["PAP-P03-PRE-004","car","Sobrecarga/Adequação de Papel","Ausência de transição formal quando o papel muda substancialmente ao longo do tempo","Moderado","H2","PRE","Instituir transição formal quando o papel muda substancialmente","Formalizar processo de transição (comunicação, capacitação, ajuste contratual) sempre que o papel de uma função mudar substancialmente ao longo do tempo.","EC-00","CP","Mudanças substanciais de papel implementadas sem transição formal","Percentual de mudanças substanciais de papel com transição formal registrada"],["PAP-P03-COR-004","car","Sobrecarga/Adequação de Papel","Papel que exige disponibilidade constante além do combinado contratualmente","Alto","H1","COR"," (RACI) alinhada"],["PAP-P04-COR-001","car","Autoridade e Responsabilidade","Cobrança por decisões de terceiros que o trabalhador não tem poder de influenciar","Alto","H3","COR","Eliminar cobrança por decisões de terceiros fora do controle do trabalhador","Revisar critérios de avaliação e cobrança para não responsabilizar o trabalhador por decisões de terceiros sobre as quais não tem poder de influência.","EC-07","CP","Trabalhador cobrado por decisão de terceiro fora de seu controle","Percentual de avaliações revisadas para excluir fatores fora do controle do avaliado"],["PAP-P04-PRE-001","car","Autoridade e Responsabilidade","Ausência de clareza sobre a quem cabe a decisão final em temas compartilhados","Moderado","H2","PRE","Assegurar clareza sobre a quem cabe a decisão final em temas compartilhados","Documentar formalmente quem detém a decisão final em temas de responsabilidade compartilhada entre áreas/funções.","EC-06","CP","Temas compartilhados sem decisor final definido","Percentual de temas compartilhados com decisor final formalmente definido"],["PAP-P04-COR-002","car","Autoridade e Responsabilidade","Responsabilização individual por falhas de causa sistêmica/organizacional","Alto","H1","COR","Eliminar a responsabilização individual por falhas de causa sistêmica","Instituir análise de causa raiz obrigatória antes de qualquer responsabilização disciplinar, distinguindo falha individual de falha sistêmica/organizacional.","EC-04","CP","Responsabilização individual por falha de causa sistêmica identificada posteriormente","Percentual de processos disciplinares precedidos de análise de causa raiz"],["PAP-P04-COR-003","car","Autoridade e Responsabilidade","Autoridade formal do cargo não reconhecida na prática pelos pares/subordinados","Moderado","H3","COR","Assegurar reconhecimento prático da autoridade formal do cargo","Reforçar formalmente, junto à equipe, a autoridade do cargo quando esta não for reconhecida na prática, com apoio explícito da liderança superior.","EC-00","CP","Autoridade formal não reconhecida na prática pela equipe","Índice de percepção de reconhecimento da autoridade formal em pesquisa de clima"],["PAP-P04-PRE-002","car","Autoridade e Responsabilidade","Ausência de delegação formal de autoridade quando a liderança está ausente","Moderado","H2","PRE","Instituir delegação formal de autoridade na ausência da liderança","Formalizar plano de delegação de autoridade (quem decide o quê) para períodos de ausência da liderança titular.","EC-00","CP","Decisões paralisadas por ausência de delegação formal de autoridade","Percentual de lideranças com plano de delegação formal definido"],["PAP-P04-EST-002","car","Autoridade e Responsabilidade","Responsabilidade legal/técnica atribuída sem o respaldo institucional correspondente","Alto","H1","EST","Assegurar respaldo institucional correspondente à responsabilidade legal/técnica atribuída","Revisar a atribuição de responsabilidade legal/técnica (ex.: responsável técnico) assegurando o respaldo institucional, orçamentário e de autoridade correspondente.","EC-00","MP","Responsabilidade legal/técnica atribuída sem respaldo institucional correspondente","Percentual de responsáveis técnicos com respaldo institucional formalmente assegurado"],["PAP-P04-EST-003","car","Autoridade e Responsabilidade","Papéis de fiscalização/compliance sem autoridade suficiente para fazer cumprir","Alto","H1","EST","Assegurar autoridade suficiente aos papéis de fiscalização/compliance","Revisar o desenho organizacional dos papéis de fiscalização/compliance para assegurar autoridade formal suficiente para fazer cumprir suas determinações.","EC-06","MP","Determinações de fiscalização/compliance não cumpridas por falta de autoridade formal","Percentual de determinações de compliance cumpridas dentro do prazo"],["PAP-P04-PRE-003","car","Autoridade e Responsabilidade","Ausência de clareza sobre limites de autoridade em situações de exceção/emergência","Alto","H1","PRE","Assegurar clareza sobre lim s de ridicularização apurados e tratados"],["REL-R02-COR-004","rel","Assédio Moral","Ameaças veladas de desligamento como forma de controle","Alto","H1","COR","Eliminar o uso de ameaças veladas de desligamento como forma de controle","Capacitar e monitorar lideranças quanto à vedação do uso de ameaças de desligamento como ferramenta de controle, com canal de denúncia e consequência disciplinar.","EC-00","CP","Casos de ameaça velada de desligamento reportados","Número de casos de ameaça de desligamento apurados"],["REL-R02-COR-005","rel","Assédio Moral","Exclusão sistemática de informações necessárias ao trabalho como forma de sabotagem","Alto","H2","COR","Eliminar a exclusão proposital de informação como forma de sabotagem","Investigar formalmente padrões de exclusão de informação necessária ao trabalho de trabalhador específico, tratando como possível assédio moral/sabotagem.","EC-04","CP","Exclusão de informação necessária reportada como forma de sabotagem","Número de casos de exclusão de informação apurados"],["REL-R02-EST-005","rel","Assédio Moral","Gritos e agressividade verbal recorrente de liderança com a equipe","Crítico","H1","EST","Eliminar gritos e agressividade verbal de lideranças","Implementar política de tolerância zero a agressividade verbal por lideranças, com apuração imediata, afastamento cautelar quando cabível e capacitação obrigatória.","EC-00","IM","Casos de gritos/agressividade verbal de liderança reportados","Número de casos de agressividade verbal de liderança apurados"],["REL-R02-PRE-001","rel","Assédio Moral","Comentários depreciativos sobre a vida pessoal do trabalhador","Moderado","H1","PRE","Eliminar comentários depreciativos sobre a vida pessoal do trabalhador","Reforçar diretriz de respeito à privacidade e vida pessoal do trabalhador, com capacitação de lideranças e canal de denúncia para desvios.","EC-00","CP","Comentários depreciativos sobre vida pessoal reportados","Número de casos de comentário depreciativo sobre vida pessoal apu ho","Alto","H1","EST","Eliminar o preconceito contra orientação sexual/identidade de gênero","Implementar política formal de respeito à diversidade sexual e de gênero, com capacitação de lideranças e canal de denúncia para casos de preconceito.","EC-00","CP","Casos de preconceito contra orientação sexual/identidade de gênero reportados","Número de casos de preconceito por orientação sexual/identidade de gênero apurados"],["REL-R04-COR-003","rel","Discriminação e Preconceito","Discriminação etária (idadismo) em processos de recrutamento e promoção","Moderado","H1","COR","Eliminar a discriminação etária em recrutamento e promoção","Revisar critérios de recrutamento e promoção para eliminar viés etário, com auditoria periódica da distribuição etária em contratações e promoções.","EC-07","MP","Viés etário identificado em recrutamento/promoção","Distribuição etária em contratações e promoções comparada ao mercado/quadro atual"],["REL-R04-COR-004","rel","Discriminação e Preconceito","Discriminação contra trabalhadores com deficiência em oportunidades de carreira","Alto","H1","COR","Eliminar a discriminação contra trabalhadores com deficiência em oportunidades de carreira","Realizar auditoria de equidade para trabalhadores com deficiência em oportunidades de carreira, com plano de ação para disparidades identificadas.","EC-07","LP","Disparidade de oportunidade de carreira para trabalhadores com deficiência","Índice de equidade de oportunidade de carreira para trabalhadores com deficiência"],["REL-R04-PRE-001","rel","Discriminação e Preconceito","Discriminação religiosa em acomodações e tratamento no trabalho","Moderado","H1","PRE","Assegurar acomodação e tratamento equitativo independente de religião","Instituir diretriz formal de acomodação razoável para práticas religiosas e vedação à discriminação religiosa no ambiente de trabalho.","EC-00","CP","Casos de discriminação/falta de acomodação religiosa reportados","Número de solicitações de acomodação religiosa atendidas"], C-00","IM","Casos de ameaça de violência física entre colegas reportados","Número de casos de ameaça de violência física apurados com medida aplicada"],["REL-R05-EST-003","rel","Violência no Trabalho","Ausência de protocolo de resposta a episódios de violência no local de trabalho","Alto","H1","EST","Instituir protocolo formal de resposta a episódios de violência no trabalho","Formalizar protocolo de resposta a episódios de violência no local de trabalho, incluindo ação imediata, comunicação a autoridades quando cabível e suporte às vítimas.","EC-00","CP","Ausência de protocolo formal de resposta a violência no trabalho","Existência e divulgação do protocolo de resposta a violência no trabalho"],["REL-R05-COR-001","rel","Violência no Trabalho","Exposição a assaltos/roubos no exercício da função sem suporte adequado pós-evento","Alto","H1","COR","Assegurar suporte adequado após exposição a assaltos/roubos no exercício da função","Instituir protocolo de suporte imediato (afastamento temporário, suporte psicológico, acompanhamento) para trabalhadores expostos a assaltos/roubos no exercício da função.","EC-00","CP","Trabalhadores expostos a assalto/roubo sem suporte pós-evento","Percentual de casos de assalto/roubo com protocolo de suporte pós-evento aplicado"],["REL-R05-PRE-001","rel","Violência no Trabalho","Violência doméstica de trabalhador com repercussão no ambiente de trabalho","Alto","H1","PRE","Assegurar suporte a trabalhadores em situação de violência doméstica com repercussão no trabalho","Instituir protocolo de apoio (licença facilitada, ajuste temporário de escala/local, encaminhamento a rede de proteção) para trabalhadores em situação de violência doméstica.","EC-00","CP","Repercussão de violência doméstica identificada no ambiente de trabalho sem apoio formal","Percentual de casos identificados com protocolo de apoio aplicado"],["REL-R05-PRE-002","rel","Violência no Trabalho","Ausência de treinamento para lidar com público agressivo/violento","Moderado","H1","PRE","Capacitar trabalhadores para lidar com público agressivo/violento","Oferecer treinamento específico de prevenção e desescalonamento de conflito para funções com exposição frequente a público agressivo/violento.","EC-00","MP","Trabalhadores sem capacitação para lidar com público agressivo","Percentual de trabalhadores expostos com capacitação de desescalonamento concluída"],["REL-R05-EST-004","rel","Violência no Trabalho","Infraestrutura de segurança física insuficiente para funções de exposição a risco","Alto","H1","EST","Adequar a infraestrutura de segurança física para funções de exposição a risco","Realizar avaliação de segurança física dos postos de trabalho expostos a risco de violência, implementando melhorias de infraestrutura identificadas.","EC-05","MP","Infraestrutura de segurança física insuficiente identificada em avaliação","Percentual de postos de risco com infraestrutura de segurança adequada"],["REL-R05-COR-002","rel","Violência no Trabalho","Ausência de suporte psicológico após exposição a evento de violência no trabalho","Alto","H1","COR","Assegurar suporte psicológico após exposição a evento de violência no trabalho","Instituir protocolo obrigatório de suporte psicológico (debriefing, encaminhamento) após qualquer evento de violência no trabalho.","EC-00","CP","Eventos de violência sem suporte psicológico subsequente","Percentual de eventos de violência com suporte psicológico oferecido"],["REL-R05-EST-005","rel","Violência no Trabalho","Conflitos armados/uso de arma branca ou de fogo em ambiente de trabalho","Crítico","H1","EST","Prevenir e responder a situações envolvendo arma no ambiente de trabalho","Implementar protocolo de segurança e resposta a situações envolvendo arma no ambiente de trabalho, incluindo prevenção (controle de acesso) e resposta emergencial coordenada com autoridades.","EC-05","IM","Casos envolvendo arma no ambiente de trabalho registrados","Existência e teste periódico do protocolo de resposta a situação envolvendo arma"],["REL-R05-PRE-003","rel","Violência no Trabalho","Ausência de canal de alerta rápido (botão de pânico) em funções de risco","Moderado","H1","PRE","Instituir canal de alerta rápido para funções de risco","Avaliar e implementar sistema de alerta rápido (botão de pânico ou equivalente) para funções com exposição relevante a risco de violência.","EC-05","MP","Ausência de canal de alerta rápido em funções de risco identificadas","Percentual de funções de risco com canal de alerta rápido implementado"],["REL-R05-EST-006","rel","Violência no Trabalho","Retaliação violenta após reporte de irregularidade (whistleblower)","Crítico","H1","EST","Proteger trabalhadores que reportam irregularidades contra retaliação violenta","Fortalecer a política de proteção ao denunciante (whistleblower), incluindo avaliação de risco de segurança física e medidas de proteção quando pertinente.","EC-00","IM","Casos de retaliação violenta após reporte de irregularidade","Número de denunciantes com avaliação de risco de segurança realizada"],["REL-R05-COR-003","rel","Violência no Trabalho","Violência verbal recorrente de clientes/usuários sem respaldo institucional ao trabalhador","Alto","H1","COR","Assegurar respaldo institucional ao trabalhador exposto a violência verbal de clientes/usuários","Instituir protocolo que autorize o trabalhador a interromper o atendimento em caso de violência verbal do cliente/usuário, com respaldo institucional explícito.","EC-00","CP","Trabalhador sem respaldo institucional diante de violência verbal de cliente","Percentual de trabalhadores que conhecem e utilizam o protocolo de interrupção de atendimento"],["REL-R06-PRE-001","rel","Incivilidade e Clima Relacional","Falta de cortesia básica no trato diário entre colegas","Baixo","H4","PRE","Fomentar cortesia básica no trato diário entre colegas","Promover, com apoio da liderança, normas explícitas de civilidade no trato diário entre colegas.","EC-00","CP","Falta de cortesia básica reportada no trato diário","Índice de percepção de civilidade no trato diário em pesquisa de clima"],["REL-R06-PRE-002","rel","Incivilidade e Clima Relacional","Interrupções constantes e desrespeito à fala do outro em reuniões","Baixo","H3","PRE","Reduzir interrupções e desrespeito à fala do outro em reuniões","Capacitar facilitadores de reunião em técnicas de condução que assegurem respeito à fala de cada participante.","EC-00","CP","Interrupções constantes reportadas em reuniões","Índice de percepção de respeito à fala em reuniões"],["REL-R06-COR-001","rel","Incivilidade e Clima Relacional","Tom de comunicação agressivo naturalizado como 'jeito de ser' na cultura local","Moderado","H1","COR","Romper a naturalização de tom de comunicação agressivo na cultura local","Realizar diagnóstico cultural sobre naturalização de tom agressivo de comunicação, com plano de mudança cultural e capacitação de lideranças.","EC-00","MP","Tom de comunicação agressivo naturalizado como cultura local","Índice de percepção de tom de comunicação respeitoso em pesquisa de clima"],["REL-R06-PRE-003","rel","Incivilidade e Clima Relacional","Fofoca e comentários maldosos sobre colegas ausentes","Baixo","H4","PRE","Reduzir a fofoca e comentários maldosos sobre colegas ausentes","Sensibilizar a equipe sobre o impacto da fofoca e comentários maldosos, promovendo normas de convivência que desencorajem essa prática.","EC-00","CP","Fofoca e comentários maldosos reportados sobre colegas ausentes","Índice de percepção de ambiente livre de fofoca em pesquisa de clima"],["REL-R06-PRE-004","rel","Incivilidade e Clima Relacional","Ausência de normas explícitas de convivência e civilidade no ambiente de trabalho","Moderado","H1","PRE","Instituir normas explícitas de convivência e civilidade","Formalizar e comunicar normas explícitas de convivência e civilidade no ambiente de trabalho, com envolvimento da equipe na sua construção.","EC-00","CP","Ausência de normas explícitas de convivência","Existência e divulgação de normas explícitas de convivência"],["REL-R06-COR-002","rel","Incivilidade e Clima Relacional","Sarcasmo e ironia recorrentes usados para desqualificar colegas","Moderado","H3","COR","Reduzir o uso de sarcasmo e ironia para desqualificar colegas","Capacitar lideranças para identificar e mediar o uso recorrente de sarcasmo/ironia desqualificadora entre colegas.","EC-00","CP","Sarcasmo/ironia desqualificadora reportada entre colegas","Índice de percepção de respeito mútuo em pesquisa de clima"],["REL-R06-COR-003","rel","Incivilidade e Clima Relacional","Uso de apelidos depreciativos tolerado como 'brincadeira da equipe'","Moderado","H3","COR","Eliminar a tolerância a apelidos depreciativos no ambiente de trabalho","Reforçar diretriz de vedação a apelidos depreciativos, mesmo quando apresentados como 'brincadeira da equipe', com capacitação de lideranças.","EC-00","CP","Apelidos depreciativos tolerados como brincadeira","Número de casos de apelido depreciativo reportados e tratados"],["REL-R06-COR-004","rel","Incivilidade e Clima Relacional","Clima de desconfiança generalizada entre membros da equipe","Alto","H3","COR","Reduzir o clima de desconfiança generalizada na equipe","Realizar diagnóstico das causas da desconfiança generalizada na equipe (ex.: histórico de conflito, falta de transparência) e plano de ação estruturado de reconstrução de confiança.","EC-00","MP","Clima de desconfiança generalizada identificado em pesquisa de clima","Índice de confiança interpessoal em pesquisa de clima"],["REL-R06-COR-005","rel","Incivilidade e Clima Relacional","Ausência de consequência para comportamentos de incivilidade reportados","Alto","H1","COR","Assegurar consequência para comportamentos de incivilidade reportados","Formalizar processo de apuração e consequência gradual para comportamentos de incivilidade reportados e comprovados, evitando naturalização por ausência de resposta institucional.","EC-00","CP","Comportamentos de incivilidade reportados sem qualquer consequência","Perc const MATRIZES_LOCAL={"Matriz 3x3":[["Baixa","Media","Alta"],["Baixo","Moderado","Alto"]],"Matriz 4x4":[["Baixa","Media","Alta","Muito Alta"],["Baixo","Moderado","Alto","Muito Alto"]],"Matriz 5x5":[["Muito Baixa","Baixa","Media","Alta","Muito Alta"],["Muito Baixo","Baixo","Moderado","Alto","Altíssimo"]]};
function celulaLocal(nome,p,s){ const d=MATRIZES_LOCAL[nome]||MATRIZES_LOCAL["Matriz 5x5"], n=d[0].length, pont=(p+1)*(s+1); return {nivel:d[1][Math.min(n-1,Math.floor((pont-1)/(n*n)*n))],pontuacao:pont}; }
let MZ_CACHE=null;
function mz(){
  const nome=emp()?.matriz||"Matriz 5x5"; if(MZ_CACHE&&MZ_CACHE.nome===nome) return MZ_CACHE;
  const C=window.BI&&BI.Calc&&BI.Calc.escalaDaMatriz?BI.Calc:null;
  const esc_=C?C.escalaDaMatriz(nome):(MATRIZES_LOCAL[nome]||MATRIZES_LOCAL["Matriz 5x5"])[0], n=esc_.length;
  const M=[],NV=[],PT=[];
  for(let p=0;p<n;p++){ M.push([]);NV.push([]);PT.push([]); for(let q=0;q<n;q++){
    const nv=C?C.nivelDaMatriz(nome,esc_[p],esc_[q]):celulaLocal(nome,p,q).nivel, pt=C?C.pontuacaoDaMatriz(nome,esc_[p],esc_[q]):celulaLocal(nome,p,q).pontuacao;
    M[p].push(NIVEL_CAT(nv)); NV[p].push(nv); PT[p].push(pt); } }
  const cats=[...new Set(M.flat())].filter(c=>c!=null).sort((a,b)=>a-b);
  // nomes dos níveis conforme a matriz (ex.: 4x4 → "Muito Alto"; 5x5 → "Altíssimo")
  CAT.forEach((c,i)=>{ c.n=NOMES_CAT[i]; }); M.forEach((l,p)=>l.forEach((c,q)=>{ if(c!=null) CAT[c].n=NV[p][q]; }));
  MZ_CACHE={nome,rot:`${n} × ${n}`,n,P:esc_.map(rotEscala),S:esc_.map(rotEscala),esc:esc_,M,NV,PT,cats,
    conv:p5=>Math.round(1+(p5-1)*(n-1)/4),             // probabilidade 1–5 → 1–n
    sevN:sf=>Math.min(n,Math.max(1,Math.round(1+(sf-0.75)*(n-1)/3.25)))}; // severidade 0,75–4,00 → 1–n
  return MZ_CACHE;
}

const nivVar=n=>{ n=String(n||"").toLowerCase(); return /muito baix|trivial/.test(n)?"--g0":/^baix/.test(n)?"--g1":/moderad|^m[eé]di/.test(n)?"--g2":/muito alt|crític|altíssim/.test(n)?"--g4":/^alt/.test(n)?"--g3":"--ln"; };
const nivTag=(n,t)=>`<span class="chip" style="--c:var(${nivVar(n)})">${t}</span>`;

// Análise por fator do HSE: probabilidade (graduação do fator × ISO) e severidade (SIF do fator × EO do grupo).
// A graduação do grupo é a do fator de maior risco.
function analisarFatores(T,isoI,eo){
  const m=mz(), sif=sifEmp(), fat={};
  DIMS.forEach(d=>{ const sc=T.dims[d.id].score, f={sif:sif[d.id],score:sc};
    if(sc!=null){ f.hse=5-risco(sc).nivel; if(isoI!=null){ f.p5=PROB5[f.hse][isoI]; f.p=m.conv(f.p5); } }
    if(eo!=null){ f.sfc=SEV_IDX[f.sif-1][eo-1]; f.s=m.sevN(f.sfc); f.sf=f.s; }
    if(f.p&&f.s){ f.cat=m.M[f.p-1][f.s-1]; f.nivel=m.NV[f.p-1][f.s-1]; f.pont=m.PT[f.p-1][f.s-1]; }
    fat[d.id]=f; });
  const cl=DIMS.map(d=>({id:d.id,...fat[d.id]})).filter(f=>f.cat!=null).sort((x,y)=>y.cat-x.cat||(y.pont||0)-(x.pont||0));
  return {fat,top:cl[0]||null};
}
function analisar(g){
  const T=tabular(respsPorGhe().get(g.k)||[]); const a=S.data.analise[g.k]||{};
  const o={g,T,a,pend:[]};
  if(!T.n) o.pend.push("respostas HSE"); else { o.hse=5-risco(T.geral).nivel; }
  const iso=isoAtual(); if(!iso) o.pend.push("ISO 45003"); else o.iso=iso.i;
  const eo=[1,2,3,4,5].includes(+a.eoMan)?+a.eoMan:eoTF(a.tf,a.grave); if(eo==null) o.pend.push("taxa de frequência"); else o.eo=eo;
  const {fat,top}=analisarFatores(T,o.iso,eo); o.fat=fat;
  if(top){ o.cat=top.cat; o.p=top.p; o.s=top.s; o.sf=top.sf; o.critico=top.id; o.nivel=top.nivel; o.pont=top.pont; }
  o.dims=DIMS.filter(d=>fat[d.id].cat>=2).map(d=>d.id); // fatores com risco moderado ou acima
  return o;
}

function lerAbaTF(wb){ const aoa=abaAoa(wb,/taxa/i); if(!aoa) return [];
  const hi=aoa.findIndex(r=>r.some(c=>/^\s*unidade/i.test(c))); if(hi<0) return [];
  const h=aoa[hi].map(c=>String(c).toLowerCase()); const ci={u:h.findIndex(c=>/^\s*unidade/.test(c)),g:h.findIndex(c=>/^\s*ghe/.test(c)),tf:h.findIndex(c=>/taxa/.test(c)),gr:h.findIndex(c=>/grave/.test(c))};
  return aoa.slice(hi+1).map(r=>({un:String(r[ci.u]||"").trim(),gn:String(r[ci.g]||"").trim(),tf:parseNum(r[ci.tf]),gr:ci.gr>=0?String(r[ci.gr]||"").trim():""})).filter(x=>x.un&&x.gn&&(x.tf!=null||x.gr)); }
function lerAbaAcoes(wb){ const aoa=abaAoa(wb,/realizad|executad/i); if(!aoa) return null;
  const hi=aoa.findIndex(r=>r.some(c=>/^\s*a[cç][aã]o/i.test(c))); if(hi<0) return null;
  const h=aoa[hi].map(c=>String(c).toLowerCase()); const ci={a:h.findIndex(c=>/^\s*a[cç][aã]o/.test(c)),d:h.findIndex(c=>/descri/.test(c)),u:h.findIndex(c=>/^\s*unidade/.test(c)),g:h.findIndex(c=>/^\s*ghe/.test(c))};
  return aoa.slice(hi+1).map(r=>({a:String(r[ci.a]||"").trim(),d:ci.d>=0?String(r[ci.d]||"").trim():"",un:ci.u>=0?String(r[ci.u]||"").trim():"",gn:ci.g>=0?String(r[ci.g]||"").trim():""})).filter(x=>x.a); }
const acharGhe=(un,gn)=>S.data.ghes.find(x=>slug(x.nome)===slug(gn)&&slug(uNome(x.unidadeId))===slug(un));
async function aplicarTF(rows,st){ let ok=0; const nao=[];
  for(const x of rows){ const g=acharGhe(x.un,x.gn); if(!g){nao.push(`${x.un} / ${x.gn}`);continue}
    const patch={}; if(x.tf!=null) patch.tf=x.tf; if(x.gr) patch.grave=/^s/i.test(x.gr);
    if(st) st.textContent=`Gravando taxa de frequência ${ok+1}…`; await saveAnalise(g.k,patch); ok++; }
  return {ok,nao}; }
async function aplicarAcoes(rows,st){ // substitui as ações já realizadas pelo conteúdo da aba
  const txt=x=>x.d?`${x.a}: ${x.d}`:x.a; const nao=[];
  const porGhe=new Map(S.data.ghes.map(g=>[g.k,[]]));
  rows.filter(x=>x.un).forEach(x=>{ const alvo=x.gn?[acharGhe(x.un,x.gn)].filter(Boolean):S.data.ghes.filter(g=>slug(uNome(g.unidadeId))===slug(x.un));
    if(!alvo.length) nao.push(`${x.un}${x.gn?" / "+x.gn:""}`); alvo.forEach(g=>porGhe.get(g.k).push(txt(x))); });
  if(st) st.textContent="Gravando ações já realizadas…";
  await saveEmp({realizadas:rows.filter(x=>!x.un).map(txt).join("\n")});
  for(const [gid,l] of porGhe){ const atual=(S.data.analise[gid]||{}).realizadas||""; const novo=l.join("\n"); if(novo!==atual) await saveAnalise(gid,{realizadas:novo}); }
  return {ok:rows.length,nao}; }
function importarTF(file){
  const st=$("#tfSt"); const rd=new FileReader();
  rd.onload=async()=>{ try{
    const wb=XLSX.read(new Uint8Array(rd.result),{type:"array"}); const tf=lerAbaTF(wb), ac=lerAbaAcoes(wb);
    if(!tf.length&&!ac) throw new Error("Não encontrei as abas “Taxa de frequência” ou “Ações já realizadas”.");
    const r1=await aplicarTF(tf,st), r2=ac?await aplicarAcoes(ac,st):{ok:0,nao:[]}; const nao=[...r1.nao,...r2.nao];
    toast(`${r1.ok} taxas de frequência e ${r2.ok} ações importadas`+(nao.length?` · ${nao.length} não encontrados`:"")); render();
    if(nao.length) setTimeout(()=>{const s=$("#tfSt"); if(s){s.className="err";s.textContent="Não encontrados: "+nao.slice(0,8).join("; ")+(nao.length>8?"…":"")}},50);
  }catch(e){ st.className="err"; st.textContent=e.message||"Não consegui ler a planilha."; } };
  rd.readAsArrayBuffer(file);
}

// ---------- Aba Plano de ação ----------
const NIVEL_ACAO={2:["Moderado"],3:["Alto"],4:["Crítico","Alto"]};
// ---------- Recomendação automática (cruza respostas × graduação × biblioteca) ----------
// Cada item do HSE-IT aponta para o subfator da Biblioteca Mestre que trata aquele achado.
const ITEM_SUBFATOR=["Clareza de Papel","Autonomia","Multitarefas","Clareza de Papel","Assédio Moral","Pressão Temporal","Cooperação","Comunicação","Ritmo de Trabalho","Influência sobre o trabalho","Clareza de Papel","Volume de Trabalho","Clareza de Papel","Conflitos Interpessoais","Autonomia","Jornada e Pausas","Clareza de Papel","Jornada e Pausas","Autonomia","Ritmo de Trabalho","Assédio Moral","Pressão Temporal","Disponibilidade","Apoio social","Participação nas decisões","Comunicação Institucional","Integração","Planejamento e Gestão de Mudanças","Disponibilidade","Flexibilidade","Apoio social","Suporte à Adaptação e Resistência à Mudança","Disponibilidade","Incivilidade e Clima Relacional","Reconhecimento"];
const ALVO_ACOES={2:5,3:7,4:9}; // quantidade de ações por GHE conforme a graduação
function achadosGHE(x){ // itens com maior proporção de respostas desfavoráveis (favorabilidade 1 ou 2)
  const rs=S.data.resps.filter(r=>r.gheId===x.g.k); if(!rs.length) return [];
  return ITENS.map((it,i)=>{ let n=0,d=0; rs.forEach(r=>{const v=r.r[i]; if(v){n++; if(fav(i,v)<=2) d++;}}); return {i,dim:it[0],txt:it[1],pct:n?d/n*100:0,sub:ITEM_SUBFATOR[i]}; })
    .filter(a=>a.pct>0).sort((a,b)=>b.pct-a.pct);
}
function recomendar(x){
  if(x.cat==null||x.cat<2) return [];
  const niveis=NIVEL_ACAO[x.cat], alvo=ALVO_ACOES[x.cat]||5, dimsRisco=x.dims.length?x.dims:DIMS.map(d=>d.id);
  const ach=achadosGHE(x).filter(a=>dimsRisco.includes(a.dim)); const escolhidas=[], usadas=new Set(), subUsado=new Set();
  const peso=b=>({H1:0,H2:1,H3:2,H4:3,H5:4}[b[5]]??5)*10+(x.cat>=3?({EST:0,COR:1,PRE:2}[b[6]]??3):({COR:0,PRE:1,EST:2}[b[6]]??3))*3+({IM:0,CP:1,MP:2,LP:3}[b[10]]??4);
  const pegar=(a,lvl)=>{ const c=BIBLIOTECA.filter(b=>b[1]===a.dim&&b[2]===a.sub&&lvl.includes(b[4])&&!usadas.has(b[0])).sort((p,q)=>peso(p)-peso(q))[0]; return c; };
  for(const a of ach){ if(escolhidas.length>=alvo) break; if(subUsado.has(a.dim+a.sub)) continue;
    let b=pegar(a,niveis)||pegar(a,["Moderado","Alto","Crítico"]); if(!b) continue;
    usadas.add(b[0]); subUsado.add(a.dim+a.sub); escolhidas.push({c:b[0],motivo:`“${a.txt}” – ${fmt(a.pct,0)}% de respostas desfavoráveis`}); }
  // garante ao menos uma ação por fator em risco
  for(const d of dimsRisco){ if(escolhidas.length>=alvo+2) break; if(escolhidas.some(e=>bib(e.c)?.[1]===d)) continue;
    const b=BIBLIOTECA.filter(b=>b[1]===d&&niveis.includes(b[4])&&!usadas.has(b[0])).sort((p,q)=>peso(p)-peso(q))[0];
    if(b){ usadas.add(b[0]); escolhidas.push({c:b[0],motivo:`${dimNome(d)}: média ${fmt(x.T.dims[d].score)} (${risco(x.T.dims[d].score)?.nome||""})`}); } }
  return escolhidas;
}
async function aplicarRecomendacao(x,forcar){ // grava no plano do GHE (mantém o que a equipe já editou)
  const a=S.data.analise[x.g.k]||{}; if(!forcar&&(a.planoAuto||Object.keys(a.acoes||{}).length)) return false;
  const rec=recomendar(x); if(!rec.length) return false; const acoes=forcar?{}:{...(a.acoes||{})};
  rec.forEach(r=>{ acoes[r.c]=acoes[r.c]||{resp:"",email:"",prazo:"",status:"pendente",auto:true,motivo:r.motivo}; });
  await saveAnalise(x.g.k,{acoes,planoAuto:hoje()}); return true;
}
async function recomendarTodos(forcar){ let n=0; for(const x of todasAnalises()) if(x.cat>=2&&await aplicarRecomendacao(x,forcar)) n++; return n; }

function linhaPlanoDesejada(x,c,comOperacao){

const CAMPOS_DONO={
  mapaRisco:["Cliente","Unidade","Setor","Posto Trabalho","Cargo","Atividade","Origem","Dt Avaliacao","Risco Global","Psicossocial/Cognitivo","Graduacao Psicossocial","Fatores Criticos","Psico"],
  fatorRisco:["Cliente","Unidade","Setor","Posto Trabalho","Cargo","Atividade","Origem","Grupo","Fator","Existe Fator Risco","Circunstancia Geradora","Consequencia","Medida Controle Existente","Criticidade","Probabilidade","Matriz","Pontuacao Risco","Graduacao Risco","Dt Identificacao","Psico"],
  planoAcao:["Cliente","Unidade","Setor","Posto Trabalho","Cargo","Atividade","Origem","Nr Acao","Acao Recomendada","Categoria Acao","Tipo Acao","Gestao Acao","Risco Global","Fator Risco Id","Fator Risco Nome","Psico"],
};
const igualDono=(col,a,b)=>CAMPOS_DONO[col].every(k=>JSON.stringify(a[k]??null)===JSON.stringify(b[k]??null));
const planoIntocado=r=>!r["Responsavel Acao"]&&!r["E-mail Responsavel"]&&!r["Dt Programada"]&&!r["Dt Conclusao"]&&(!r["Status Execucao"]||r["Status Execucao"]==="Nao iniciada")&&!(Array.isArray(r.Evidencias)&&r.Evidencias.length);
const SYNC={timer:null,rodando:false,pendente:false,msg:""};
function agendarSincronizacao(){ if(!SIGE()||EH_CLIENTE()||!S.data||!S.data.reg) return; clearTimeout(SYNC.timer); SYNC.timer=setTimeout(()=>sincronizarRegistro(false),1200); }
async function sincronizarRegistro(manual){
  if(!SIGE()||EH_CLIENTE()||!S.data||!S.data.reg) return;
  if(SYNC.rodando){ SYNC.pendente=true; return; }
  SYNC.rodando=true; const eid=S.eid, st=()=>$("#syncSt");
  try{
    if(await recomendarTodos(false)) render(); // GHEs com risco e ainda sem ações recebem a recomendação da biblioteca
    if(S.eid!==eid) return;
    const e=emp(), iso=isoAtual(), L=todasAnalises().filter(x=>x.cat!=null), D=S.data;
    const quer={mapaRisco:{},fatorRisco:{},planoAcao:{}};
    L.forEach(x=>{ const mr=linhaMapaDesejada(e,x); quer.mapaRisco[mr.id]=mr; linhasFatorDesejadas(e,x,iso).forEach(f=>quer.fatorRisco[f.id]=f);
      if(x.cat>=2) Object.keys(x.a.acoes||{}).forEach(c=>{ const r=linhaPlanoDesejada(x,c,false); quer.planoAcao[r.id]=r; }); });
    const atual={mapaRisco:D.reg.mapaRisco,fatorRisco:D.reg.fatorRisco,planoAcao:D.plano};
    const tarefas=[];
    for(const col of ["mapaRisco","fatorRisco","planoAcao"]){
      for(const [id,r] of Object.entries(quer[col])){ const ex=atual[col][id];
        if(!ex){ const novo=col==="planoAcao"?linhaPlanoDesejada(L.find(x=>x.g.k===r.Psico.g),r.Psico.c,true):col==="fatorRisco"?{...r}:r;
          if(col==="fatorRisco") novo.Status=L.find(x=>x.g.k===r.Psico.g).cat>=2?"Em andamento":"A validar";
          tarefas.push(async()=>{ const s_=await SIGE().salvar(col,novo); atual[col][id]=s_&&s_.id?s_:novo; }); }
        else if(!igualDono(col,ex,r)){ const novo={...ex,...r}; tarefas.push(async()=>{ const s_=await SIGE().salvar(col,novo); atual[col][id]=s_&&s_.id?s_:novo; }); } }
      for(const [id,ex] of Object.entries(atual[col])){ if(quer[col][id]) continue;
        if(col==="planoAcao"&&!planoIntocado(ex)) continue; // ação já trabalhada no Registro: fica
        tarefas.push(async()=>{ await SIGE().excluir(col,id); delete atual[col][id]; }); }
    }
    if(!tarefas.length){ SYNC.msg=`Registro do SIGE em dia (${Object.keys(quer.mapaRisco).length} setores/GHE, ${Object.keys(quer.fatorRisco).length} fatores, ${Object.keys(atual.planoAcao).length} ações).`; if(manual) toast("O Registro do SIGE já está em dia"); }
    else { let feitas=0, falhas=0; const fila=tarefas.slice();
      await Promise.all(Array.from({length:Math.min(4,fila.length)},async()=>{ while(fila.length){ const t=fila.shift(); try{ await t(); feitas++; }catch(err){ falhas++; } if(st()) st().textContent=`Atualizando o Registro do SIGE… ${feitas+falhas} de ${tarefas.length}`; } }));
      SYNC.msg=falhas?`Registro do SIGE atualizado com ${falhas} falha(s). Clique em “Atualizar Registro agora” para tentar de novo.`:`Registro do SIGE atualizado em ${new Date().toLocaleString("pt-BR").slice(0,17)} (${feitas} alteração(ões)).`;
      SIGE().avisarRegistro(); if(manual||falhas) toast(SYNC.msg); }
  }catch(err){ SYNC.msg="Não foi possível atualizar o Registro do SIGE agora."; if(manual) toast(SYNC.msg); }
  finally{ SYNC.rodando=false; if(st()) st().textContent=SYNC.msg; if(S.tab==="plano"&&S.eid===eid&&!document.activeElement?.matches?.("input,select,textarea")) render();
    if(SYNC.pendente){ SYNC.pendente=false; agendarSincronizacao(); } }
}

function itensPlano(){ return memo("itensPlano",()=>{
  const L=todasAnalises();
  if(!SIGE()||!S.data.plano) return L.flatMap(x=>Object.entries(x.a.acoes||{}).map(([c,v])=>({x,c,v,b:bib(c)||[],st:statusAcao(v)})));
  // V 1.27: a ação do plano é a mesma do Registro › Plano de Ação do SIGE (prazo, responsável, e-mail e status vêm de lá)

// V 1.27: grava o campo direto na ação do Registro › Plano de Ação (a API do SIGE aplica as regras de
// status/evidência e envia o e-mail ao responsável quando prazo, responsável e e-mail estão preenchidos).
async function salvarCampoPlano(gid,c,fld,val){
  const x=todasAnalises().find(y=>y.g.k===gid); if(!x) return;
  const id=idPlanoPsico(gid,c), atual=S.data.plano[id]||linhaPlanoDesejada(x,c,true);
  const mapa={prazo:"Dt Programada",resp:"Responsavel Acao",email:"E-mail Responsavel"};
  const novo={...atual};
  if(fld==="status"){ novo["Status Execucao"]=STATUS_SIGE[val]||"Nao iniciada"; if(val!=="concluida") novo["Dt Conclusao"]=""; }
  else if(fld==="_reenviar") novo._reenviarPsico=val;
  else novo[mapa[fld]]=val;
  try{ const r=await SIGE().salvar("planoAcao",novo); S.data.plano[id]=r&&r.id?r:novo;
    const v=vDeLinhaPlano(S.data.plano[id]);
    toast(fld==="_reenviar"?`E-mail reenviado para ${v.email}`:v.resp&&v.email&&v.prazo&&["prazo","resp","email"].includes(fld)?`Salvo · e-mail enviado para ${v.email}`:"Salvo");
    SIGE().avisarRegistro();
  }catch(err){ const cod=(err.body&&err.body.codigo)||""; toast(/EVID|JUSTIFICATIVA/.test(cod)?"Para concluir a ação, anexe a evidência (foto ou PDF) em Registro › Plano de Ação do SIGE. Sem evidência, só o Administrador conclui por lá, com justificativa e prazo.":(err.body&&err.body.erro||"Não foi possível salvar.")); }
  render();
}
async function notificarResponsavel(gid,c,forcar){
  const v=S.data.analise[gid]?.acoes?.[c]; if(!v) return;
  if(!window.ELEVA_EQUIPE){ toast("Salvo. O envio automático de e-mail funciona na versão instalada no SIGE."); return; }
  const b=bib(c)||[]; toast(`Enviando e-mail para ${v.email}…`);
  try{ const r=await ELEVA_EQUIPE.notificarAcao(S.eid,gid,c,{titulo:b[3]||c,recomendacao:b[8]||"",fator:dimNome(b[1])||"",indicador:b[12]||""},forcar);
    const a=await E(S.eid).collection("analise").doc(gid).get(); if(a.exists) S.data.analise[gid]=a.data();
    toast(r.jaEnviado?"E-mail já tinha sido enviado com estes dados":`E-mail enviado para ${v.email}`); }
  catch(err){ toast(err.body&&err.body.erro||"Não foi possível enviar o e-mail. Os dados foram salvos."); }
}

let REFERENCIAS=null; // texto salvo em config/laudo (uma referência por linha); null = padrão
const REF_OBRIGATORIAS=[[/\bNR[- ]?0?1\b(?!\d)/,0],[/\bNR[- ]?17\b/,1]]; // NR-01 e NR-17 sempre presentes
const referencias=()=>{ let t=linhas(REFERENCIAS||""); if(!t.length) t=REFERENCIAS_PADRAO.slice();
  const nr=REFERENCIAS_PADRAO.filter(r=>/^BRASIL\. Ministério do Trabalho e Emprego\. NR-(01|17) /.test(r));
  REF_OBRIGATORIAS.forEach(([re,i])=>{ if(!t.some(x=>re.test(x))&&nr[i]) t.push(nr[i]); });
  return t.sort((a,b)=>a.localeCompare(b,"pt-BR")); };

const TEXTOS_PADRAO={
 capa_selo:"AVALIAÇÃO PSICOSSOCIAL · HSE-IT · ISO 45003",
 capa_titulo:"Avaliação dos Fatores de Risco Psicossociais Relacionados ao Trabalho",
 apresentacao:"Este relatório foi elaborado pela ElevaLife com o objetivo de avaliar os fatores psicossociais relacionados ao trabalho na empresa {empresa}.\n\nA iniciativa visa compreender, de forma mais aprofundada, as percepções dos trabalhadores em relação às condições de trabalho, especialmente no que se refere às demandas, ao suporte recebido, à comunicação interna, à clareza de papéis e à gestão de mudanças. Essa análise é fundamental para complementar o diagnóstico de ergonomia e subsidiar ações estratégicas de promoção da saúde mental, melhoria do clima organizacional e prevenção de riscos psicossociais.",
 demanda:"A avaliação dos fatores psicossociais no ambiente de trabalho está alinhada às exigências da legislação trabalhista e de saúde e segurança do trabalho no Brasil, especialmente no que se refere à promoção da saúde mental, prevenção de agravos relacionados ao estresse ocupacional e à gestão dos riscos psicossociais.\n\nA NR 01 – Disposições Gerais e Gerenciamento de Riscos Ocupacionais (GRO), atualizada pela Portaria SEPRT nº 6.730/2020, estabelece que todo empregador deve implementar o Gerenciamento de Riscos Ocupacionais (GRO) por meio de um Programa de Gerenciamento de Riscos (PGR). Esse programa deve contemplar a identificação de perigos e a avaliação de riscos ocupacionais, incluindo os riscos psicossociais.\n\nA Portaria MTE nº 765, de 15 de maio de 2025, prorrogou até 25 de maio de 2026 o início da vigência da nova redação do capítulo \"1.5 Gerenciamento de riscos ocupacionais\" da Norma Regulamentadora nº 1 (NR-1), aprovada pela Portaria MTE nº 1.419, de 27 de agosto de 2024.\n\nA NR 17 – Ergonomia, por sua vez, também faz menção à necessidade de considerar aspectos psicossociais nas análises ergonômicas do trabalho. A norma orienta que as condições de trabalho devem ser adaptadas às características psicofisiológicas dos trabalhadores, promovendo conforto, segurança e desempenho eficiente. O texto reforça que, em atividades que envolvam carga mental elevada, ritmo intenso e pressão por produtividade, deve-se considerar os impactos sobre a saúde mental e emocional dos trabalhadores.\n\nAlém disso, a NR 07 – Programa de Controle Médico de Saúde Ocupacional (PCMSO), em sua nova redação conforme a Portaria nº 6.734/2020, reforça a importância da avaliação dos agravos à saúde relacionados a fatores psicossociais. O PCMSO deve considerar os riscos identificados no PGR, incluindo os de natureza psicossocial, e implementar ações preventivas e de acompanhamento, especialmente nas situações em que houver indícios de adoecimento mental relacionado ao trabalho.\n\nEssas diretrizes dialogam com os princípios da saúde ocupacional e da psicologia do trabalho, e também estão alinhadas a normas e recomendações internacionais, como as emitidas pela Organização Internacional do Trabalho (OIT) e pela Organização Mundial da Saúde (OMS), que reconhecem os fatores psicossociais como determinantes importantes da saúde no ambiente laboral.\n\nCom o objetivo de identificar fatores de risco psicossocial no ambiente de trabalho e promover ações preventivas e de melhoria, foi realizada uma avaliação junto aos colaboradores utilizando o questionário HSE (Health and Safety Executive – Management Standards Indicator Tool).\n\nO questionário HSE é uma ferramenta reconhecida internacionalmente, desenvolvida pelo governo do Reino Unido, que permite mensurar a percepção dos trabalhadores em relação a sete dimensões psicossociais associadas ao risco de estresse ocupacional. São elas: Demandas, Controle, Apoio da Chefia, Apoio dos Colegas, Relacionamentos, Cargo, Comunicação e Mudança.\n\nA aplicação ocorreu de forma anônima e voluntária, envolvendo um total de {nResp} colaboradores da empresa, abrangendo diferentes setores. Os dados obtidos oferecem uma visão ampla sobre os fatores de riscos psicossociais no ambiente organizacional e subsidiam o planejamento de ações voltadas à melhoria da qualidade de vida no trabalho, prevenção de adoecimentos e promoção de um ambiente laboral mais saudável e produtivo.\n\nEste relatório apresenta os resultados consolidados da avaliação, incluindo a média de pontuação por fator psicossocial do questionário HSE, a análise interpretativa dos dados de saúde, a avaliação da gestão dos fatores psicossociais de acordo com a ISO 45003 e recomendações práticas com base nos achados.",
 ferramenta_intro:"Para a avaliação dos fatores psicossociais no ambiente de trabalho, foi utilizado o **questionário HSE – Management Standards Indicator Tool**, desenvolvido pela agência governamental britânica Health and Safety Executive. Esta ferramenta é composta por **35 questões** que avaliam a percepção dos colaboradores em relação a **sete domínios psicossociais**:",
 ferramenta_dominios:"Demandas: carga de trabalho, padrões de tempo e ambiente de trabalho.\nControle: autonomia sobre o modo de realizar o trabalho.\nApoio da Gestão: apoio, incentivo e recursos fornecidos pelos gestores.\nApoio dos Colegas: suporte social entre colegas de equipe.\nRelacionamentos: promoção de relações positivas e gestão de conflitos.\nPapel: clareza em relação às funções e responsabilidades.\nMudança: como as mudanças organizacionais são gerenciadas e comunicadas.",
 ferramenta_escala:"As respostas seguem uma escala de frequência de cinco pontos: **1 – Nunca, 2 – Raramente, 3 – Às vezes, 4 – Frequentemente, 5 – Sempre**, sendo que, em alguns casos, as questões são invertidas para manter a coerência interpretativa dos resultados (isto é, quanto menor a pontuação, maior o risco psicossocial).",
 iso_intro:"Além da aplicação do questionário HSE, para cálculo da probabilidade, a presente avaliação foi complementada com base na norma ISO 45003:2021 – Gestão da Saúde e Segurança Psicológica no Trabalho, primeira norma internacional dedicada exclusivamente à gestão de riscos psicossociais no ambiente corporativo.\n\nA ISO 45003 fornece diretrizes práticas para identificar, avaliar e controlar fatores psicossociais que possam impactar negativamente a saúde, a segurança e o bem-estar dos trabalhadores. A norma está alinhada ao Sistema de Gestão de Saúde e Segurança Ocupacional da ISO 45001 e reforça a importância de integrar a saúde mental e o bem-estar na cultura organizacional.\n\nPara avaliar a **probabilidade de exposição aos riscos psicossociais**, foi utilizado um **checklist estruturado com base nos requisitos da ISO 45003**, respondido pelo gestor do contrato, abordando oito áreas principais:",
 iso_areas:"Análise Documental e Indicadores de Saúde Ocupacional: verifica se a empresa monitora afastamentos por doenças mentais ou osteomusculares (CID F e M), taxas de absenteísmo e turnover, acidentes relacionados a estresse ou fadiga, a existência de AETs atualizadas e a inclusão dos riscos psicossociais no PGR.\nIdentificação de Riscos Psicossociais: avalia se a organização possui processos estruturados para identificação contínua dos riscos psicossociais, com participação dos trabalhadores e capacitação das lideranças.\nOrganização do Trabalho e Demandas: investiga a gestão da carga de trabalho, realismo de prazos e metas, autonomia funcional, variedade de tarefas e possibilidade de descanso adequado.\nAmbiente e Cultura Organizacional: examina o comprometimento da empresa com um ambiente seguro, inclusivo e respeitoso, com políticas contra assédio e discriminação, comunicação efetiva e ações de reconhecimento.\nSuporte Social e Bem-Estar: analisa a disponibilidade de programas de suporte emocional, ações que estimulem a colaboração, canais seguros de denúncia e incentivo ao cuidado com a saúde integral.\nGestão de Mudanças: avalia como as mudanças organizacionais são comunicadas e gerenciadas, e se há suporte emocional para os colaboradores afetados.\nEquilíbrio Trabalho-Vida Pessoal: verifica a existência de políticas de flexibilidade, respeito às pausas, áreas de descompressão e incentivo a atividades de bem-estar.\nMonitoramento e Melhoria Contínua: investiga se a empresa coleta dados sobre bem-estar e estresse, utiliza os resultados para implementar melhorias e revisa as ações periodicamente.",
 iso_pontuacao:"Cada item do checklist é respondido com “Sim” (1 ponto), “Parcial” (0,5 ponto) ou “Não” (0 ponto), e a pontuação final é interpretada da seguinte forma:",
 iso_faixas:"24 a 33 pontos: Gestão eficaz de riscos psicossociais.\n17 a 23,5 pontos: Gestão intermediária, melhorias recomendadas.\nMenos de 17 pontos: Gestão ineficaz dos riscos psicossociais, ações urgentes necessárias.",
 iso_fecho:"A utilização da ISO 45003 como referência metodológica permite uma avaliação mais ampla e estratégica, integrando aspectos documentais, estruturais e culturais da organização. Dessa forma, é possível identificar lacunas, priorizar ações preventivas e fortalecer a saúde mental como parte essencial da segurança do trabalho e da sustentabilidade organizacional.",
 prob_texto:"Para obter uma visão mais precisa e contextualizada dos riscos psicossociais no ambiente de trabalho, foi realizada uma análise integrada entre os resultados do questionário HSE – Management Standards Indicator Tool e a pontuação final do checklist baseado na ISO 45003. A média geral obtida no HSE reflete a percepção dos colaboradores em relação aos fatores psicossociais, enquanto o checklist da ISO 45003 permite avaliar a estrutura organizacional e as práticas de gestão voltadas à prevenção desses riscos.\n\nA probabilidade é determinada para cada um dos sete fatores do HSE: a **graduação do fator** (calculada pela média das respostas do grupo naquele fator) é cruzada com o **resultado do checklist ISO 45003**, conforme a matriz abaixo.\n\nO cruzamento desses dois resultados fornece uma estimativa mais robusta da probabilidade de ocorrência de riscos psicossociais relacionados ao trabalho. Quando o HSE indica graduação alta e o checklist da ISO 45003 aponta gestão ineficaz, a probabilidade é elevada, demandando ações corretivas urgentes. Já quando ambas as ferramentas apresentam resultados positivos, considera-se que a empresa possui gestão eficaz e ambiente de trabalho favorável à saúde mental e ao bem-estar dos colaboradores.\n\nO cruzamento resulta em uma probabilidade de cinco níveis, convertida proporcionalmente para a escala da matriz de risco adotada pela empresa (**{matriz}**), a mesma usada no Inventário de Riscos.",
 sev_intro:"A severidade segue o método ElevaLife de Severidade Intrínseca do Fator (SIF). A NR-01 determina que o nível de risco resulte da combinação entre a severidade dos possíveis danos e a probabilidade de sua ocorrência, mas não estabelece critérios prescritivos de severidade para os fatores psicossociais. A SIF separa essas duas dimensões: a **severidade** é um parâmetro pré-definido, derivado da literatura científica e estável entre organizações; a **probabilidade** é estimada a partir dos escores do HSE-IT e do contexto local (item 4.3).\n\nEm seguida, a severidade intrínseca é modulada pela Evidência Organizacional (EO), que traduz a realidade da empresa avaliada, inclusive as medidas de prevenção já implementadas, resultando na Severidade Final (SF), valor levado à matriz de risco.",
 sif_texto:"A SIF é um atributo do perigo, e não da exposição: responde à pergunta “qual é o pior desfecho plausível consistentemente associado a este domínio na literatura científica?”. É atribuída antes da coleta de dados, ancorada em referências científicas e normativas rastreáveis, e comum a todas as avaliações realizadas pelo método. A escala tem quatro níveis:",
 sif_classificacao:"A classificação dos sete domínios do HSE-IT foi atribuída a partir das revisões sistemáticas, meta-análises e documentos normativos de referência, enquadrando cada domínio no nível correspondente ao desfecho mais grave consistentemente reportado:",
 sif_concentracao:"A concentração dos valores nos níveis 3 e 4 decorre do critério do pior desfecho plausível, escolha conservadora e coerente com o princípio da precaução; seu efeito sobre a capacidade de diferenciação é compensado pela probabilidade obtida no HSE-IT e pela modulação pela evidência organizacional. Os níveis 1 e 2 permanecem disponíveis e são alcançados pela Severidade Final quando a evidência organizacional é baixa.",
 eo_texto:"A EO traduz a densidade e a consistência das evidências objetivas de materialização do dano no grupo avaliado. Nesta avaliação, foi estimada a partir da taxa de frequência de afastamentos dos últimos 12 meses informada pela empresa e do registro de casos graves (ideação suicida, burnout severo, hospitalização ou outra condição ameaçadora à vida), podendo ser ajustada com outros indicadores disponíveis, como afastamentos por transtornos mentais e comportamentais, rotatividade, horas extraordinárias, registros em canais de denúncia e passivo trabalhista. A EO é classificada em cinco níveis, convertidos em um valor ajustado (EOaj) de 0 a 4:",
 sf_texto:"A Severidade Final é obtida pela combinação ponderada da severidade intrínseca com a evidência organizacional:",
 sf_pesos:"O peso de 75% atribuído à evidência científica e de 25% à evidência organizacional permite que o contexto da empresa module a severidade, sem que a ausência de dano registrado a neutralize: uma EO muito baixa reduz a severidade potencial em, no máximo, um nível, e uma EO muito alta mantém a severidade máxima nos domínios de SIF crítica e pode elevar em um nível os domínios de severidade intermediária. A ausência de evidência de dano não constitui evidência de ausência de risco, sobretudo em desfechos de latência longa e subnotificação conhecida, como os transtornos mentais relacionados ao trabalho.\n\nO valor obtido, entre 0,75 e 4,00, é convertido proporcionalmente para a escala de severidade da matriz de risco adotada pela empresa (**{matriz}**), com arredondamento de 0,50 para o nível superior: 0,75 corresponde ao nível mais baixo da escala e 4,00 ao mais alto.",
 sf_limites:"A SF é um parâmetro de gestão de riscos ocupacionais de natureza coletiva: não constitui diagnóstico, não se aplica a indivíduos, não substitui avaliação clínica ou pericial e não estabelece nexo causal entre exposição e adoecimento de trabalhador determinado.",
 recomendacoes:"Ao final da análise dos fatores psicossociais, as recomendações são apontadas com foco na promoção da saúde mental e do bem-estar dos trabalhadores. Para os grupos com risco baixo ou muito baixo, mantêm-se as ações já realizadas pela empresa. Para os grupos com risco moderado ou superior, as ações são direcionadas aos fatores classificados com risco moderado ou superior e selecionadas a partir da Biblioteca Mestre de Intervenções Psicossociais da ElevaLife, priorizando medidas coletivas e organizacionais, conforme a hierarquia de controle.",
 dados_coleta:"A coleta das respostas do questionário HSE foi realizada de forma **online e anônima**, por meio de QR code disponibilizado aos colaboradores, respeitando os princípios éticos da confidencialidade e da voluntariedade. A matrícula foi utilizada apenas para liberar o acesso e impedir respostas duplicadas, sem vínculo com as respostas.\n\nO questionário foi aplicado {periodo}para {nCad} colaboradores cadastrados em {nUnid} unidades e {nGhe} setores ou grupos ocupacionais (GHE). A amostra final foi composta por **{nResp} respondentes**, o que representa uma adesão de {adesao}%.\n\nAs respostas foram tabuladas pela plataforma ElevaLife, que permitiu calcular:",
 dados_calculos:"A **média de pontuação** por item e por fator psicossocial;\nA **distribuição de respostas** em cada fator (percentual de respostas em cada nível de favorabilidade);\nA identificação dos **fatores com maior e menor pontuação**, permitindo destacar áreas críticas e prioritárias para intervenção.",
 resultados_intro:"Os resultados deste capítulo referem-se à **empresa {empresa} como um todo**, reunindo as respostas de todas as unidades e grupos ocupacionais avaliados. Os resultados de cada unidade e grupo ocupacional estão no capítulo seguinte.\n\nAbaixo estão apresentadas as médias da empresa por fator, obtidas através do questionário HSE-IT, calculadas com base nas respostas de **{nResp} trabalhadores**:",
 interpretacao_empresa:"A seguir, cada fator é analisado para a empresa como um todo quanto à probabilidade (resultado do HSE-IT somado à gestão avaliada pelo checklist ISO 45003, item 4.3) e à severidade (gravidade do fator ajustada pelas evidências da empresa, item 4.4). A combinação das duas define a graduação do risco (item 4.5).",
 ghe_intro:"Abaixo estão descritas a classificação de probabilidade e severidade por unidade e grupo ocupacional, além da graduação do risco psicossocial do grupo ocupacional e as recomendações.",
 interpretacao_ghe:"A seguir, cada fator é analisado quanto à probabilidade (resultado do HSE-IT somado à gestão avaliada pelo checklist ISO 45003, item 4.3) e à severidade (gravidade do fator ajustada pelas evidências do próprio grupo, item 4.4). A combinação das duas define a graduação do risco (item 4.5).",
 conclusao_fecho:"A implementação dessas ações depende do envolvimento das lideranças, da escuta ativa dos trabalhadores e do acompanhamento contínuo dos indicadores. Recomenda-se repetir a avaliação periodicamente, para verificar a eficácia das medidas adotadas e ajustar o plano de ação sempre que necessário.",
 encerramento:"O principal objetivo desta análise foi fornecer dados sobre as condições de trabalho a que estão sujeitos os trabalhadores da empresa, devendo, contudo, ser dada atenção especial ao atendimento das recomendações contidas no corpo do presente documento, com o objetivo de manter e assegurar as boas condições durante o desenvolvimento de suas atividades laborais.\n\nA empresa deve organizar cronograma para estudos e atendimento às recomendações contidas neste documento.\n\nA análise foi realizada no mês de {mesAno}, contendo {totalPaginas} folhas, sendo todas as páginas preenchidas no seu anverso, não contendo nada no verso, todas elas rubricadas e devidamente assinadas por extenso ao final.",

  let mapa={paginas:[],total:0};
  const desenhar=(final)=>{
    const doc=new jsPDFC({unit:"pt",format:"a4",compress:true});
    let temFontes=false; try{ if(window.BI&&BI.registrarFontesPDF){ BI.registrarFontesPDF(doc); temFontes=true; } }catch{}
    const FN=temFontes?"Montserrat":"helvetica", FT=temFontes?"MontserratAlternates":"helvetica";
    const fonte=(b,tam,tit)=>{ doc.setFont(tit?FT:FN,(tit||b)?"bold":"normal"); doc.setFontSize(tam); };
    const corT=h=>{ const c=hexRGB(h); doc.setTextColor(c[0],c[1],c[2]); }, corF=h=>{ const c=hexRGB(h); doc.setFillColor(c[0],c[1],c[2]); }, corL=(h,w)=>{ const c=hexRGB(h); doc.setDrawColor(c[0],c[1],c[2]); doc.setLineWidth(w||.5); };
    const {W,H,ML,MR,TOP,BOT}=PDFL, CW=W-ML-MR, LIM=H-BOT;
    let pag=1, y=TOP, hIdx=0; const tocPos=[];
    const novaPag=()=>{ doc.addPage(); pag++; y=TOP; };
    const garantir=h=>{ if(y+h>LIM){ novaPag(); return true; } return false; };
    const varsTot=t=>String(t).replace(/\{totalPaginas\}/g,final?String(mapa.total):"000");
    // ---- quebra de linhas de runs ----
    function palavras(runs){ const ws=[]; runs.forEach(r=>{ const tx=varsTot(r.x); const partes=tx.split(/(\s+)/); partes.forEach(p=>{ if(p==="") return; if(/^\s+$/.test(p)){ if(ws.length) ws[ws.length-1].esp=true; return; } ws.push({t:p,b:!!r.b,c:r.c,s:r.s,esp:false}); }); }); return ws; }
    function linhas(runs,larg,tamBase){ const ws=palavras(runs), out=[]; let lin=[],w=0;
      ws.forEach(p=>{ fonte(p.b,p.s||tamBase); p.w=doc.getTextWidth(p.t); fonte(p.b,p.s||tamBase); p.e=doc.getTextWidth(" ");
        const prev=lin[lin.length-1]; const nw=lin.length?w+(prev.esp?prev.e:0)+p.w:p.w;
        if(nw>larg&&lin.length){ out.push(lin); lin=[p]; w=p.w; } else { lin.push(p); w=nw; } });
      if(lin.length) out.push(lin); return out; }
    function escreverLinha(lin,x,yy,larg,al,ultima,tamBase,corBase){
      const soma=lin.reduce((a,p)=>a+p.w,0), nEsp=lin.slice(0,-1).filter(p=>p.esp).length, espN=lin.slice(0,-1).reduce((a,p)=>a+(p.esp?p.e:0),0);
      let gap=null; if(al==="j"&&!ultima&&nEsp>0) gap=(larg-soma)/nEsp;
      let cx=x; const tw=soma+espN; if(al==="c") cx=x+(larg-tw)/2; else if(al==="r") cx=x+larg-tw;
      lin.forEach((p,k)=>{ fonte(p.b,p.s||tamBase); corT(p.c||corBase); doc.text(p.t,cx,yy); cx+=p.w+(k<lin.length-1&&p.esp?(gap!=null?gap:p.e):0); });
    }
    function paragrafo(b){
      const tam=b.s||10, lh=tam*(b.lh||1.48), ind=b.ind||0, larg=CW-ind;
      if(b.pb&&y>TOP) novaPag();
      y+=b.sb||0; const ls=linhas(b.runs,larg,tam); const altura=ls.length*lh;
      if(b.keep) garantir(Math.min(altura+80,LIM-TOP)); else garantir(Math.min(lh*2,altura));
      if(b.mark){ garantir(lh); fonte(true,tam); corT(b.markCor||COR.wine); doc.text(b.mark,ML+ind-(b.markW||12),y+tam); }
      ls.forEach((lin,i)=>{ if(garantir(lh)&&b.mark&&i===0){} escreverLinha(lin,ML+ind,y+tam,larg,b.al||"j",i===ls.length-1,tam,b.c||COR.ink); y+=lh; });
      y+=b.sa!=null?b.sa:6;
    }
    function titulo(b){
      const cfg=[{s:14,c:COR.wine,sb:16,sa:10},{s:12,c:COR.wine,sb:14,sa:8},{s:11,c:COR.deep,sb:12,sa:6}][b.l];
      if(b.pb&&y>TOP) novaPag(); else { y+=cfg.sb; garantir(cfg.s+90); }
      if(b.toc){ tocPos.push(pag); if(final){ try{ doc.outline.add(null,b.x,{pageNumber:pag}); }catch{} } }
      fonte(true,cfg.s,true); corT(cfg.c); const ls=doc.splitTextToSize(b.x,CW);
      ls.forEach(t=>{ doc.text(t,ML,y+cfg.s); y+=cfg.s*1.3; });
      if(b.l===0){ corL(COR.wine,1); doc.line(ML,y+1,ML+CW,y+1); y+=4; }
      y+=cfg.sa;
    }
    function tabela(b){
      const tot=b.w.reduce((a,v)=>a+v,0), ws=b.w.map(v=>v/tot*CW), pad=4.5, padV=3;
      const medir=(row)=>{ let x=0, ci=0; return row.map(cel=>{ const span=cel.span||1, larg=ws.slice(ci,ci+span).reduce((a,v)=>a+v,0); ci+=span;
        const blocos=cel.p.map(pp=>{ const tam=pp.s||8.5; const ls=linhas(pp.runs,larg-pad*2,tam); return {pp,ls,tam,lh:tam*1.32}; });
        const h=blocos.reduce((a,bl)=>a+bl.ls.length*bl.lh+(bl.pp.sa||0),0)+padV*2; const r={cel,larg,blocos,h,x}; x+=larg; return r; }); };
      const linhasM=b.rows.map(medir).map(ms=>({ms,h:Math.max(14,...ms.map(m=>m.h))}));
      const desenharLinha=(lm)=>{ let x=ML; lm.ms.forEach(m=>{ if(m.cel.f){ corF(m.cel.f); doc.rect(x,y,m.larg,lm.h,"F"); }
          let yy=y+padV; const hTxt=m.h-padV*2; yy+=Math.max(0,(lm.h-padV*2-hTxt)/2);
          m.blocos.forEach(bl=>{ bl.ls.forEach((lin,i)=>{ escreverLinha(lin,x+pad,yy+bl.tam*.95,m.larg-pad*2,bl.pp.al||"l",true,bl.tam,bl.pp.c||m.cel.c||COR.ink); yy+=bl.lh; }); yy+=bl.pp.sa||0; });
          corL(COR.ln,.5); doc.rect(x,y,m.larg,lm.h,"S"); x+=m.larg; }); y+=lm.h; };
      const altTot=linhasM.reduce((a,l)=>a+l.h,0);
      if(b.keep&&altTot<LIM-TOP&&y+altTot>LIM) novaPag();
      const cab=b.hdr?linhasM[0]:null;
      linhasM.forEach((lm,i)=>{ if(y+lm.h>LIM){ novaPag(); if(cab&&i>0) desenharLinha(cab); } desenharLinha(lm); });
      y+=b.sa!=null?b.sa:8;
    }
    function imagem(b){ const w=Math.min(b.w,CW), h=b.h*(w/b.w); garantir(h+8); try{ doc.addImage(b.d,"PNG",ML+(CW-w)/2,y,w,h,undefined,"FAST"); }catch{} y+=h+8; }
    function sumario(){ fonte(true,16,true); corT(COR.wine); doc.text("Sumário",ML,y+16); y+=34;
      opc.toc.forEach((t,i)=>{ const tam=t.level===1?9.5:9, lh=tam*1.75; garantir(lh); const x=ML+(t.level===1?0:14); fonte(t.level===1,tam); corT(t.level===1?COR.deep:COR.ink);
        const num=final?String(mapa.paginas[i]||""):"00"; const wn=doc.getTextWidth(num); const maxT=CW-(x-ML)-wn-18; let tx=t.title; while(doc.getTextWidth(tx)>maxT&&tx.length>4) tx=tx.slice(0,-2); if(tx!==t.title) tx=tx.trim()+"…";
        doc.text(tx,x,y+tam); const wt=doc.getTextWidth(tx); corT(COR.mut); fonte(false,tam); let dots=""; const wd=doc.getTextWidth(". "); const nd=Math.max(0,Math.floor((CW-(x-ML)-wt-wn-10)/wd)); dots=". ".repeat(nd);
        doc.text(dots,x+wt+4,y+tam); fonte(t.level===1,tam); corT(COR.wine); doc.text(num,ML+CW,y+tam,{align:"right"});
        if(final&&mapa.paginas[i]) doc.link(x,y,CW-(x-ML),lh,{pageNumber:mapa.paginas[i]}); y+=lh; }); }
    // ---- capa ----
    if(opc.capa){ const c=opc.capa; try{ doc.addImage(c.img,"JPEG",0,0,W,H,undefined,"FAST"); }catch{}
      fonte(true,9.5); doc.setTextColor(201,154,160); doc.text(c.selo,ML,198,{charSpace:1.2});
      fonte(true,25,true); doc.setTextColor(255,255,255); const lt=doc.splitTextToSize(c.titulo,CW-20); let yy=238; lt.forEach(t=>{ doc.text(t,ML,yy); yy+=31; });
      yy+=26; fonte(true,15); const lr=doc.splitTextToSize(c.empresa,CW); lr.forEach(t=>{ doc.text(t,ML,yy); yy+=20; });
      fonte(false,11); doc.setTextColor(235,217,219); doc.text(c.linha,ML,yy+6); novaPag(); }
    // ---- corpo ----
    blocos.forEach(b=>{ if(b.t==="p") paragrafo(b); else if(b.t==="h") titulo(b); else if(b.t==="tb") tabela(b); else if(b.t==="img") imagem(b); else if(b.t==="toc") sumario(); else if(b.t==="pb"){ if(y>TOP) novaPag(); } else if(b.t==="esp") { y+=b.h||8; } });
    // ---- cabeçalho e rodapé ----
    const total=doc.getNumberOfPages();
    for(let i=opc.capa?2:1;i<=total;i++){ doc.setPage(i);
      try{ doc.addImage(opc.logo,"PNG",W-MR-112,24,112,18.7,undefined,"FAST"); }catch{}
      corL(COR.ln,.6); doc.line(ML,48,W-MR,48); doc.line(ML,H-40,W-MR,H-40);
      fonte(false,7.5); corT(COR.mut); doc.text(opc.rodape,ML,H-28); fonte(true,8); corT(COR.wine); doc.text(String(i),W-MR,H-28,{align:"right"}); }
    return {doc,tocPos,total};
  };
  const p1=desenhar(false); mapa={paginas:p1.tocPos,total:p1.total};
  const p2=desenhar(true);
  return p2.doc.output("blob");
}

function pendencias(){
  const L=todasAnalises(), e=emp(), pend=[];
  if(!roster().size) pend.push(["Importar a planilha de colaboradores","colab"]);
  if(!S.data.resps.length) pend.push(["Aguardando respostas do HSE-IT","coleta"]);
  if(!isoAtual()) pend.push(["Checklist ISO 45003 não respondido","iso"]);
  const semTF=L.filter(x=>x.T.n&&x.eo==null).length; if(semTF) pend.push([`${semTF} GHE(s) sem taxa de frequência`,"tf"]);
  const semPlano=L.filter(x=>x.cat>=2&&!Object.keys(x.a.acoes||{}).length).length; if(semPlano) pend.push([`${semPlano} GHE(s) com risco moderado ou acima sem ações selecionadas`,"plano"]);
  const semReal=L.filter(x=>x.cat!=null&&x.cat<=1&&!x.a.realizadas).length; if(semReal&&!e.realizadas) pend.push([`${semReal} GHE(s) com risco trivial/baixo sem ações já realizadas informadas`,"analise"]);
  if(!prof(e.ergId)||!prof(e.rtId)) pend.push(["Definir ergonomista e responsável técnico","dados"]);
  return pend;
}

async function baixarBackup(btn){

function kitTemplate(){ const b=atob(KIT_TPL_B64); const u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return new TextDecoder().decode(u); }
async function gerarKit(btn){
  if(!dl) return toast("Download indisponível nesta visualização");
  const e=emp(); if(!roster().size) return toast("Importe os colaboradores antes de gerar o kit");
  const salt=uid(), roster_={}; roster().forEach(c=>{ roster_[fnv(salt+c.k)]=[uNome(c.unidadeId),gNome(c.gheId),c.gheId]; });
  const data={empresa:{razao:e.razao,codigo:e.codigo,status:e.status,inicio:e.inicio,fim:e.fim},salt,roster:roster_,itens:ITENS,iso:ISO_SECOES,intro:INTRO,logo:LOGO_H,email:""};
  const html=kitTemplate().replace("/*__KIT_DATA__*/null",JSON.stringify(data).replace(/</g,"\\u003c"));
  try{ await dl.save({filename:`Kit de teste - ${e.razao.replace(/[\\/:*?"<>|]/g,"").slice(0,50)}.html`,data:new Blob([html],{type:"text/html"})}); }catch(err){ if(err.code!=="declined") toast("Não foi possível gerar o kit"); }
}
function lerCodigoKit(tok){ const [cab,b]=tok.split("."); const s=b.replace(/-/g,"+").replace(/_/g,"/"); const j=JSON.parse(decodeURIComponent(escape(atob(s+"===".slice((s.length+3)%4))))); return {tipo:cab==="ELV1I"?"I":"H",...j}; }
async function importarKit(texto,st){
  const e=emp(), toks=[...new Set(texto.match(/ELV1[HI]\.[A-Za-z0-9_-]+/g)||[])], res={h:0,dup:0,inv:0,outra:0,iso:0,isoDup:0};
  const R=roster(), partSet=new Set(S.data.part.map(p=>p.k)); let n=0;
  for(const t of toks){ n++; st.textContent=`Importando ${n} de ${toks.length}…`; let d; try{ d=lerCodigoKit(t); }catch{ res.inv++; continue; }
    if(String(d.e).toUpperCase()!==String(e.codigo).toUpperCase()){ res.outra++; continue; }
    if(d.tipo==="H"){ const k=matKey(d.m), c=R.get(k), r=[...String(d.r||"")].map(Number);
      if(!c||r.length!==35||r.some(v=>!(v>=1&&v<=5))){ res.inv++; continue; }
      if(partSet.has(k)){ res.dup++; continue; }
      const pref=E(S.eid).collection("participacao").doc(k); const p=await pref.get(); if(p.exists&&p.data().respondido===true){ res.dup++; partSet.add(k); continue; }
      const rid="r"+uid(); await E(S.eid).collection("respostas").doc(rid).set({k:rid,unidadeId:c.unidadeId,gheId:c.gheId,r,data:d.d||hoje()});
      await pref.set({k,respondido:true,unidadeId:c.unidadeId,gheId:c.gheId}); partSet.add(k); res.h++;
    } else { const r=[...String(d.r||"")]; if(r.length!==33||r.some(v=>!"SPN".includes(v))||!d.n){ res.inv++; continue; }
      const ref=E(S.eid).collection("iso").doc("main"), cur=await ref.get(); if(cur.exists&&isoCompleto(cur.data().r)){ res.isoDup++; continue; }
      await ref.set({nome:d.n,cargo:d.c||"",email:d.m||"",data:d.d||hoje(),r:Object.fromEntries(r.map((v,i)=>[i,v])),origem:"kit"}); res.iso++; }
  }
  return {toks:toks.length,...res};
}

async function respondente(eid){

}
function rRender(){

  if(RS.step==="mat"){
    c.innerHTML=head+`<div class="panel stack"><div class="eyebrow">${esc(e.razao)}</div><h1>Sua opinião sobre o trabalho</h1><p class="muted" style="margin:0">${INTRO}</p>
    <p style="margin:0"><b>Suas respostas são confidenciais.</b> A matrícula serve apenas para liberar o questionário e impedir respostas duplicadas: ela não fica ligada às suas respostas e não aparece em nenhum resultado.</p>
    <form id="fm" class="stack"><label class="f">Número de matrícula<input type="text" id="mat" class="big" inputmode="text" autocomplete="off" required></label>
    <span class="err" id="me">${esc(RS.erro)}</span>${avisoAcesso()}<button class="btn primary" type="submit" style="padding:.75rem" ${PODE_ESCREVER===false?"disabled":""}>Continuar</button></form></div>`+sair;
    $("#mat").focus(); $("#fm").onsubmit=async ev=>{ev.preventDefault(); await checarMat($("#mat").value)}; return bindSair();
  }
  if(RS.step==="conf"){ const x=RS.colab;
    c.innerHTML=head+`<div class="panel stack"><h2>Confirme seus dados</h2><p style="margin:0">Olá, <b>${esc(x.primeiro)}</b>. Você está cadastrado(a) em:</p>
