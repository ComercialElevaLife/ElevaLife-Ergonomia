a compromissos médicos/familiares previamente agendados.","EC-00","CP","Faltas não planejadas por compromissos médicos/familiares","Percentual de solicitações de ajuste pontual de escala atendidas"],["CTL-C03-PRE-005","ctl","Flexibilidade","Ausência de política formal de flexibilidade para retorno gradual após afastamento","Alto","H1","PRE","Instituir política de retorno gradual após afastamento","Implementar programa formal de retorno gradual ao trabalho após afastamentos por transtornos mentais ou outras condições relevantes, com acompanhamento de saúde ocupacional.","EC-00","MP","Recidiva de afastamento após retorno integral abrupto","Taxa de recidiva de afastamento em até 90 dias após retorno"],["CTL-C03-COR-003","ctl","Flexibilidade","Baixa flexibilidade para adaptação do posto a necessidades específicas (ex.: gestantes, PCD)","Alto","H1","COR","Assegurar adaptação do posto a necessidades específicas","Realizar Análise Ergonômica Preliminar para adaptação de postos a necessidades específicas (gestantes, PCD, retorno de afastamento), com plano de ação individualizado.","EC-02","CP","Postos não adaptados a necessidades específicas identificadas","Percentual de necessidades específicas identificadas com adaptação implementada"],["CTL-C03-PRE-006","ctl","Flexibilidade","Ausência de flexibilidade na alocação de férias conforme preferência do trabalhador","Baixo","H3","PRE","Considerar a preferência do trabalhador na alocação de férias","Formalizar processo de coleta de preferência de período de férias, com critério transparente de priorização quando houver conflito entre trabalhadores.","EC-00","CP","Férias alocadas sem considerar preferência manifestada","Percentual de férias alocadas conforme preferência manifestada"],["CTL-C03-COR-004","ctl","Flexibilidade","Rigidez no cumprimento de metas sem considerar variações individuais legítimas","Moderado","H3","COR","Incorporar variações individuais legítimas na avaliação de cumprimento de metas","Revisar o processo de avaliação de metas para considerar variações individuais legítimas (licenças, curva de aprendizagem, condições de saúde) antes de aplicar consequências.","EC-00","CP","Avaliações negativas de meta sem considerar variações legítimas","Percentual de avaliações de meta com variações legítimas consideradas"],["CTL-C03-PRE-007","ctl","Flexibilidade","Ausência de flexibilidade para trabalho remoto ocasional em situações pontuais","Baixo","H2","PRE","Permitir trabalho remoto ocasional em situações pontuais justificadas","Estabelecer política simples de trabalho remoto ocasional para situações pontuais justificadas (ex.: problema de saúde leve, imprevisto logístico), sem necessidade de aprovação formal extensa.","EC-00","CP","Solicitações de trabalho remoto ocasional negadas sem critério claro","Percentual de solicitações de trabalho remoto ocasional atendidas"],["CTL-C03-COR-005","ctl","Flexibilidade","Cultura de presenteísmo penalizando quem busca flexibilidade formalmente disponível","Moderado","H3","COR","Eliminar penalização informal a quem utiliza flexibilidade formalmente disponível","Capacitar lideranças para eliminar práticas informais de penalização (avaliação, oportunidades) a trabalhadores que utilizam políticas de flexibilidade formalmente disponíveis.","EC-00","CP","Diferença de avaliação/promoção entre usuários e não usuários de flexibilidade","Diferença de taxa de promoção entre usuários e não usuários de flexibilidade"],["CTL-C03-PRE-008","ctl","Flexibilidade","Ausência de canal para negociar individualmente ajustes razoáveis de jornada","Baixo","H3","PRE","Criar canal formal para negociação individual de ajustes razoáveis de jornada","Instituir canal formal (ex.: reunião periódica com RH/liderança) para negociação individual de ajustes razoáveis de jornada, dentro de critérios definidos.","EC-00","CP","Ajustes de jornada negociados apenas informalmente","Número de ajustes de jornada negociados formalmente por período"],["CTL-C04-COR-001","ctl","Influência sobre o trabalho","Ausência de influência sobre a definição de metas da própria função","Alto","H3","COR","Incorporar a visão do trabalhador na definição de metas da própria função","Incluir etapa de diálogo entre trabalhador e liderança na definição/revisão de metas individuais, antes da formalização.","EC-07","CP","Metas contestadas tecnicamente pelo trabalhador após publicação","Percentual de metas individuais definidas com etapa de diálogo prévio"],["CTL-C04-COR-002","ctl","Influência sobre o trabalho","Ferramentas e sistemas de trabalho impostos sem consulta aos usuários","Moderado","H2","COR","Incorporar a visão dos usuários na escolha de ferramentas e sistemas de trabalho","Incluir usuários finais na fase de avaliação/piloto de novas ferramentas e sistemas antes da decisão final de implementação.","EC-04","MP","Baixa adoção ou retrabalho após implementação de nova ferramenta","Percentual de implementações de ferramenta com piloto validado por usuários"],["CTL-C04-PRE-001","ctl","Influência sobre o trabalho","Ausência de influência sobre o dimensionamento da própria equipe","Moderado","H3","PRE","Incorporar a visão da liderança direta no dimensionamento da equipe","Incluir a liderança direta e, quando pertinente, a equipe, no processo de estudo de dimensionamento (EC-03) que afeta seu próprio time.","EC-03","MP","Dimensionamentos definidos sem input da liderança direta","Percentual de estudos de dimensionamento com input da liderança direta"],["CTL-C04-COR-003","ctl","Influência sobre o trabalho","Indicadores de desempenho definidos sem possibilidade de contestação técnica","Moderado","H3","COR","Assegurar canal de contestação técnica de indicadores de desempenho","Instituir processo formal para contestação técnica fundamentada de indicadores de desempenho considerados inadequados pelo trabalhador ou equipe.","EC-07","CP","Indicadores contestados sem canal formal de resposta","Percentual de contestações técnicas de indicador respondidas formalmente"],["CTL-C04-PRE-002","ctl","Influência sobre o trabalho","Ausência de influência sobre a alocação de recursos para o próprio trabalho","Moderado","H3","PRE","Incorporar o input do trabalhador na alocação de recursos para seu trabalho","Incluir consulta à equipe executora na priorização de investimento em recursos (equipamentos, sistemas) que afetam diretamente sua atividade.","EC-04","MP","Investimentos em recursos definidos sem consulta à equipe executora","Percentual de decisões de investimento em recursos com consulta prévia à equipe"],["CTL-C04-COR-004","ctl","Influência sobre o trabalho","Processos definidos por áreas de suporte sem considerar a realidade operacional","Alto","H2","COR","Incorporar a realidade operacional na definição de processos por áreas de suporte","Incluir validação obrigatória com representantes da operação antes da formalização de processos definidos por áreas de suporte (qualidade, compliance, TI).","EC-04","CP","Processos definidos por áreas de suporte com baixa aderência operacional","Percentual de novos processos com validação prévia da operação"],["CTL-C04-PRE-003","ctl","Influência sobre o trabalho","Ausência de espaço para questionar tecnicamente decisões que afetam o trabalho","Moderado","H3","PRE","Criar espaço formal para questionamento técnico de decisões que afetam o trabalho","Instituir rito formal (ex.: reunião técnica de revisão) onde decisões que afetam o trabalho possam ser questionadas tecnicamente antes de sua implementação definitiva.","EC-00","CP","Decisões implementadas sem espaço de questionamento técnico","Percentual de decisões relevantes com rito de questionamento técnico"],["CTL-C04-COR-005","ctl","Influência sobre o trabalho","Baixa influência de especialistas técnicos sobre decisões de sua área de expertise","Alto","H3","COR","Ampliar a influência de especialistas técnicos sobre decisões de sua expertise","Formalizar o parecer técnico de especialistas como etapa obrigatória (ainda que não vinculante) em decisões de sua área de expertise.","EC-00","MP","Decisões técnicas tomadas sem parecer do especialista da área","Percentual de decisões técnicas com parecer prévio do especialista"],["CTL-C04-COR-006","ctl","Influência sobre o trabalho","Ausência de mecanismo de revisão de metas quando premissas mudam","Moderado","H3","COR","Instituir mecanismo de revisão de metas quando premissas mudam","Estabelecer gatilhos formais de revisão de metas quando premissas relevantes (mercado, recursos, escopo) mudarem significativamente após sua definição.","EC-07","CP","Metas mantidas mesmo após mudança relevante de premissa","Percentual de metas revisadas após mudança relevante de premissa"],["CTL-C04-EST-001","ctl","Influência sobre o trabalho","Trabalhadores excluídos de decisões sobre redesenho do próprio processo de trabalho","Alto","H2","EST","Incluir trabalhadores nas decisões de redesenho do próprio processo","Incluir os trabalhadores executores como participantes ativos (não apenas informados) em projetos de redesenho do processo que executam diariamente.","EC-04","MP","Redesenhos de processo com baixa adesão dos executores","Percentual de projetos de redesenho de processo com participação ativa dos executores"],["CTL-C04-PRE-004","ctl","Influência sobre o trabalho","Ausência de influência sobre critérios de avaliação de desempenho da própria função","Moderado","H3","PRE","Incorporar o input do trabalhador nos critérios de avaliação da própria função","Incluir etapa de validação com os trabalhadores da função na definição ou revisão dos critérios de avaliação de desempenho aplicados a eles.","EC-00","CP","Critérios de avaliação contestados como não representativos da função","Percentual de critérios de avaliação validados previamente com a função"],["CTL-C04-EST-002","ctl","Influência sobre o trabalho","Decisões de terceirização/automação do próprio trabalho sem qualquer consulta","Alto","H1","EST","Incorporar comunicação e diálogo prévio em decisões de terceirização/automação","Estruturar processo de comunicação antecipada e, quando aplicável, diálogo com os trabalhadores impactados antes da decisão final de terceirização ou automação de suas atividades.","EC-00","MP","Decisões de terceirização/automação comunicadas apenas após implementação","Percentual de decisões de terceirização/automação com comunicação prévia"],["CTL-C04-PRE-005","ctl","Influência sobre o trabalho","Ausência de fórum estruturado para propor mudanças no desenho do próprio cargo","Baixo","H3","PRE","Criar fórum estruturado para revisão do desenho do próprio cargo","Instituir revisão periódica (ex.: anual) do desenho de cargo com participação do próprio ocupante, permitindo ajustes formais de escopo e responsabilidades.","EC-00","LP","Descrições de cargo desatualizadas frente à função real exercida","Percentual de cargos com revisão periódica de desenho realizada"],["LID-L01-EST-001","chf","Comunicação","Comunicação de decisões relevantes apenas via canais informais/rumores","Alto","H1","EST","Formalizar canais oficiais para comunicação de decisões relevantes","Instituir protocolo obrigatório de comunicação oficial e tempestiva de decisões relevantes pela liderança, eliminando a dependência de rumores como fonte primária de informação.","EC-00","CP","Decisões relevantes conhecidas primeiro por rumor","Percentual de decisões relevantes comunicadas oficialmente antes da circulação informal"],["LID-L01-PRE-001","chf","Comunicação","Ausência de comunicação clara sobre expectativas de desempenho","Moderado","H3","PRE","Assegurar clareza nas expectativas de desempenho comunicadas","Capacitar lideranças para comunicar expectativas de desempenho de forma objetiva e mensurável no início de cada ciclo/projeto.","EC-00","CP","Dúvidas recorrentes sobre o que é esperado do trabalhador","Percentual de trabalhadores que reportam clareza sobre expectativas em pesquisa de clima"],["LID-L01-COR-001","chf","Comunicação","Instruções de trabalho comunicadas de forma ambígua pela liderança","Moderado","H3","COR","Reduzir ambiguidade nas instruções de trabalho transmitidas pela liderança","Revisar a prática de repasse de instruções para incluir confirmação de entendimento (ex.: repetição pelo receptor) em tarefas críticas.","EC-00","CP","Erros por instrução mal interpretada","Taxa de erro associada a instrução mal compreendida"],["LID-L01-PRE-002","chf","Comunicação","Comunicação unidirecional sem espaço para perguntas","Moderado","H3","PRE","Criar espaço para perguntas nas comunicações da liderança","Instituir momento formal de perguntas e esclarecimentos após comunicados relevantes da liderança, presencial ou por canal assíncrono.","EC-00","CP","Comunicados sem espaço de pergunta registrado","Percentual de comunicados relevantes com espaço de pergunta associado"],["LID-L01-COR-002","chf","Comunicação","Informações estratégicas retidas pela liderança sem justificativa","Alto","H3","COR","Reduzir retenção injustificada de informação estratégica pela liderança","Definir diretriz clara sobre quais informações devem ser compartilhadas com a equipe e em que momento, reduzindo retenção discricionária sem critério.","EC-00","MP","Queixas de falta de transparência da liderança","Índice de percepção de transparência da liderança em pesquisa de clima"],["LID-L01-PRE-003","chf","Comunicação","Comunicação de mudanças feita apenas por e-mail sem espaço de diálogo","Baixo","H3","PRE","Incluir espaço de diálogo na comunicação de mudanças","Complementar comunicados de mudança por e-mail com reunião ou espaço síncrono de diálogo, especialmente para mudanças de maior impacto.","EC-00","CP","Mudanças comunicadas exclusivamente por e-mail","Percentual de mudanças relevantes com espaço de diálogo além do e-mail"],["LID-L01-PRE-004","chf","Comunicação","Linguagem técnica inacessível usada em comunicados a públicos operacionais","Baixo","H3","PRE","Adequar a linguagem de comunicados ao público operacional","Revisar comunicados antes da publicação para adequar a linguagem técnica ao nível de compreensão do público operacional.","EC-00","CP","Dúvidas recorrentes sobre termos técnicos em comunicados","Percentual de comunicados revisados quanto à acessibilidade de linguagem"],["LID-L01-COR-003","chf","Comunicação","Ausência de comunicação sobre o motivo de decisões impopulares","Moderado","H3","COR","Assegurar comunicação do racional por trás de decisões impopulares","Capacitar lideranças para comunicar o racional e o contexto de decisões impopulares, mesmo quando o resultado não pode ser alterado.","EC-00","CP","Decisões impopulares comunicadas sem explicação do racional","Percentual de decisões impopulares com racional comunicado formalmente"],["LID-L01-COR-004","chf","Comunicação","Comunicação de metas sem explicar o racional por trás dos números","Moderado","H3","COR","Explicar o racional das metas comunicadas às equipes","Incluir, na comunicação de metas, a explicação do racional e das premissas utilizadas em seu cálculo, reduzindo a percepção de arbitrariedade.","EC-07","CP","Metas percebidas como arbitrárias","Percentual de metas comunicadas com racional explicitado"],["LID-L01-PRE-005","chf","Comunicação","Falta de padronização na comunicação entre líderes de diferentes turnos/áreas","Baixo","H2","PRE","Padronizar a comunicação entre líderes de diferentes turnos/áreas","Instituir rotina formal de passagem de informação entre líderes de diferentes turnos/áreas, evitando divergência de orientação para a mesma equipe.","EC-04","CP","Orientações divergentes entre turnos/áreas para a mesma atividade","Número de divergências de orientação reportadas entre turnos"],["LID-L01-PRE-006","chf","Comunicação","Ausência de canal estruturado para comunicação ascendente (equipe->liderança)","Moderado","H2","PRE","Instituir canal estruturado de comunicação ascendente","Criar canal formal e seguro para comunicação ascendente (equipe para liderança), incluindo possibilidade de reporte anônimo quando pertinente.","EC-00","CP","Ausência de canal formal de comunicação ascendente","Volume de manifestações recebidas pelo canal ascendente por período"],["LID-L02-EST-001","chf","Feedback","Ausência de feedback contínuo sobre desempenho, apenas na avaliação anual","Alto","H3","EST","Instituir prática de feedback contínuo","Implementar rotina formal de feedback contínuo (ex.: mensal), complementando a avaliação anual, com registro simples e objetivo.","EC-00","MP","Trabalhadores que só recebem feedback na avaliação anual","Percentual de trabalhadores com feedback registrado fora do ciclo anual"],["LID-L02-COR-001","chf","Feedback","Feedback fornecido apenas quando há erro, nunca quando há acerto","Moderado","H3","COR","Equilibrar feedback positivo e corretivo","Capacitar lideranças para reconhecer e comunicar acertos de forma tão sistemática quanto os desvios, evitando feedback unicamente corretivo.","EC-00","CP","Feedback registrado majoritariamente negativo","Proporção de feedbacks positivos vs. corretivos registrados"],["LID-L02-COR-002","chf","Feedback","Feedback genérico sem exemplos concretos de comportamento observado","Moderado","H3","COR","Tornar o feedback específico e baseado em comportamento observado","Capacitar lideranças na técnica de feedback baseado em comportamento observável e exemplos concretos, evitando generalizações.","EC-00","CP","Feedback percebido como genérico ou injusto","Percentual de trabalhadores que consideram o feedback recebido específico e útil"],["LID-L02-COR-003","chf","Feedback","Feedback dado publicamente de forma constrangedora","Alto","H3","COR","Eliminar a prática de feedback público constrangedor","Estabelecer diretriz explícita de que feedback corretivo deve ocorrer em ambiente privado, com trilha de reporte para desvios dessa prática.","EC-00","CP","Casos de feedback público constrangedor reportados","Número de reportes de feedback inadequado em público"],["LID-L02-PRE-001","chf","Feedback","Ausência de feedback estruturado durante o período de experiência","Moderado","H1","PRE","Instituir feedback estruturado durante o período de experiência","Formalizar checkpoints obrigatórios de feedback durante o período de experiência (ex.: 30/60/90 dias), com registro documentado.","EC-00","CP","Desligamentos em experiência sem feedback prévio documentado","Percentual de admissões com checkpoints de feedback registrados"],["LID-L02-COR-004","chf","Feedback","Feedback de desempenho sem plano de desenvolvimento associado","Moderado","H3","COR","Associar plano de desenvolvimento ao feedback de desempenho","Exigir que toda avaliação de desempenho seja acompanhada de um plano de desenvolvimento com ações e prazos definidos.","EC-00","CP","Avaliações de desempenho sem plano de desenvolvimento associado","Percentual de avaliações com plano de desenvolvimento formalizado"],["LID-L02-PRE-002","chf","Feedback","Liderança evita dar feedback negativo por conflito-aversão","Moderado","H5","PRE","Capacitar lideranças para superar a conflito-aversão no feedback negativo","Oferecer treinamento e suporte (ex.: role-play, mentoria) para lideranças com dificuldade de fornecer feedback negativo necessário.","EC-00","MP","Desempenho insatisfatório não comunicado ao trabalhador","Percentual de lideranças capacitadas em condução de feedback negativo"],["LID-L02-PRE-003","chf","Feedback","Ausência de canal para o trabalhador dar feedback à própria liderança","Baixo","H2","PRE","Criar canal para o trabalhador dar feedback à própria liderança","Instituir pesquisa ou canal periódico de feedback ascendente (avaliação da liderança pela equipe), com garantia de confidencialidade.","EC-00","CP","Ausência de canal de avaliação da liderança pela equipe","Taxa de participação na pesquisa de feedback ascendente"],["LID-L02-COR-005","chf","Feedback","Feedback inconsistente entre diferentes avaliadores para a mesma função","Moderado","H3","COR","Reduzir a inconsistência de feedback entre diferentes avaliadores","Instituir reunião de calibração entre líderes antes da formalização de avaliações de desempenho da mesma função/nível.","EC-00","CP","Discrepância de avaliação entre líderes para função equivalente","Percentual de avaliações submetidas a calibração prévia"],["LID-L02-PRE-004","chf","Feedback","Feedback recebido sem oportunidade de diálogo ou contestação","Moderado","H3","PRE","Assegurar espaço de diálogo sobre o feedback recebido","Formalizar etapa de diálogo (não apenas comunicação unilateral) na entrega de feedback, permitindo a manifestação do trabalhador.","EC-00","CP","Feedback comunicado sem espaço de resposta do trabalhador","Percentual de feedbacks com registro de diálogo bilateral"],["LID-L02-COR-006","chf","Feedback","Avaliação de desempenho sem calibração entre líderes, gerando incoerência","Moderado","H3","COR","Reduzir incoerência de avaliação por ausência de calibração","Implementar comitê de calibração de avaliações de desempenho entre lideranças da mesma área/nível, antes da consolidação final.","EC-00","CP","Incoerência de nota de avaliação entre áreas equivalentes","Dispersão de notas de avaliação entre áreas equivalentes"],["LID-L03-PRE-001","chf","Reconhecimento","Ausência de reconhecimento formal por desempenho acima do esperado","Moderado","H3","PRE","Instituir reconhecimento formal por desempenho acima do esperado","Criar programa formal de reconhecimento (financeiro e/ou simbólico) para desempenho consistentemente acima do esperado, com critérios objetivos.","EC-00","MP","Alto desempenho sem reconhecimento formal associado","Percentual de trabalhadores de alto desempenho com reconhecimento formal recebido"],["LID-L03-COR-001","chf","Reconhecimento","Reconhecimento concentrado em poucos 'favoritos' percebidos","Alto","H3","COR","Assegurar critérios objetivos e distribuição equitativa de reconhecimento","Revisar e tornar transparentes os critérios de reconhecimento, com auditoria periódica da distribuição para identificar concentração indevida.","EC-00","CP","Reconhecimento concentrado nos mesmos trabalhadores","Índice de concentração de reconhecimento entre a equipe"],["LID-L03-COR-002","chf","Reconhecimento","Conquistas da equipe atribuídas apenas à liderança","Moderado","H3","COR","Assegurar reconhecimento da equipe nas conquistas coletivas","Orientar lideranças a atribuir publicamente as conquistas da equipe de forma coletiva, evitando apropriação exclusiva pela liderança.","EC-00","CP","Conquistas coletivas comunicadas como mérito individual da liderança","Percentual de comunicações de conquista com menção explícita à equipe"],["LID-L03-PRE-002","chf","Reconhecimento","Ausência de reconhecimento para funções de suporte/retaguarda","Baixo","H3","PRE","Assegurar reconhecimento também para funções de suporte/retaguarda","Incluir funções de suporte/retaguarda nos critérios e ocasiões formais de reconhecimento, evitando reconhecimento restrito à linha de frente.","EC-00","CP","Funções de suporte ausentes em ações de reconhecimento","Percentual de ações de reconhecimento que incluem funções de suporte"],["LID-L03-PRE-003","chf","Reconhecimento","Reconhecimento apenas financeiro, sem reconhecimento simbólico/social","Baixo","H3","PRE","Diversificar as formas de reconhecimento além do financeiro","Complementar o reconhecimento financeiro com formas simbólicas e sociais (menção pública, certificado, oportunidades de visibilidade).","EC-00","CP","Reconhecimento restrito a bônus/premiação financeira","Percentual de reconhecimentos com componente simbólico/social"],["LID-L03-PRE-004","chf","Reconhecimento","Critérios de reconhecimento pouco claros ou não comunicados","Moderado","H3","PRE","Tornar claros e comunicados os critérios de reconhecimento","Documentar e comunicar amplamente os critérios objetivos utilizados para reconhecimento, eliminando a percepção de arbitrariedade.","EC-00","CP","Critérios de reconhecimento desconhecidos pela equipe","Percentual de trabalhadores que conhecem os critérios de reconhecimento"],["LID-L03-PRE-005","chf","Reconhecimento","Reconhecimento tardio, dissociado do momento do desempenho","Baixo","H3","PRE","Reduzir o intervalo entre desempenho e reconhecimento","Estabelecer prazo máximo entre o desempenho observado e o reconhecimento formal correspondente, evitando reconhecimento tardio e dissociado.","EC-00","CP","Reconhecimento formalizado meses após o desempenho observado","Tempo médio entre desempenho observado e reconhecimento formal"],["LID-L03-PRE-006","chf","Reconhecimento","Ausência de reconhecimento por esforço em situações de crise/urgência","Moderado","H3","PRE","Assegurar reconhecimento do esforço em situações de crise/urgência","Instituir protocolo de reconhecimento específico para esforço extraordinário em situações de crise/urgência, distinto do reconhecimento de rotina.","EC-00","CP","Situações de crise superadas sem reconhecimento formal do esforço","Percentual de situações de crise com reconhecimento formal do esforço da equipe"],["LID-L03-COR-003","chf","Reconhecimento","Comparações públicas depreciativas entre trabalhadores","Alto","H3","COR","Eliminar comparações públicas depreciativas entre trabalhadores","Estabelecer diretriz explícita contra comparações públicas depreciativas entre trabalhadores, com capacitação de lideranças e canal de reporte.","EC-00","CP","Casos de comparação pública depreciativa reportados","Número de reportes de comparação pública depreciativa"],["LID-L03-PRE-007","chf","Reconhecimento","Ausência de celebração de marcos e conquistas coletivas da equipe","Baixo","H4","PRE","Instituir celebração formal de marcos e conquistas coletivas","Criar rotina de celebração de marcos e conquistas coletivas da equipe (metas atingidas, aniversários de tempo de empresa, entregas relevantes).","EC-00","CP","Ausência de momentos de celebração coletiva","Número de celebrações coletivas realizadas por período"],["LID-L03-PRE-008","chf","Reconhecimento","Reconhecimento verbal sem qualquer registro formal na trajetória do trabalhador","Baixo","H3","PRE","Registrar formalmente o reconhecimento na trajetória do trabalhador","Formalizar o registro de reconhecimentos recebidos no histórico/trajetória do trabalhador, para além do reconhecimento verbal informal.","EC-00","CP","Reconhecimentos concedidos apenas verbalmente, sem registro","Percentual de reconhecimentos com registro formal na trajetória"],["LID-L04-COR-001","chf","Disponibilidade","Liderança inacessível para dúvidas e apoio no dia a dia","Alto","H3","COR","Ampliar a acessibilidade da liderança no dia a dia","Estabelecer horários mínimos garantidos de disponibilidade da liderança para dúvidas e apoio à equipe, comunicados formalmente.","EC-00","CP","Queixas de inacessibilidade da liderança","Índice de percepção de acessibilidade da liderança em pesquisa de clima"],["LID-L04-PRE-001","chf","Disponibilidade","Liderança presente fisicamente mas indisponível emocionalmente","Moderado","H5","PRE","Capacitar a liderança para presença emocional efetiva, não apenas física","Capacitar lideranças em escuta ativa e presença emocional, para que a disponibilidade física se traduza em suporte percebido pela equipe.","EC-00","MP","Percepção de indisponibilidade emocional apesar de presença física","Índice de percepção de suporte da liderança em pesquisa de clima"],["LID-L04-PRE-002","chf","Disponibilidade","Ausência de rotina estruturada de 1:1 entre líder e liderados","Moderado","H3","PRE","Instituir rotina estruturada de 1:1 entre líder e liderados","Formalizar rotina periódica obrigatória de reuniões individuais (1:1) entre líder e cada liderado, com pauta mínima definida.","EC-00","CP","Ausência de rotina de 1:1 registrada","Percentual de liderados com 1:1 realizado no período definido"],["LID-L04-EST-001","chf","Disponibilidade","Liderança sobrecarregada, sem tempo para gestão de pessoas","Alto","H1","EST","Reduzir a sobrecarga da liderança para viabilizar gestão de pessoas","Revisar a distribuição de atividades operacionais e de gestão da liderança, garantindo tempo protegido dedicado à gestão de pessoas.","EC-04","MP","Tempo da liderança consumido majoritariamente por atividades operacionais","Percentual do tempo da liderança dedicado à gestão de pessoas"],["LID-L04-COR-002","chf","Disponibilidade","Dificuldade de acesso à liderança em situações de urgência","Alto","H2","COR","Assegurar acesso à liderança em situações de urgência","Definir e comunicar canal e prazo de resposta da liderança para situações de urgência, com plano de contingência para sua ausência.","EC-00","CP","Situações de urgência sem resposta tempestiva da liderança","Tempo médio de resposta da liderança em situações de urgência"],["LID-L04-COR-003","chf","Disponibilidade","Liderança ausente em momentos críticos de decisão da equipe","Moderado","H3","COR","Assegurar presença da liderança em momentos críticos de decisão","Orientar lideranças sobre a importância de presença ativa em momentos críticos de decisão da equipe, revisando prioridades de agenda quando necessário.","EC-00","CP","Momentos críticos de decisão sem presença da liderança","Percentual de momentos críticos com presença da liderança registrada"],["LID-L04-EST-002","chf","Disponibilidade","Excesso de amplitude de controle (muitos liderados por líder)","Alto","H1","EST","Adequar a amplitude de controle da liderança à capacidade de gestão","Revisar a amplitude de controle (número de liderados por líder) com base em estudo de capacidade de gestão, redesenhando a estrutura quando excessiva.","EC-06","MP","Amplitude de controle acima de referência de boas práticas","Número médio de liderados por líder"],["LID-L04-PRE-003","chf","Disponibilidade","Ausência de liderança de plantão em turnos noturnos/fins de semana","Moderado","H1","PRE","Assegurar liderança de referência em turnos noturnos/fins de semana","Estruturar plano de cobertura de liderança (presencial ou remota) para turnos noturnos e fins de semana, evitando ausência total de referência de gestão.","EC-03","MP","Turnos sem qualquer liderança de referência disponível","Percentual de turnos com liderança de referência disponível"],["LID-L04-PRE-004","chf","Disponibilidade","Liderança acessível apenas por canais formais e demorados","Baixo","H2","PRE","Ampliar canais de acesso à liderança além dos formais e demorados","Complementar canais formais de acesso à liderança com canal ágil (ex.: mensagem instantânea) para questões que não podem aguardar o rito formal.","EC-00","CP","Tempo de espera por resposta em canal formal único","Tempo médio de resposta da liderança por canal"],["LID-L04-COR-004","chf","Disponibilidade","Falta de presença da liderança durante períodos de mudança organizacional","Alto","H1","COR","Assegurar presença da liderança durante períodos de mudança organizacional","Instituir plano de presença reforçada da liderança durante períodos de mudança organizacional, com maior frequência de comunicação e disponibilidade.","EC-00","CP","Ausência de liderança percebida durante períodos de mudança","Índice de percepção de suporte da liderança durante mudanças"],["LID-L05-EST-001","chf","Desenvolvimento da liderança","Líderes promovidos por competência técnica sem capacitação em gestão de pessoas","Alto","H1","EST","Assegurar capacitação em gestão de pessoas antes/durante a promoção a líder","Instituir trilha obrigatória de capacitação em gestão de pessoas para todo trabalhador promovido a posição de liderança, anterior ou concomitante à assunção do cargo.","EC-00","MP","Líderes promovidos sem qualquer capacitação prévia em gestão de pessoas","Percentual de novos líderes com capacitação em gestão de pessoas concluída"],["LID-L05-PRE-001","chf","Desenvolvimento da liderança","Ausência de capacitação em saúde mental e riscos psicossociais para lideranças","Alto","H1","PRE","Capacitar lideranças em saúde mental e riscos psicossociais","Incluir módulo obrigatório sobre identificação e manejo de riscos psicossociais na trilha de capacitação de lideranças, com foco em ISO 45003 e NR-1.","EC-00","MP","Líderes sem capacitação em identificação de risco psicossocial","Percentual de lideranças capacitadas em risco psicossocial"],["LID-L05-PRE-002","chf","Desenvolvimento da liderança","Líderes sem repertório para lidar com conflitos interpessoais na equipe","Moderado","H5","PRE","Prover repertório para lideranças lidarem com conflitos interpessoais","Oferecer capacitação específica em mediação de conflitos interpessoais para lideranças, com estudo de caso da própria operação.","EC-00","MP","Conflitos interpessoais mal conduzidos pela liderança","Percentual de lideranças capacitadas em mediação de conflitos"],["LID-L05-PRE-003","chf","Desenvolvimento da liderança","Ausência de avaliação de competências de liderança (apenas de resultado)","Moderado","H3","PRE","Incorporar competências de liderança na avaliação, além do resultado","Revisar o modelo de avaliação de lideranças para incluir competências de gestão de pessoas, não apenas indicadores de resultado.","EC-00","MP","Avaliação de liderança baseada exclusivamente em resultado","Percentual de líderes avaliados com componente de competência de gestão de pessoas"],["LID-L05-PRE-004","chf","Desenvolvimento da liderança","Falta de mentoria ou suporte para líderes de primeira viagem","Moderado","H3","PRE","Prover mentoria estruturada para líderes de primeira viagem","Instituir programa formal de mentoria para líderes de primeira viagem, com mentor experiente designado nos primeiros meses de gestão.","EC-00","MP","Líderes de primeira viagem sem qualquer suporte estruturado","Percentual de líderes de primeira viagem com mentor designado"],["LID-L05-EST-002","chf","Desenvolvimento da liderança","Líderes replicando estilo de gestão tóxico vivenciado no passado","Alto","H1","EST","Romper a reprodução de estilos de gestão tóxicos","Incluir avaliação de estilo de liderança (ex.: pesquisa com liderados) como critério de desenvolvimento e sucessão, interrompendo a naturalização de práticas de gestão tóxicas.","EC-00","MP","Estilo de gestão tóxico identificado e não endereçado","Percentual de líderes com avaliação de estilo de gestão pelos liderados"],["LID-L05-PRE-005","chf","Desenvolvimento da liderança","Ausência de trilha de desenvolvimento de liderança estruturada","Moderado","H1","PRE","Estruturar trilha de desenvolvimento de liderança","Formalizar trilha de desenvolvimento de liderança com módulos progressivos (técnico, comportamental, estratégico) e critérios claros de avanço.","EC-00","LP","Ausência de trilha estruturada de desenvolvimento de liderança","Percentual de líderes engajados em trilha formal de desenvolvimento"],["LID-L05-PRE-006","chf","Desenvolvimento da liderança","Líderes sem capacitação para conduzir conversas difíceis (desligamento, feedback negativo)","Moderado","H5","PRE","Capacitar lideranças para conduzir conversas difíceis","Oferecer treinamento específico (com prática simulada) para condução de conversas difíceis: desligamento, feedback negativo, comunicação de más notícias.","EC-00","MP","Conversas difíceis conduzidas sem preparo, gerando dano evitável","Percentual de lideranças capacitadas em condução de conversas difíceis"],["LID-L05-PRE-007","chf","Desenvolvimento da liderança","Ausência de espaço de troca entre pares de liderança sobre desafios de gestão","Baixo","H3","PRE","Criar espaço de troca entre pares de liderança","Instituir fórum periódico de troca entre pares de liderança para discussão de desafios de gestão e boas práticas.","EC-00","CP","Líderes isolados na resolução de desafios de gestão","Frequência de participação em fórum de troca entre líderes"],["LID-L05-PRE-008","chf","Desenvolvimento da liderança","Líderes não avaliados pela equipe (avaliação 360º ausente)","Moderado","H2","PRE","Instituir avaliação 360º incluindo a visão da equipe sobre a liderança","Implementar avaliação 360º para lideranças, incluindo formalmente a avaliação pelos próprios liderados, com uso responsável e confidencial dos dados.","EC-00","MP","Ausência de avaliação da liderança pela equipe","Percentual de líderes com avaliação 360º implementada"],["LID-L05-PRE-009","chf","Desenvolvimento da liderança","Ausência de critério de liderança inclusiva/diversidade na capacitação de gestores","Baixo","H1","PRE","Incorporar critério de liderança inclusiva na capacitação de gestores","Incluir módulo de liderança inclusiva e gestão da diversidade na trilha de capacitação de lideranças.","EC-00","LP","Ausência de critério de liderança inclusiva na capacitação","Percentual de líderes capacitados em liderança inclusiva/diversidade"],["LID-L06-COR-001","chf","Justiça organizacional","Critérios de promoção percebidos como pouco transparentes","Alto","H1","COR","Tornar transparentes os critérios de promoção","Documentar e comunicar amplamente os critérios objetivos utilizados nas decisões de promoção, com possibilidade de consulta pelo trabalhador sobre sua posição frente aos critérios.","EC-00","MP","Critérios de promoção desconhecidos ou percebidos como subjetivos","Percentual de trabalhadores que conhecem os critérios de promoção"],["LID-L06-COR-002","chf","Justiça organizacional","Aplicação inconsistente de normas disciplinares entre trabalhadores","Alto","H3","COR","Assegurar aplicação consistente de normas disciplinares","Instituir revisão por segunda instância (RH/compliance) antes da aplicação de medidas disciplinares, assegurando consistência entre casos semelhantes.","EC-00","CP","Aplicação inconsistente de medida disciplinar para situação semelhante","Percentual de medidas disciplinares com revisão de segunda instância"],["LID-L06-COR-003","chf","Justiça organizacional","Distribuição desigual de oportunidades de desenvolvimento entre a equipe","Moderado","H3","COR","Assegurar distribuição equitativa de oportunidades de desenvolvimento","Revisar e tornar transparentes os critérios de indicação para oportunidades de desenvolvimento (treinamentos, projetos especiais), com rodízio quando pertinente.","EC-00","CP","Oportunidades de desenvolvimento concentradas nos mesmos trabalhadores","Índice de concentração de oportunidades de desenvolvimento na equipe"],["LID-L06-EST-001","chf","Justiça organizacional","Ausência de canal confiável para denúncia de tratamento injusto","Alto","H1","EST","Instituir canal confiável para denúncia de tratamento injusto","Implementar canal de denúncia (ouvidoria/canal de ética) independente da hierarquia direta, com garantia de confidencialidade e proteção contra retaliação.","EC-00","CP","Ausência de canal confiável para reporte de tratamento injusto","Número de denúncias tratadas com garantia de confidencialidade"],["LID-L06-COR-004","chf","Justiça organizacional","Percepção de favoritismo na distribuição de tarefas atrativas","Moderado","H3","COR","Reduzir percepção de favoritismo na distribuição de tarefas","Estabelecer critério objetivo e rotativo para distribuição de tarefas atrativas/de maior visibilidade, evitando concentração recorrente nos mesmos trabalhadores.","EC-00","CP","Percepção de favoritismo na distribuição de tarefas atrativas","Índice de percepção de favoritismo em pesquisa de clima"],["LID-L06-EST-002","chf","Justiça organizacional","Diferenças salariais não justificadas entre funções equivalentes","Alto","H1","EST","Eliminar diferenças salariais não justificadas entre funções equivalentes","Realizar auditoria de equidade salarial entre funções equivalentes, corrigindo diferenças não justificadas por critérios objetivos (experiência, desempenho, escopo).","EC-07","LP","Diferenças salariais não justificadas identificadas em auditoria","Percentual de diferenças salariais não justificadas corrigidas"],["LID-L06-PRE-001","chf","Justiça organizacional","Processos de avaliação sem possibilidade de recurso/contestação","Moderado","H1","PRE","Assegurar possibilidade de recurso em processos de avaliação","Instituir processo formal de recurso/contestação para trabalhadores que discordem do resultado de sua avaliação de desempenho.","EC-00","CP","Avaliações contestadas sem canal formal de recurso","Percentual de avaliações com processo de recurso disponível e utilizado quando pertinente"],["LID-L06-COR-005","chf","Justiça organizacional","Decisões de desligamento percebidas como arbitrárias","Alto","H1","COR","Assegurar critérios objetivos e devido processo em decisões de desligamento","Formalizar critérios objetivos e checklist de devido processo (registro de desempenho, oportunidades de melhoria oferecidas) antes de decisões de desligamento por desempenho.","EC-00","MP","Desligamentos sem registro de devido processo","Percentual de desligamentos por desempenho com checklist de devido processo"],["LID-L06-PRE-002","chf","Justiça organizacional","Ausência de critério claro para distribuição de horas extras/plantões","Moderado","H2","PRE","Estabelecer critério claro para distribuição de horas extras/plantões","Definir e comunicar critério objetivo (ex.: rodízio) para distribuição de horas extras e plantões, evitando concentração ou percepção de favorecimento.","EC-00","CP","Distribuição desigual de horas extras/plantões entre a equipe","Índice de equidade na distribuição de horas extras/plantões"],["LID-L06-EST-003","chf","Justiça organizacional","Retaliação percebida contra quem reporta problemas","Alto","H1","EST","Eliminar retaliação contra quem reporta problemas","Formalizar e comunicar política de não retaliação, com monitoramento ativo de indicadores de carreira de quem utiliza canais de reporte, para identificar padrões de retaliação velada.","EC-00","MP","Casos percebidos ou reportados de retaliação após reporte de problema","Número de casos de retaliação identificados e tratados"],["LID-L06-EST-004","chf","Justiça organizacional","Ausência de política formal de prevenção a assédio moral na gestão","Alto","H1","EST","Instituir política formal de prevenção ao assédio moral na gestão","Implementar política formal de prevenção ao assédio moral, com capacitação obrigatória de lideranças, canal de denúncia e consequências claras para violações.","EC-00","CP","Ausência de política formal de prevenção a assédio moral","Percentual de lideranças capacitadas na política de prevenção ao assédio moral"],["COL-AC01-EST-001","col","Cooperação","Competição interna excessiva entre colegas prejudicando cooperação","Alto","H1","EST","Reduzir a competição interna excessiva entre colegas","Revisar o desenho de metas e incentivos para reduzir mecanismos que estimulem competição prejudicial entre colegas, substituindo por metas colaborativas quando aplicável.","EC-07","MP","Queixas de competição excessiva entre colegas","Índice de percepção de cooperação entre colegas em pesquisa de clima"],["COL-AC01-COR-001","col","Cooperação","Metas individuais conflitantes com metas coletivas da equipe","Moderado","H1","COR","Alinhar metas individuais às metas coletivas da equipe","Revisar a arquitetura de metas para eliminar conflitos entre objetivos individuais e coletivos, incluindo componente de meta de equipe na avaliação individual.","EC-07","MP","Metas individuais que penalizam cooperação com colegas","Percentual de metas individuais com componente de meta coletiva"],["COL-AC01-PRE-001","col","Cooperação","Ausência de rotina de colaboração entre funções complementares","Moderado","H2","PRE","Instituir rotina de colaboração entre funções complementares","Implementar rotina formal (ex.: reunião de alinhamento) entre funções complementares que dependem mutuamente para a entrega do processo.","EC-04","CP","Falhas de entrega por falta de alinhamento entre funções complementares","Percentual de funções complementares com rotina de alinhamento formal"],["COL-AC01-COR-002","col","Cooperação","Cultura de 'cada um por si' em situações de sobrecarga","Alto","H3","COR","Fomentar cultura de cooperação em situações de sobrecarga","Capacitar lideranças para identificar e mediar situações de sobrecarga desigual na equipe, incentivando ativamente a cooperação em vez de tolerar o 'cada um por si'.","EC-00","CP","Sobrecarga desigual sem apoio espontâneo entre colegas","Índice de percepção de apoio mútuo em situações de sobrecarga"],["COL-AC01-PRE-002","col","Cooperação","Ausência de reconhecimento à cooperação, apenas ao resultado individual","Moderado","H3","PRE","Reconhecer formalmente comportamentos de cooperação, não apenas resultado individual","Incluir critério de cooperação e apoio a colegas nos critérios formais de reconhecimento e avaliação, ao lado do resultado individual.","EC-00","CP","Reconhecimento restrito a resultado individual","Percentual de reconhecimentos com critério de cooperação incluído"],["COL-AC01-COR-003","col","Cooperação","Conflitos entre turnos/equipes por falta de alinhamento na passagem de trabalho","Moderado","H2","COR","Eliminar conflitos na passagem de trabalho entre turnos/equipes","Formalizar protocolo de passagem de turno (handover) com checklist padronizado, reduzindo retrabalho e atrito entre equipes.","EC-04","CP","Conflitos e retrabalho reportados na passagem de turno","Número de ocorrências de falha na passagem de turno por mês"],["COL-AC01-PRE-003","col","Cooperação","Recusa informal de apoio entre colegas por sobrecarga própria","Baixo","H1","PRE","Reduzir recusa de apoio entre colegas por sobrecarga individual","Tratar a causa raiz da sobrecarga individual (ver fator Demandas) e, complementarmente, criar norma explícita de disponibilidade mínima para apoio pontual entre colegas.","EC-00","MP","Solicitações de apoio entre colegas recusadas por sobrecarga","Percentual de solicitações de apoio entre colegas atendidas"],["COL-AC01-PRE-004","col","Cooperação","Ausência de mecanismo formal para solicitar ajuda de colegas","Baixo","H2","PRE","Criar mecanismo formal para solicitação de ajuda entre colegas","Instituir canal simples e visível (ex.: quadro de demandas, sistema de chamados internos) para solicitação e oferta de ajuda entre colegas.","EC-00","CP","Ajuda entre colegas dependente apenas de iniciativa informal","Número de solicitações de ajuda registradas e atendidas pelo canal formal"],["COL-AC01-COR-004","col","Cooperação","Rivalidade entre áreas dificultando cooperação em processos compartilhados","Alto","H3","COR","Reduzir rivalidade entre áreas em processos compartilhados","Mediar formalmente a relação entre áreas com histórico de rivalidade, com objetivos compartilhados explícitos para processos interdependentes.","EC-04","MP","Falhas em processos compartilhados atribuídas a rivalidade entre áreas","Número de falhas em processos interdependentes associadas a conflito entre áreas"],["COL-AC01-EST-002","col","Cooperação","Sistema de bonificação que penaliza quem ajuda colegas em vez da própria meta","Alto","H1","EST","Eliminar penalização a quem ajuda colegas no sistema de bonificação","Revisar a fórmula de bonificação para não penalizar o tempo dedicado a ajudar colegas, incluindo esse comportamento como critério positivo quando pertinente.","EC-07","MP","Bonificação reduzida por tempo dedicado a ajudar colegas","Percentual de fórmulas de bonificação revisadas para não penalizar cooperação"],["COL-AC01-PRE-005","col","Cooperação","Ausência de espaço para resolução colaborativa de problemas entre pares","Baixo","H2","PRE","Criar espaço formal de resolução colaborativa de problemas entre pares","Instituir rotina periódica (ex.: retrospectiva de equipe) para resolução colaborativa de problemas identificados no dia a dia.","EC-00","CP","Problemas recorrentes sem espaço coletivo de resolução","Frequência de rotinas de resolução colaborativa realizadas"],["COL-AC01-PRE-006","col","Cooperação","Novatos sem apoio estruturado dos colegas mais experientes","Moderado","H4","PRE","Estruturar apoio de colegas experientes a novatos","Instituir programa de 'colega padrinho/madrinha' para apoiar novos trabalhadores nos primeiros meses, com reconhecimento formal ao papel.","EC-00","CP","Novatos sem qualquer apoio estruturado de colegas","Percentual de novos trabalhadores com colega padrinho/madrinha designado"],["COL-AC01-COR-005","col","Cooperação","Cultura de comparação entre colegas em vez de cooperação mútua","Moderado","H3","COR","Substituir cultura de comparação por cultura de cooperação mútua","Capacitar lideranças para eliminar práticas de comparação direta entre colegas (rankings públicos, comentários comparativos) que minam a cooperação.","EC-00","CP","Práticas de comparação direta entre colegas reportadas","Índice de percepção de cultura de cooperação em pesquisa de clima"],["COL-AC02-PRE-001","col","Integração","Trabalhadores remotos/híbridos isolados do convívio social da equipe","Moderado","H4","PRE","Reduzir o isolamento social de trabalhadores remotos/híbridos","Instituir rotinas periódicas de convivência (presencial ou virtual) que incluam explicitamente trabalhadores remotos/híbridos, evitando sua exclusão social.","EC-00","CP","Trabalhadores remotos com baixa participação em momentos de equipe","Percentual de trabalhadores remotos/híbridos participando de rotinas de convivência"],["COL-AC02-PRE-002","col","Integração","Ausência de programa estruturado de integração de novos colaboradores","Moderado","H1","PRE","Instituir programa estruturado de integração de novos colaboradores","Implementar programa formal de onboarding social (não apenas técnico), incluindo apresentação à equipe e momentos de integração nas primeiras semanas.","EC-00","MP","Novos colaboradores sem programa de integração social","Percentual de novos colaboradores com programa de integração social completo"],["COL-AC02-PRE-003","col","Integração","Turnos isolados (noturno) com pouco contato com o restante da equipe","Moderado","H1","PRE","Reduzir o isolamento de turnos noturnos em relação ao restante da equipe","Incluir formalmente o turno noturno nas comunicações, eventos e rotinas de equipe, com adaptação de horário quando necessário.","EC-00","CP","Turno noturno excluído de comunicações e eventos da equipe","Percentual de comunicações/eventos que incluem o turno noturno"],["COL-AC02-COR-001","col","Integração","Terceirizados/PJs excluídos socialmente da equipe interna","Moderado","H3","COR","Reduzir a exclusão social de terceirizados/PJs da equipe interna","Orientar lideranças para incluir terceirizados/PJs em rotinas de convivência e reconhecimento da equipe, respeitando os limites legais da relação contratual.","EC-00","CP","Terceirizados/PJs excluídos de rotinas sociais da equipe","Percentual de terceirizados/PJs incluídos em rotinas de convivência da equipe"],["COL-AC02-PRE-004","col","Integração","Ausência de momentos formais de integração entre áreas diferentes","Baixo","H2","PRE","Instituir momentos formais de integração entre áreas diferentes","Criar rotina periódica de integração entre áreas com alta interdependência, para além do contato estritamente funcional.","EC-00","CP","Áreas interdependentes sem qualquer momento de integração social","Número de eventos de integração entre áreas realizados por período"],["COL-AC02-PRE-005","col","Integração","Trabalhadores com deficiência sem suporte de integração social adequado","Alto","H4","PRE","Assegurar suporte de integração social adequado a trabalhadores com deficiência","Capacitar a equipe em cultura de inclusão e acessibilidade comunicacional, assegurando suporte de integração social adequado a trabalhadores com deficiência.","EC-00","MP","Trabalhadores com deficiência reportando isolamento social","Índice de percepção de inclusão social por trabalhadores com deficiência"],["COL-AC02-COR-002","col","Integração","Rotatividade alta impedindo formação de vínculos duradouros na equipe","Moderado","H1","COR","Reduzir o impacto da alta rotatividade na formação de vínculos da equipe","Tratar as causas raiz da alta rotatividade (ver fatores Demandas/Controle) e, complementarmente, reforçar rotinas de integração rápida para novos ingressantes.","EC-00","MP","Alta rotatividade impedindo coesão de equipe","Taxa de rotatividade da equipe (turnover)"],["COL-AC02-PRE-006","col","Integração","Ausência de acolhimento após retorno de afastamento prolongado","Moderado","H4","PRE","Instituir acolhimento formal após retorno de afastamento prolongado","Formalizar protocolo de acolhimento da equipe e da liderança no retorno de afastamento prolongado, incluindo atualização de contexto e reintegração social gradual.","EC-00","CP","Retornos de afastamento sem qualquer acolhimento formal","Percentual de retornos de afastamento prolongado com protocolo de acolhimento aplicado"],["COL-AC02-COR-003","col","Integração","Divisão informal em 'panelinhas' excluindo parte da equipe","Moderado","H3","COR","Reduzir a exclusão social por divisão informal em subgrupos","Capacitar lideranças para identificar e mediar divisões informais que excluem parte da equipe, promovendo atividades que incluam todos os subgrupos.","EC-00","CP","Percepção de exclusão por divisão informal em subgrupos","Índice de percepção de inclusão social em pesquisa de clima"],["COL-AC02-PRE-007","col","Integração","Ausência de linguagem/cultura comum entre equipes de diferentes regiões/países","Baixo","H1","PRE","Reduzir barreiras culturais/linguísticas entre equipes de diferentes regiões","Oferecer suporte de tradução/interpretação cultural e momentos de integração intercultural entre equipes de diferentes regiões/países.","EC-00","MP","Dificuldades de integração associadas a barreira cultural/linguística","Índice de percepção de integração intercultural em pesquisa de clima"],["COL-AC02-PRE-008","col","Integração","Trabalhadores temporários/sazonais sem qualquer integração à cultura da equipe","Baixo","H4","PRE","Assegurar integração mínima de trabalhadores temporários/sazonais","Adaptar o programa de integração para incluir, de forma simplificada, trabalhadores temporários/sazonais, evitando sua total exclusão da cultura da equipe.","EC-00","CP","Temporários/sazonais sem qualquer integração formal","Percentual de temporários/sazonais com integração mínima realizada"],["COL-AC02-PRE-009","col","Integração","Falta de espaço físico/virtual comum que favoreça a convivência da equipe","Baixo","H2","PRE","Prover espaço físico/virtual comum que favoreça a convivência da equipe","Avaliar e adequar espaços físicos (copa, área comum) ou virtuais (canal informal) que favoreçam momentos espontâneos de convivência da equipe.","EC-05","MP","Ausência de espaço comum de convivência reportada","Percentual de equipes com espaço físico/virtual comum disponível"],["COL-AC03-EST-001","col","Compartilhamento de conhecimento","Conhecimento crítico retido informalmente por medo de perda de relevância","Alto","H1","EST","Reduzir a retenção informal de conhecimento crítico por medo de perda de relevância","Redesenhar critérios de valorização e carreira para reconhecer explicitamente quem compartilha conhecimento, reduzindo o incentivo à retenção por insegurança.","EC-00","MP","Conhecimento crítico concentrado por retenção deliberada","Número de processos críticos com apenas um detentor de conhecimento"],["COL-AC03-PRE-001","col","Compartilhamento de conhecimento","Ausência de cultura de documentação de processos e aprendizados","Moderado","H2","PRE","Instituir cultura de documentação de processos e aprendizados","Formalizar exigência mínima de documentação de processos e aprendizados relevantes, com tempo alocado na rotina para essa atividade.","EC-04","MP","Processos relevantes sem qualquer documentação","Percentual de processos críticos com documentação atualizada"],["COL-AC03-PRE-002","col","Compartilhamento de conhecimento","Ausência de espaço estruturado para troca de conhecimento entre colegas","Baixo","H2","PRE","Criar espaço estruturado para troca de conhecimento entre colegas","Instituir rotina periódica (ex.: sessão de compartilhamento técnico) para troca estruturada de conhecimento entre colegas.","EC-00","CP","Ausência de rotina de troca de conhecimento entre colegas","Frequência de sessões de compartilhamento de conhecimento realizadas"],["COL-AC03-PRE-003","col","Compartilhamento de conhecimento","Conhecimento técnico concentrado sem plano de sucessão/multiplicação","Alto","H2","PRE","Reduzir a concentração de conhecimento técnico sem plano de sucessão","Mapear conhecimento técnico crítico concentrado e estabelecer plano formal de multiplicação/sucessão, com prazo definido.","EC-04","MP","Conhecimento técnico crítico sem plano de sucessão","Percentual de conhecimentos críticos com plano de multiplicação em andamento"],["COL-AC03-PRE-004","col","Compartilhamento de conhecimento","Colegas mais experientes sem incentivo para mentorear novatos","Baixo","H3","PRE","Incentivar formalmente colegas experientes a mentorear novatos","Reconhecer formalmente (tempo alocado, menção em avaliação) o papel de colegas experientes que mentoreiam novatos.","EC-00","CP","Mentoria de novatos dependente apenas de boa vontade individual","Percentual de colegas experientes com papel de mentoria reconhecido formalmente"],["COL-AC03-COR-001","col","Compartilhamento de conhecimento","Lições aprendidas de erros não compartilhadas com o restante da equipe","Moderado","H2","COR","Assegurar compartilhamento de lições aprendidas de erros com a equipe","Instituir rotina formal de análise e compartilhamento de lições aprendidas após erros/incidentes relevantes, com foco em aprendizado coletivo, não em culpabilização individual.","EC-04","CP","Erros recorrentes por lição aprendida não compartilhada","Percentual de incidentes relevantes com lição aprendida documentada e compartilhada"],["COL-AC03-COR-002","col","Compartilhamento de conhecimento","Silos de conhecimento entre equipes que executam processos interdependentes","Alto","H2","COR","Reduzir silos de conhecimento entre equipes interdependentes","Instituir rotina de troca de conhecimento entre equipes interdependentes, incluindo rodízio temporário ou job rotation quando viável.","EC-04","MP","Falhas de processo por desconhecimento mútuo entre equipes interdependentes","Número de falhas de processo associadas a silo de conhecimento entre equipes"],["COL-AC03-PRE-005","col","Compartilhamento de conhecimento","Ausência de reconhecimento para quem compartilha conhecimento com os pares","Baixo","H3","PRE","Reconhecer formalmente quem compartilha conhecimento com os pares","Incluir o compartilhamento de conhecimento como critério formal de reconhecimento e avaliação de desempenho.","EC-00","CP","Compartilhamento de conhecimento não considerado na avaliação","Percentual de avaliações com critério de compartilhamento de conhecimento"],["COL-AC03-COR-003","col","Compartilhamento de conhecimento","Conhecimento tácito de boas práticas não capturado antes de desligamentos","Alto","H2","COR","Capturar conhecimento tácito antes de desligamentos","Instituir processo formal de captura de conhecimento tácito (entrevista de saída técnica, documentação final) antes da efetivação de desligamentos relevantes.","EC-04","CP","Perda de conhecimento tácito relevante em desligamentos","Percentual de desligamentos relevantes com captura de conhecimento tácito realizada"],["COL-AC03-PRE-006","col","Compartilhamento de conhecimento","Ferramentas de gestão do conhecimento existentes mas subutilizadas","Baixo","H2","PRE","Ampliar a utilização de ferramentas de gestão do conhecimento existentes","Revisar a usabilidade e promover capacitação sobre as ferramentas de gestão do conhecimento já disponíveis, identificando barreiras de adoção.","EC-04","CP","Baixa taxa de utilização das ferramentas de gestão do conhecimento","Taxa de utilização das ferramentas de gestão do conhecimento disponíveis"],["COL-AC03-PRE-007","col","Compartilhamento de conhecimento","Ausência de tempo dedicado para compartilhamento de conhecimento na rotina","Moderado","H1","PRE","Alocar tempo formal para compartilhamento de conhecimento na rotina","Incluir tempo formal alocado (ex.: horas por mês) para atividades de compartilhamento de conhecimento na carga de trabalho reconhecida.","EC-00","MP","Compartilhamento de conhecimento realizado apenas fora do tempo de trabalho reconhecido","Percentual de trabalhadores com tempo formal alocado para compartilhamento de conhecimento"],["COL-AC03-COR-004","col","Compartilhamento de conhecimento","Conhecimento compartilhado apenas informalmente, gerando informação desatualizada","Moderado","H2","COR","Formalizar e manter atualizado o conhecimento compartilhado informalmente","Migrar conhecimento crítico compartilhado apenas informalmente para repositório formal, com responsável designado por sua atualização periódica.","EC-04","CP","Informação desatualizada circulando informalmente entre colegas","Percentual de conhecimento crítico com repositório formal atualizado"],["COL-AC04-PRE-001","col","Apoio social","Ausência de suporte dos colegas em momentos de dificuldade pessoal","Moderado","H4","PRE","Fomentar cultura de suporte entre colegas em momentos de dificuldade pessoal","Promover, com apoio da liderança, uma cultura de suporte mútuo entre colegas em momentos de dificuldade pessoal, sem substituir o suporte profissional adequado quando necessário.","EC-00","CP","Dificuldades pessoais enfrentadas sem qualquer suporte de colegas","Índice de percepção de suporte social entre colegas em pesquisa de clima"],["COL-AC04-COR-001","col","Apoio social","Isolamento social de trabalhadores com baixo desempenho percebido","Moderado","H3","COR","Reduzir o isolamento social de trabalhadores com baixo desempenho percebido","Capacitar lideranças para identificar e mediar o isolamento social de trabalhadores com baixo desempenho percebido, endereçando a causa do desempenho sem permitir exclusão social.","EC-00","CP","Isolamento social associado a baixo desempenho percebido","Percentual de casos de baixo desempenho com mediação social realizada"],["COL-AC04-PRE-002","col","Apoio social","Ausência de cultura de checar o bem-estar dos colegas no dia a dia","Baixo","H4","PRE","Fomentar cultura de checagem informal do bem-estar entre colegas","Sensibilizar a equipe sobre a importância de checagens informais de bem-estar no dia a dia, sem burocratizar o cuidado mútuo.","EC-00","CP","Ausência de cultura de checagem informal de bem-estar","Índice de percepção de cuidado mútuo em pesquisa de clima"],["COL-AC04-PRE-003","col","Apoio social","Trabalhadores enlutados ou em crise pessoal sem apoio da equipe","Alto","H1","PRE","Assegurar apoio formal da equipe a trabalhadores enlutados ou em crise pessoal","Instituir protocolo formal de apoio (ex.: licença facilitada, redistribuição temporária de tarefas, contato da liderança) para trabalhadores enlutados ou em crise pessoal.","EC-00","CP","Trabalhadores em luto/crise pessoal sem qualquer apoio formal","Percentual de casos de luto/crise pessoal com protocolo de apoio aplicado"],["COL-AC04-PRE-004","col","Apoio social","Ausência de rede de apoio entre pares para temas de saúde mental","Alto","H4","PRE","Instituir rede de apoio entre pares para temas de saúde mental","Implementar programa formal de apoio entre pares (peer support) para temas de saúde mental, com capacitação e supervisão adequadas dos pares voluntários.","EC-00","MP","Ausência de rede de apoio entre pares para saúde mental","Percentual de trabalhadores com acesso a rede de apoio entre pares"],["COL-AC04-PRE-005","col","Apoio social","Silêncio da equipe diante de sinais de sofrimento de um colega","Alto","H4","PRE","Reduzir o silêncio da equipe diante de sinais de sofrimento de colegas","Capacitar toda a equipe (não apenas lideranças) em reconhecimento de sinais de sofrimento psíquico e em como agir/acionar apoio adequado.","EC-00","MP","Sinais de sofrimento de colegas não comunicados/acionados","Percentual de trabalhadores capacitados em reconhecimento de sinais de sofrimento"],["COL-AC04-EST-001","col","Apoio social","Cultura que desencoraja pedir ajuda por medo de ser visto como fraco","Alto","H1","EST","Reduzir o estigma associado a pedir ajuda no ambiente de trabalho","Estruturar campanha e prática de liderança que normalizem e valorizem o pedido de ajuda, reduzindo o estigma associado à vulnerabilidade no trabalho.","EC-00","MP","Baixa procura por apoio disponível por medo de estigma","Índice de percepção de segurança para pedir ajuda em pesquisa de clima"],["COL-AC04-PRE-006","col","Apoio social","Ausência de programa de apoio entre pares (peer support) estruturado","Moderado","H4","PRE","Instituir programa estruturado de apoio entre pares","Formalizar programa de apoio entre pares (peer support) com pares voluntários capacitados e escopo claro de atuação, complementar (não substituto) ao suporte profissional.","EC-00","MP","Ausência de programa formal de apoio entre pares","Percentual de equipes com programa de apoio entre pares implementado"],["COL-AC04-EST-002","col","Apoio social","Colegas testemunhas de assédio sem apoiar a vítima por medo de retaliação","Crítico","H1","EST","Assegurar que testemunhas de assédio possam apoiar a vítima sem medo de retaliação","Fortalecer a política de proteção a testemunhas de assédio, com garantia formal de não retaliação, canal de reporte conjunto (vítima e testemunha) e ação disciplinar imediata em casos de retaliação a testemunhas.","EC-00","IM","Testemunhas de assédio que não reportam por medo de retaliação","Número de casos de assédio reportados com apoio de testemunha"],["COL-AC04-PRE-007","col","Apoio social","Ausência de momentos informais de convivência que fortaleçam vínculos","Baixo","H4","PRE","Instituir momentos informais de convivência entre a equipe","Promover, com apoio da liderança, momentos informais periódicos de convivência da equipe (ex.: café coletivo, pausa compartilhada) que fortaleçam vínculos.","EC-00","CP","Ausência de momentos informais de convivência","Frequência de momentos informais de convivência realizados"],["COL-AC04-PRE-008","col","Apoio social","Trabalhadores com jornada/local isolado sem qualquer contato social no trabalho","Moderado","H1","PRE","Assegurar contato social mínimo para trabalhadores em jornada/local isolado","Estruturar rotina de contato social periódico (presencial ou remoto) para trabalhadores em jornada ou local de trabalho isolado, mitigando o isolamento social.","EC-00","MP","Trabalhadores isolados sem qualquer contato social estruturado","Percentual de trabalhadores isolados com rotina de contato social implementada"],["COL-AC04-COR-002","col","Apoio social","Falta de apoio mútuo em situações de erro, gerando culpa individual isolada","Moderado","H3","COR","Fomentar apoio mútuo em situações de erro, reduzindo culpa individual isolada","Capacitar lideranças e equipes em cultura de aprendizado com erro (just culture), incentivando apoio mútuo em vez de isolamento do responsável pelo erro.","EC-00","CP","Trabalhadores isolados pela equipe após cometer erro","Índice de percepção de cultura de apoio após erro em pesquisa de clima"],["COL-AC04-PRE-009","col","Apoio social","Ausência de suporte de colegas durante processos de adaptação a mudanças","Moderado","H4","PRE","Assegurar suporte de colegas durante processos de adaptação a mudanças","Fomentar papel ativo de colegas experientes no apoio à adaptação de outros durante processos de mudança (novo processo, sistema, estrutura), com reconhecimento formal desse papel.","EC-00","CP","Processos de mudança sem suporte de colegas para adaptação","Percentual de processos de mudança com suporte formal de colegas para adaptação"],["PAP-P01-PRE-001","car","Clareza de Papel","Ausência de descrição de cargo clara e atualizada","Moderado","H1","PRE","Assegurar descrição de cargo clara e atualizada","Revisar e atualizar periodicamente as descrições de cargo, assegurando clareza de escopo, responsabilidades e critérios de resultado esperado.","EC-06","MP","Descrições de cargo desatualizadas ou inexistentes","Percentual de cargos com descrição atualizada nos últimos 24 meses"],["PAP-P01-PRE-002","car","Clareza de Papel","Trabalhador desconhece os limites exatos de sua responsabilidade","Moderado","H3","PRE","Assegurar que o trabalhador conheça os limites de sua responsabilidade","Realizar reunião de alinhamento de papel entre líder e liderado no início do vínculo e após mudanças relevantes de escopo, com registro dos limites de responsabilidade.","EC-00","CP","Dúvidas recorrentes sobre limites de responsabilidade","Percentual de trabalhadores que reportam clareza sobre limites de responsabilidade"],["PAP-P01-EST-001","car","Clareza de Papel","Funções recém-criadas sem definição formal de escopo","Alto","H1","EST","Assegurar definição formal de escopo antes da criação de novas funções","Exigir definição formal de escopo, responsabilidades e critérios de resultado antes da abertura/preenchimento de qualquer nova função.","EC-06","MP","Novas funções ocupadas sem escopo formalmente definido","Percentual de novas funções com escopo formalmente definido antes da contratação"],["PAP-P01-COR-001","car","Clareza de Papel","Sobreposição de responsabilidades entre cargos sem distinção clara","Alto","H2","COR","Eliminar sobreposição de responsabilidades entre cargos","Mapear e revisar cargos com sobreposição de responsabilidades, redistribuindo formalmente as atribuições para eliminar ambiguidade.","EC-06","MP","Retrabalho ou conflito por sobreposição de responsabilidade entre cargos","Número de cargos com sobreposição de responsabilidade identificada e corrigida"],["PAP-P01-PRE-003","car","Clareza de Papel","Ausência de critério claro sobre a quem se reportar em diferentes situações","Moderado","H2","PRE","Assegurar clareza sobre a quem se reportar em diferentes situações","Documentar e comunicar matriz simples de reporte por tipo de situação (operacional, técnica, disciplinar), reduzindo ambiguidade sobre a quem recorrer.","EC-00","CP","Dúvidas sobre a quem reportar em situações específicas","Percentual de trabalhadores que conhecem a matriz de reporte por situação"],["PAP-P01-COR-002","car","Clareza de Papel","Expectativas de papel comunicadas de forma diferente por diferentes gestores","Moderado","H3","COR","Alinhar a comunicação de expectativas de papel entre diferentes gestores","Instituir reunião de calibração entre gestores que compartilham a mesma função/equipe, para alinhar a comunicação de expectativas de papel.","EC-00","CP","Expectativas de papel divergentes entre gestores para a mesma função","Número de divergências reportadas entre gestores sobre expectativas de papel"],["PAP-P01-PRE-004","car","Clareza de Papel","Ausência de manual/guia de função para novos ocupantes do cargo","Baixo","H2","PRE","Instituir manual/guia de função para novos ocupantes do cargo","Elaborar e manter atualizado um guia de função para cargos críticos, cobrindo escopo, responsabilidades, processos e critérios de sucesso.","EC-04","MP","Novos ocupantes do cargo sem guia de referência","Percentual de cargos críticos com guia de função disponível"],["PAP-P01-COR-003","car","Clareza de Papel","Mudanças de estrutura organizacional sem atualização da definição de papéis","Alto","H1","COR","Assegurar atualização da definição de papéis após mudanças estruturais","Incluir a revisão formal da definição de papéis como etapa obrigatória de todo projeto de mudança de estrutura organizacional.","EC-06","MP","Papéis desatualizados após reestruturação organizacional","Percentual de reestruturações com revisão formal de papéis associada"],["PAP-P01-PRE-005","car","Clareza de Papel","Trabalhador sem clareza sobre o que é ou não de sua alçada decidir","Moderado","H3","PRE","Assegurar clareza sobre a alçada de decisão do trabalhador","Documentar e comunicar a alçada de decisão de cada papel, com exemplos concretos de decisões dentro e fora da alçada.","EC-00","CP","Decisões tomadas ou evitadas indevidamente por dúvida de alçada","Percentual de trabalhadores com clareza declarada sobre sua alçada de decisão"],["PAP-P01-PRE-006","car","Clareza de Papel","Ausência de critério claro sobre o que compõe o 'resultado esperado' da função","Moderado","H3","PRE","Definir critério claro sobre o resultado esperado da função","Formalizar, para cada função, os critérios objetivos que definem o resultado esperado, evitando julgamento subjetivo do desempenho.","EC-07","CP","Avaliação de desempenho baseada em critério subjetivo de resultado","Percentual de funções com critério de resultado esperado formalizado"],["PAP-P01-PRE-007","car","Clareza de Papel","Cargos com nome genérico que não refletem o escopo real de atuação","Baixo","H2","PRE","Adequar a nomenclatura de cargos ao escopo real de atuação","Revisar a nomenclatura de cargos com nome genérico para refletir com mais precisão o escopo real de atuação, facilitando clareza interna e externa.","EC-06","LP","Nomenclatura de cargo não reflete o escopo real de atuação","Percentual de cargos revisados quanto à adequação da nomenclatura"],["PAP-P01-PRE-008","car","Clareza de Papel","Falta de clareza sobre responsabilidades em situações não previstas em procedimento","Moderado","H2","PRE","Assegurar clareza sobre responsabilidade em situações não previstas","Estabelecer diretriz geral de responsabilidade para situações não previstas em procedimento (ex.: escalonamento padrão), evitando paralisação por ausência de regra específica.","EC-00","CP","Situações não previstas em procedimento gerando paralisação por dúvida de responsabilidade","Número de situações não previstas resolvidas com base na diretriz geral"],["PAP-P02-COR-001","car","Conflito de Papel","Demandas conflitantes de diferentes gestores para a mesma função","Alto","H3","COR","Eliminar demandas conflitantes de diferentes gestores para a mesma função","Definir gestor de referência único para arbitrar conflitos de demanda quando a função responde a múltiplos gestores.","EC-00","CP","Conflitos de demanda entre gestores reportados pela mesma função","Número de conflitos de demanda resolvidos pelo gestor de referência"],["PAP-P02-COR-002","car","Conflito de Papel","Expectativas de diferentes stakeholders incompatíveis entre si","Alto","H3","COR","Reduzir incompatibilidade entre expectativas de diferentes
