<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="icon" href="/img/logo-icone-bordo.png">
<!-- S.I.G.E. V 1.27 - Riscos Psicossociais. Gerado a partir do protótipo; a ponte com a API do SIGE fica em js/psicossocial-sige.js -->
<script src="/js/calc.js"></script>
<script src="/js/psicossocial-sige.js"></script>
<script src="/js/pdf-fonts.js" defer></script>
</head>
<body style="margin:0">
<title>ElevaLife HSE-IT Coleta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat+Alternates:wght@600;700;800&family=Montserrat:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chartjs-plugin-datalabels/2.2.0/chartjs-plugin-datalabels.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
[hidden]{display:none!important}
/* Layout: console de operação — barra superior vinho, lateral de empresas + área de trabalho em abas; modo colaborador é um cartão único, mobile-first. Padrão visual ElevaLife (tema claro único). */
:root{
  color-scheme:light;
  /* marca ElevaLife */
  --wine:#8B3A42; --deep:#5E2A30; --mid:#A34E56; --soft:#C99AA0; --tint:#EBD9DB;
  --cream:#F5EFEA; --card:#FFFFFF; --ink:#3A2A2E; --mut:#8A7A78; --ln:#EADDE0;
  --ok:#2E7D5B; --teal:#3E7B7E; --warn:#C9822B; --bad:#B23A48; --crit:#7E1F2C;
  /* graduação (risco, HSE, probabilidade, severidade, EO): muito baixo/trivial azul claro · baixo verde · moderado amarelo · alto vermelho · muito alto roxo */
  --g0:#8CCBEB; --g1:#2E8B57; --g2:#F2C230; --g3:#C62828; --g4:#6A3D9A;
  --shadow:0 2px 10px rgba(94,42,48,.08);
  /* aliases usados pelos componentes */
  --bg:var(--cream); --surface:var(--card); --surface-2:var(--tint); --line:var(--ln);
  --fg:var(--ink); --muted:var(--mut); --accent:var(--wine); --accent-ink:#FFFFFF; --accent-soft:var(--tint); --danger:var(--bad);
  --display:"Montserrat Alternates","Montserrat",sans-serif; --body:"Montserrat",sans-serif; --mono:"Montserrat",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
@media (max-width:1280px) and (min-width:641px){html{font-size:15px}body{font-size:14px}}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;color:var(--deep)}
h1{font-size:1.6rem;color:var(--wine)} h2{font-size:1.3rem} h3{font-size:1rem;font-weight:700}
.mono,.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--wine);background:transparent;color:var(--wine);padding:.5rem .9rem;border-radius:9px;font-weight:600;font-size:.9rem}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--wine);color:#fff;border-color:var(--wine)}
.btn.primary:hover{background:var(--deep);border-color:var(--deep)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:.3rem .6rem;font-size:.82rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=search],input[type=email],input[type=number],select{width:100%;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.note a,.panel a:not(.btn){color:var(--wine,#8B3A42);font-weight:600}
label.f{display:grid;gap:.25rem;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0}
.top{display:flex;align-items:center;gap:1rem;padding:.8rem 16px;background:var(--deep);color:#fff;flex-wrap:wrap}
.top .muted{color:var(--tint)}
.top .pill.pend{background:var(--wine);color:#fff}
.brand{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
.brand b{font-family:var(--display);font-weight:800;font-size:1.3rem;color:#fff}
html.embutido .top{display:none}
html.embutido .shell{min-height:100vh}
.logo{background:#fff;border-radius:10px;padding:6px 12px;display:inline-flex}
.logo img{height:26px;width:auto;display:block}
.top .sp{flex:1}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:calc(100vh - 60px)}
@media (max-width:1100px){.shell{grid-template-columns:210px minmax(0,1fr)}}
@media (max-width:640px){.shell{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:.75rem;background:var(--surface)}
@media (max-width:640px){aside{border-right:0;border-bottom:1px solid var(--line)}}
.elist{display:flex;flex-direction:column;gap:.25rem}
.eitem{text-align:left;border:0;background:transparent;padding:.6rem .7rem;border-radius:8px;display:grid;gap:.1rem}
.eitem:hover{background:var(--surface-2)}
.eitem.on{background:var(--accent-soft)}
.eitem small{color:var(--muted);font-size:.78rem}
main{padding:clamp(12px,2vw,22px) clamp(12px,2vw,24px) 56px;min-width:0;max-width:1480px;width:100%;margin:0 auto}
.ctx{background:var(--card);border-bottom:1px solid var(--ln);position:sticky;top:0;z-index:5;box-shadow:0 1px 0 rgba(94,42,48,.04)}
.ctx-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:.6rem;padding:.6rem 24px;flex-wrap:wrap}
.ctx-in .sp{flex:1}
.crumb{border:0;background:none;font-family:var(--display);font-weight:700;color:var(--wine);padding:.3rem .2rem;font-size:.95rem}
.crumb:hover{color:var(--deep)}
.sep{color:var(--soft);font-weight:700}
.ctx-sel select{min-width:300px;max-width:520px;font-weight:600;color:var(--deep);background:var(--bg);border-color:var(--ln)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ehead{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;background:var(--card);border:1px solid var(--ln);border-left:4px solid var(--wine);border-radius:14px;padding:1rem 1.2rem;margin-bottom:1.1rem;box-shadow:var(--shadow)}
.ehead-t{flex:1 1 440px;min-width:0}
.ehead h1{font-size:1.45rem;margin:.2rem 0 0}
.ehead .eyebrow b{color:var(--deep);letter-spacing:.12em}
.cwrap{display:grid;grid-template-columns:clamp(196px,19vw,250px) minmax(0,1fr);gap:1.25rem;align-items:start}
.steps{display:flex;flex-direction:column;gap:.15rem;background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:.6rem;position:sticky;top:70px;box-shadow:var(--shadow)}
.sgrp{font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;padding:.75rem .55rem .25rem}
.step{display:flex;gap:.65rem;align-items:center;text-align:left;border:0;background:none;padding:.5rem .55rem;border-radius:9px;color:var(--ink);width:100%}
.step i{flex:none;width:1.65rem;height:1.65rem;border-radius:99px;display:grid;place-items:center;font-style:normal;font-size:.78rem;font-weight:700;border:1.5px solid var(--soft);color:var(--wine);background:var(--card)}
.step b{display:block;font-size:.86rem;font-weight:600;line-height:1.2}
.step small{display:block;font-size:.72rem;color:var(--mut);line-height:1.25;margin-top:.1rem}
.step:hover{background:var(--bg)}
.step.ok i{background:var(--ok);border-color:var(--ok);color:#fff}
.step.on{background:var(--tint)}
.step.on i{background:var(--wine);border-color:var(--wine);color:#fff}
.step.on b{color:var(--deep)}
.cbody{min-width:0}
.ctitle{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:1rem;padding-bottom:.8rem;border-bottom:1px solid var(--ln)}
.ctitle h2{margin:.15rem 0 0;font-size:1.3rem}
.kv{display:flex;justify-content:space-between;gap:1rem}
.kv span{color:var(--mut)}
.kv b{color:var(--deep);text-align:right}
.ftira{display:flex;gap:2px}
.ftira span{width:1.7rem;height:1.4rem;border-radius:4px;background:var(--c);color:#fff;font-size:.62rem;font-weight:700;display:grid;place-items:center;cursor:default}
.ftira span.nd{color:var(--mut)}
@media (max-width:800px){.cwrap{grid-template-columns:1fr}.steps{position:static;flex-direction:row;flex-wrap:wrap;padding:.5rem}.sgrp{display:none}.step{width:auto;flex:1 1 180px}}
@media (max-width:640px){.ctx-sel select{min-width:0;max-width:100%}.ctx-in,main{padding-inline:16px}}
.head{display:flex;gap:1rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:1rem}
.head .sp{flex:1}
.tabs{display:flex;gap:.25rem;border-bottom:1px solid var(--line);margin-bottom:1.25rem;overflow-x:auto}
.tab{border:0;background:none;padding:.6rem .9rem;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--wine);border-bottom-color:var(--wine)}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:1.1rem;min-width:0;box-shadow:var(--shadow)}
.grid{display:grid;gap:1rem}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g12{grid-template-columns:minmax(0,1fr) minmax(0,1.7fr)}
@media (max-width:820px){.g12{grid-template-columns:1fr}}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1rem}
.kpi{padding:.9rem 1rem}
.kpi .v{font-family:var(--display);font-size:1.8rem;font-weight:700;color:var(--wine);font-variant-numeric:tabular-nums}
.kpi.acc{border-color:var(--soft)}
.pill{display:inline-block;padding:.12rem .55rem;border-radius:99px;font-size:.75rem;font-weight:700;white-space:nowrap}
.pill.ok{background:#DCEFE6;color:#1F5C42}
.pill.pend{background:var(--tint);color:var(--deep)}
.risk{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;font-weight:600;white-space:nowrap}
.risk i{width:.7rem;height:.7rem;border-radius:3px;display:inline-block}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--deep);background:var(--tint);font-weight:600;padding:.55rem .6rem}
td{padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
tr.unit td{background:#FAF5F2;font-weight:600;color:var(--deep)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--accent)}
.row{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:.75rem}
.qrbox{display:grid;grid-template-columns:auto 1fr;gap:1.2rem;align-items:center}
@media (max-width:520px){.qrbox{grid-template-columns:1fr}}
.qr{background:#fff;padding:10px;border-radius:10px;width:184px;height:184px;border:1px solid var(--line)}
.qr img{width:100%;height:100%;image-rendering:pixelated}
.link{font-family:var(--mono);font-size:.8rem;background:var(--surface-2);padding:.5rem .6rem;border-radius:6px;word-break:break-all}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:1.2rem;text-align:center}
.drop.hov{border-color:var(--accent);background:var(--accent-soft)}
.note{font-size:.85rem;color:var(--muted);border-left:3px solid var(--line);padding-left:.7rem}
.empty{padding:2.5rem 1rem;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--deep);color:#fff;padding:.6rem 1rem;border-radius:8px;font-weight:600;font-size:.9rem;z-index:20;max-width:90vw}
.dist{display:grid;grid-template-columns:minmax(120px,190px) 1fr;gap:.45rem .8rem;align-items:center;font-size:.85rem}
.dist .s{display:flex;height:22px;border-radius:4px;overflow:hidden;background:var(--surface-2)}
.dist .s span{display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:#fff;overflow:hidden}
.legend{display:flex;gap:.9rem;flex-wrap:wrap;font-size:.78rem;color:var(--muted)}
.legend i{width:.7rem;height:.7rem;border-radius:2px;display:inline-block;margin-right:.3rem;vertical-align:-1px}
.chip{display:inline-block;padding:.15rem .6rem;border-radius:99px;font-size:.78rem;font-weight:700;white-space:nowrap;color:#fff;background:var(--c)}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:9px;overflow:hidden;flex-wrap:wrap}
.segb{border:0;background:var(--card);padding:.35rem .7rem;font-size:.8rem;font-weight:600;color:var(--mut)}
.segb+.segb{border-left:1px solid var(--ln)}
.segb.on{background:var(--wine);color:#fff}
.mtx th{font-size:.68rem;padding:.4rem}
.mtx td.mc{background:var(--c);color:#fff;text-align:center;min-width:64px;height:52px;padding:.3rem;border:2px solid var(--card)}
.mtx td.mc span{display:block;font-size:.66rem;font-weight:600;opacity:.9}
.mtx td.mc b{display:inline-block;margin-top:.15rem;background:rgba(255,255,255,.92);color:var(--ink);border-radius:99px;min-width:1.5rem;padding:0 .35rem;font-size:.8rem}
input.tf{width:90px;padding:.35rem .5rem}
textarea{width:100%;font:inherit;padding:.6rem .7rem;border:1px solid var(--ln);border-radius:8px;background:var(--card);color:var(--ink);resize:vertical}
details.acg{border:1px solid var(--ln);border-radius:10px;padding:.6rem .8rem}
details.acg summary{cursor:pointer}
.acao{display:grid;grid-template-columns:auto 1fr;gap:.7rem;align-items:start;padding:.6rem .7rem;border:1px solid var(--ln);border-radius:9px;cursor:pointer}
.acao.on{border-color:var(--soft);background:#FBF6F5}
.acao input{margin-top:.25rem;accent-color:var(--wine)}
.tag{font-size:.7rem;font-weight:600;background:var(--tint);color:var(--deep);padding:.05rem .45rem;border-radius:6px}
.codebox{display:inline-flex;gap:.5rem;align-items:baseline;background:var(--tint);color:var(--deep);border-radius:9px;padding:.4rem .8rem;font-size:.85rem;align-self:flex-start}
.codebox b{font-family:var(--display);font-size:1.2rem;letter-spacing:.12em}
.aviso{background:#FBEFEA;border:1px solid #F0C9B8;color:#7A3A1E;border-radius:9px;padding:.6rem .8rem;font-size:.88rem}
.pendb{display:flex;align-items:center;gap:.6rem;text-align:left;border:1px solid var(--ln);background:var(--card);border-radius:9px;padding:.55rem .75rem;font-size:.88rem;color:var(--ink)}
.pendb:hover{border-color:var(--wine)}
.pendb .dot{width:.55rem;height:.55rem;border-radius:99px;background:var(--warn);flex:none}
.cols{display:flex;align-items:flex-end;gap:2px;height:120px;border-bottom:1px solid var(--ln)}
.cols .col{flex:1;height:100%;display:flex;align-items:flex-end;min-width:3px;max-width:34px}
.cols .col span{display:block;width:100%;background:var(--wine);border-radius:3px 3px 0 0;min-height:1px}
.cols .col:hover span{background:var(--deep)}
.stk{display:flex;height:30px;border-radius:6px;overflow:hidden;gap:2px;background:var(--card)}
.stk span{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:.8rem;min-width:4px}
.stk.sm{height:12px;min-width:110px;border-radius:4px}
.hb{height:12px;background:var(--tint);border-radius:99px;overflow:hidden}
.hb span{display:block;height:100%;border-radius:99px}
.frow{display:grid;grid-template-columns:minmax(120px,170px) 1fr 3rem;gap:.7rem;align-items:center;font-size:.86rem}
.frow b{text-align:right}
tr.clk{cursor:pointer} tr.clk:hover td{background:#FBF6F5}
.modal{position:fixed;inset:0;background:rgba(58,42,46,.45);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;z-index:10;overflow:auto}
.modal .panel{width:min(640px,100%)}
/* respondent */
.resp{min-height:100vh;display:flex;justify-content:center;padding-block:24px;padding-inline:16px}
.rcard{width:min(620px,100%);display:flex;flex-direction:column;gap:1rem}
.rhead{display:flex;justify-content:space-between;align-items:center}
.prog{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--accent);transition:width .25s}
.q{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:1rem}
.q p{margin:0 0 .7rem;font-weight:500}
.q .n{font-family:var(--mono);color:var(--muted);font-size:.8rem;margin-right:.35rem}
.opts{display:grid;grid-template-columns:repeat(5,1fr);gap:.35rem}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:.55rem .3rem;font-size:.82rem;font-weight:600}
.opt.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.q.miss{border-color:var(--danger)}
.big{font-size:1.25rem;padding:.8rem 1rem;font-family:var(--mono);letter-spacing:.05em}
.err{color:var(--danger);font-weight:600;font-size:.9rem}
[style*="--g0)"],[style*="--g2)"]{color:var(--ink)!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app"><div class="empty">Carregando…</div></div>

  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const snap=p=>({id:p.split("/").pop(),exists:p in ST,data:()=>clone(ST[p]),metadata:{fromCache:false,hasPendingWrites:false}});
  const doc=p=>({id:p.split("/").pop(),path:p,get:async()=>snap(p),set:async d=>{ST[p]=clone(d);salvar()},update:async d=>{if(!(p in ST))throw{code:"invalid_argument"};Object.assign(ST[p],clone(d));salvar()},delete:async()=>{delete ST[p];salvar()},
    acquire:async()=>({acquired:true}),collection:c=>col(p+"/"+c),onSnapshot:(f)=>{const h=()=>f(snap(p));subs.add(h);h();return()=>subs.delete(h)}});
  const col=(c,F=[],O=null,Lm=0)=>{ const run=()=>{ const n=c.split("/").length+1; let ks=Object.keys(ST).filter(k=>k.startsWith(c+"/")&&k.split("/").length===n);
      ks=ks.filter(k=>F.every(([a,o,v])=>{const x=ST[k][a];return o==="=="?x===v:o==="!="?x!==v:o===">"?x>v:o===">="?x>=v:o==="<"?x<v:o==="<="?x<=v:o==="in"?v.includes(x):true}));
      if(O) ks.sort((a,b)=>{const x=ST[a][O[0]],y=ST[b][O[0]];return (x>y?1:x<y?-1:0)*(O[1]==="desc"?-1:1)}); else ks.sort();
      if(Lm) ks=ks.slice(0,Lm); const docs=ks.map(snap); return {docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false}}; };
    return {path:c,doc:id=>doc(c+"/"+(id||Math.random().toString(36).slice(2,12))),add:async d=>{const r=doc(c+"/"+Math.random().toString(36).slice(2,12));await r.set(d);return r},

function risco(score){ if(score==null) return null; const s=Math.round(score*100)/100; return RISCOS.find(r=>s>=r.min); }

let db=null, dl=null, veioDoPainel=false, ADMIN=true, CLIENTE=false, PODE_ESCREVER=null, AUTH_INFO=null;
async function listAll(col){
  const out=[]; let last=null;
  for(;;){ let q=col.orderBy("k"); if(last!==null) q=q.where("k",">",last); q=q.limit(1000);
    const s=await q.get(); s.docs.forEach(d=>out.push(d.data())); if(s.size<1000) break; last=s.docs[s.size-1].data().k; }
  return out;
}
const E = eid=>db.doc("empresas/"+eid);

// ===================== SCORING =====================
// resposta.r[i] = 1..5 (Nunca..Sempre). Favorabilidade: itens negativos invertidos.
function fav(i,v){ return NEG.has(ITENS[i][0]) ? 6-v : v; }
function tabular(resps){
  const out={n:resps.length,dims:{}};
  DIMS.forEach(d=>out.dims[d.id]={soma:0,cnt:0,dist:[0,0,0,0,0]});
  resps.forEach(r=>r.r.forEach((v,i)=>{ if(!v) return; const d=out.dims[ITENS[i][0]]; const f=fav(i,v); d.soma+=f; d.cnt++; d.dist[f-1]++; }));
  let tot=0,k=0;
  DIMS.forEach(d=>{ const x=out.dims[d.id]; x.score=x.cnt?x.soma/x.cnt:null; if(x.score!=null){tot+=Math.round(x.score*100)/100;k++;} });
  out.geral = k? tot/k : null; // média das 7 dimensões (igual Medsafe)
  return out;
}

const S={empresas:[],legado:[],eid:null,tab:"diag",data:null,loading:false,busca:"",escopo:"empresa",imp:null};

const SIGE=()=>window.ELEVA_SIGE||null;

const EXT_CAMPOS=["k","clienteId","razao","cnpj","codigo","status","inicio","fim","realizadas","tfGeral","ergId","rtId","stats","logo"];
const extDe=e=>{ const o={v:127}; EXT_CAMPOS.forEach(c=>{ if(e[c]!==undefined) o[c]=e[c]; }); return o; };
function empDeCliente(c,x){
  const end=[c.Logradouro,c.Numero,c.Complemento,c.Bairro,c.Cidade&&c.Estado?`${c.Cidade}/${c.Estado}`:c.Cidade,c.CEP?"CEP "+c.CEP:""].filter(Boolean).join(", ");
  return {...(x||{}),k:EID_PREFIXO+c.id,clienteId:c.id,razao:c.Cliente||"",cnpj:c.CNPJ||"",matriz:c["Matriz Risco"]||"Matriz 5x5",servicos:c.Servicos,
    temPsico:!Array.isArray(c.Servicos)||c.Servicos.includes("psicossocial"),logoChave:c.Logotipo||null,endereco:end,telefone:c.Telefone||"",cnae:c.CNAE||"",grau:c["Grau Risco NR4"]||"",_ext:!!x};
}
async function carregarEmpresas(){
  if(!SIGE()){ return; } // protótipo sem SIGE: lista vem do onSnapshot de "empresas"
  const [cls,exts]=await Promise.all([SIGE().listar("cliente",null,true),listAll(db.collection("empresas")).catch(()=>[])]);
  const mapa=new Map(exts.map(x=>[x.k,x]));
  S.empresas=cls.filter(c=>c&&c.id&&c.Cliente).map(c=>empDeCliente(c,mapa.get(EID_PREFIXO+c.id))).sort((a,b)=>a.razao.localeCompare(b.razao));
  const ids=new Set(cls.map(c=>EID_PREFIXO+c.id));
  S.legado=EH_ADMIN()?exts.filter(x=>x&&x.k&&!ids.has(x.k)&&!x.migradoPara&&x.v!==127):[];
  if(S.eid&&!S.empresas.find(e=>e.k===S.eid)){ S.eid=null; S.data=null; }
}
function emp(){ return S.empresas.find(e=>e.k===S.eid); }

async function lerDados(eid){
  if(SIGE()) return lerDadosSige(eid);
  const [unidades,ghes,part,resps,analise,iso]=await Promise.all([
    listAll(E(eid).collection("unidades")), listAll(E(eid).collection("ghes")),
    listAll(E(eid).collection("participacao")), listAll(E(eid).collection("respostas")),
    listAll(E(eid).collection("analise")), E(eid).collection("iso").doc("main").get()]);
  analise.forEach(limparPrazosAutomaticos);
  return {unidades,ghes,part:part.filter(p=>p.respondido===true),resps,analise:Object.fromEntries(analise.map(a=>[a.k,a])),iso:iso.exists?iso.data():null};
}
// V 1.27: estrutura (unidades, setores/GHE, colaboradores) e plano de ação vêm do SIGE.
async function lerDadosSige(eid){
  const e=S.empresas.find(x=>x.k===eid), cid=e.clienteId, SG=SIGE();
  const equipe=!EH_CLIENTE();
  const [uns,sets,cols,planoR,mapaR,fatorR,part,resps,analise,iso]=await Promise.all([
    SG.listar("unidade",cid,true), SG.listar("setor",cid,true), SG.listar("colaborador",cid,true), SG.listar("planoAcao",cid,true).catch(()=>[]),
    equipe?SG.listar("mapaRisco",cid,true).catch(()=>[]):[], equipe?SG.listar("fatorRisco",cid,true).catch(()=>[]):[],
    listAll(E(eid).collection("participacao")), listAll(E(eid).collection("respostas")),
    listAll(E(eid).collection("analise")), E(eid).collection("iso").doc("main").get()]);
  const unidades=uns.map(u=>({k:u.id,nome:u.Unidade})).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  const uPorNome=new Map(unidades.map(u=>[u.nome,u.k]));
  const ghes=sets.filter(x=>uPorNome.has(x.Unidade)).map(x=>({k:x.id,nome:x.Setor,unidadeId:uPorNome.get(x.Unidade),tipo:x["Tipo Setor"]==="GHE"?"GHE":"Setor",colab:{}})).sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
  const gPorNome=new Map(ghes.map(g=>[uNomeDe(unidades,g.unidadeId)+"|"+g.nome,g]));
  cols.forEach(c=>{ const g=gPorNome.get(c.Unidade+"|"+c.Setor); if(g&&c.Matricula) g.colab[matKey(c.Matricula)]=[String(c.Matricula),c.Nome||""]; });
  const porId=l=>Object.fromEntries(l.filter(r=>r.Origem===ORIGEM_PSICO).map(r=>[r.id,r]));
  return {unidades,ghes,part:part.filter(p=>p.respondido===true),resps,analise:Object.fromEntries(analise.map(a=>[a.k,a])),iso:iso.exists?iso.data():null,
    plano:porId(planoR),reg:{mapaRisco:porId(mapaR),fatorRisco:porId(fatorR)}};
}
const uNomeDe=(us,id)=>(us.find(u=>u.k===id)||{}).nome||"";
const ORIGEM_PSICO="Riscos Psicossociais";
// V 1.26: o prazo só vale quando foi informado no sistema. Versões antigas preenchiam
// o prazo sozinhas ao recomendar a ação; se ninguém mexeu na ação (sem responsável,
// e-mail ou aviso enviado), esse prazo automático é descartado e fica em branco.
function limparPrazosAutomaticos(a){ Object.values((a&&a.acoes)||{}).forEach(v=>{ if(v&&v.prazo&&!v.prazoManual&&!v.resp&&!v.email&&!v.notif) v.prazo=""; }); }
async function loadEmpresa(eid){
  S.loading=true; MZ_CACHE=null; render();
  try{ S.data=await lerDados(eid); }catch(err){ S.loading=false; S.data=null; S.erroCarga=err&&err.message||"Falha ao carregar"; render(); return; }
  S.erroCarga=null; S.loading=false; render();
  const e=emp();
  if(e&&SIGE()&&!e._ext){ try{ const d=await E(e.k).get(); if(d.exists){ const x=d.data(); EXT_CAMPOS.forEach(c=>{ if(c!=="razao"&&c!=="cnpj"&&x[c]!==undefined) e[c]=x[c]; }); e._ext=true; render(); } }catch{} }
  if(e&&ADMIN&&e.temPsico!==false){ const patch={}; if(!e.codigo) patch.codigo=gerarCodigo(); if(!e.status) patch.status="aberta"; const st=calcStats(); if(JSON.stringify(st)!==JSON.stringify(e.stats)) patch.stats=st; if(!e._ext||Object.keys(patch).length){ e._ext=true; saveEmp(patch).catch(()=>{}); } }
  if(e&&ADMIN&&SIGE()) agendarSincronizacao();
}
const gerarCodigo=()=>Array.from({length:6},()=>"ABCDEFGHJKLMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*32)]).join("");
function calcStats(){ // números resumidos guardados na empresa para o painel geral
  const L=todasAnalises(), iso=isoAtual(), R=roster(); const it=L.flatMap(x=>Object.values(x.a.acoes||{}));
  return {colab:R.size,unidades:S.data.unidades.length,ghes:S.data.ghes.length,resp:S.data.resps.length,iso:iso?iso.nome:null,
    cat:CAT.map((_,i)=>L.filter(x=>x.cat===i).length),classif:L.filter(x=>x.cat!=null).length,acoes:it.length,concl:it.filter(v=>v.status==="concluida").length,geral:S.data.resps.length?Math.round(tabular(S.data.resps).geral*100)/100:null};
}
// V 1.24: cálculos reaproveitados dentro de um mesmo desenho de tela (empresas com milhares de colaboradores)
let EM_RENDER=0; const MEMO={};
const memo=(k,fn)=>{ if(!EM_RENDER) return fn(); if(!(k in MEMO)) MEMO[k]=fn(); return MEMO[k]; };
const comMemo=fn=>{ EM_RENDER++; try{ return fn(); } finally{ if(--EM_RENDER===0) for(const k in MEMO) delete MEMO[k]; } };
function respsPorGhe(){ return memo("rpg",()=>{ const m=new Map(); (S.data?.resps||[]).forEach(r=>{ let a=m.get(r.gheId); if(!a) m.set(r.gheId,a=[]); a.push(r); }); return m; }); }
function roster(){ return memo("roster",rosterCalc); }
function rosterCalc(){ // matKey -> {mat,nome,gheId,unidadeId}
  const m=new Map(); if(!S.data) return m;
  S.data.ghes.forEach(g=>Object.entries(g.colab||{}).forEach(([k,[mat,nome]])=>m.set(k,{k,mat,nome,gheId:g.k,unidadeId:g.unidadeId})));
  return m;
}

  document.querySelectorAll("[data-goto]").forEach(b=>{ if(!b.onclick) b.onclick=()=>{S.tab=b.dataset.goto;render();scrollTo(0,0)}; });
  document.querySelectorAll("[data-abrir]").forEach(x=>x.onclick=()=>selecionarEmpresa(x.dataset.abrir));

function lerPlanilha(file){
  const rd=new FileReader();
  rd.onload=()=>{ try{
    const wb=XLSX.read(new Uint8Array(rd.result),{type:"array"}); const ws=wb.Sheets[wb.SheetNames.find(n=>/colaborador/i.test(n))||wb.SheetNames[0]];
    const aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:""});
    const hi=aoa.findIndex(r=>r.some(c=>/^\s*matr/i.test(c))); if(hi<0) throw new Error("Não encontrei a coluna Matrícula.");
    const h=aoa[hi].map(c=>String(c).toLowerCase());
    const ci={mat:h.findIndex(c=>/^\s*matr/.test(c)),nome:h.findIndex(c=>/^\s*nome/.test(c)),uni:h.findIndex(c=>/^\s*(unid|depart|estabelec)/.test(c)),ghe:h.findIndex(c=>/^\s*(ghe|ges|fun[cç])/.test(c))};
    const faltam=Object.entries(ci).filter(([,v])=>v<0).map(([k])=>({mat:"Matrícula",nome:"Nome",uni:"Unidade",ghe:"GHE"})[k]);
    if(faltam.length) throw new Error("Colunas não encontradas: "+faltam.join(", "));
    const rows=[],erros=[],vistos=new Set();
    aoa.slice(hi+1).forEach((r,i)=>{ const mat=String(r[ci.mat]).trim(),nome=String(r[ci.nome]).trim(),unidade=String(r[ci.uni]).trim(),ghe=String(r[ci.ghe]).trim();
      if(!mat&&!nome) return; const ln=`Linha ${hi+i+2}`;
      if(!matKey(mat)||!unidade||!ghe){erros.push(`${ln}: falta matrícula, unidade ou GHE`);return}
      if(vistos.has(matKey(mat))){erros.push(`${ln}: matrícula ${mat} repetida`);return}
      vistos.add(matKey(mat)); rows.push({mat,nome,unidade,ghe}); });
    S.imp={nome:file.name,rows,erros,nU:new Set(rows.map(r=>slug(r.unidade))).size,nG:new Set(rows.map(r=>slug(r.unidade)+"|"+slug(r.ghe))).size,tf:lerAbaTF(wb),acoes:lerAbaAcoes(wb)};
    render();
  }catch(e){toast(e.message||"Não consegui ler a planilha")} };
  rd.readAsArrayBuffer(file);
}
async function confirmarImport(){ const st=$("#impSt"); $("#impOk").disabled=true;
  try{ const im=S.imp; await aplicarRoster(im.rows,(a,b)=>st.textContent=`Gravando ${a} de ${b}…`);
    if(im.tf?.length) await aplicarTF(im.tf,st); if(im.acoes?.length) await aplicarAcoes(im.acoes,st);
    toast(`${im.rows.length} colaboradores importados`+(im.tf?.length?` · ${im.tf.length} taxas de frequência`:"")+(im.acoes?.length?` · ${im.acoes.length} ações já realizadas`:"")); S.imp=null; render(); }
  catch(e){ const msg="A importação foi interrompida: "+(e.message||e.code||"falha de conexão")+". Nada foi duplicado: confira a lista e importe a mesma planilha de novo para completar.";
    await loadEmpresa(S.eid).catch(()=>{}); S.tab="colab"; render(); const st2=$("#impSt"); if(st2){st2.className="err";st2.textContent=msg} else toast(msg); }

// Aplica linhas {mat,nome,unidade,ghe}: cria unidades/GHEs, move matrícula se mudou de GHE, grava só docs alterados
async function aplicarRoster(rows,prog=()=>{}){
  const D=S.data, eref=E(S.eid), dirtyU=new Map(), dirtyG=new Set();
  const byKey=new Map(); D.ghes.forEach(g=>{g.colab=g.colab||{};Object.keys(g.colab).forEach(k=>byKey.set(k,g))});
  for(const r of rows){
    const uidU="u_"+slug(r.unidade); let u=D.unidades.find(x=>x.k===uidU);
    if(!u){u={k:uidU,nome:r.unidade};D.unidades.push(u);dirtyU.set(uidU,u)}
    const gid=("g_"+slug(r.unidade).slice(0,40)+"__"+slug(r.ghe)).slice(0,140); let g=D.ghes.find(x=>x.k===gid);
    if(!g){g={k:gid,nome:r.ghe,unidadeId:uidU,colab:{}};D.ghes.push(g);dirtyG.add(g)}
    const k=matKey(r.mat), old=byKey.get(k);
    if(old&&old!==g){delete old.colab[k];dirtyG.add(old)}
    const val=[r.mat,r.nome]; if(JSON.stringify(g.colab[k])!==JSON.stringify(val)){g.colab[k]=val;dirtyG.add(g)}
    byKey.set(k,g);
  }
  const grande=[...dirtyG].find(g=>JSON.stringify(g).length>1400000);
  if(grande) throw new Error(`O GHE "${grande.nome}" ficou com ${Object.keys(grande.colab).length} colaboradores, acima do limite de um registro (cerca de 20 mil). Divida esse GHE em grupos menores na planilha.`);
  const jobs=[...[...dirtyU.values()].map(u=>()=>eref.collection("unidades").doc(u.k).set(u)),...[...dirtyG].map(g=>()=>eref.collection("ghes").doc(g.k).set(g))];
  let feitos=0, prox=0; const unid=jobs.slice(0,dirtyU.size), resto=jobs.slice(dirtyU.size);
  for(const j of unid){ await j(); prog(++feitos,jobs.length); } // unidades antes dos GHEs
  await Promise.all(Array.from({length:Math.min(4,resto.length)},async()=>{ while(prox<resto.length){ const j=resto[prox++]; await j(); prog(++feitos,jobs.length); } }));
  render();
}

async function exportarSolicitacao(btn){
  if(!dl) return toast("Download indisponível nesta visualização");
  if(typeof ExcelJS==="undefined") return toast("Gerador de Excel não carregou. Recarregue a página.");
  const lbl=btn.textContent; btn.disabled=true; btn.textContent="Gerando planilha…";
  try{
    const e=emp(), D=S.data||{unidades:[],ghes:[]}, R=[...roster().values()];
    const C={wine:"FF8B3A42",deep:"FF5E2A30",tint:"FFEBD9DB",cream:"FFF5EFEA",mut:"FF8A7A78",ink:"FF3A2A2E",ln:"FFEADDE0",soft:"FFC99AA0"};
    const F=(o={})=>({name:"Montserrat",size:10,color:{argb:C.ink},...o});
    const fill=c=>({type:"pattern",pattern:"solid",fgColor:{argb:c}});
    const borda={bottom:{style:"thin",color:{argb:C.ln}}};
    const wb=new ExcelJS.Workbook(); wb.creator="ElevaLife"; wb.created=new Date();
    const MAXR=1500;
    // cabeçalho padrão de aba: faixa título (linha 1), orientação (linha 2), cabeçalho da tabela (linha 3)
    function aba(nome,titulo,orient,cols,linhas,validacoes={}){
      const ws=wb.addWorksheet(nome,{views:[{state:"frozen",ySplit:3,showGridLines:false}],properties:{tabColor:{argb:C.wine}}});
      ws.columns=cols.map(c=>({width:c.w}));
      ws.mergeCells(1,1,1,cols.length); const t=ws.getCell(1,1); t.value=titulo; t.font=F({size:13,bold:true,color:{argb:"FFFFFFFF"}}); t.fill=fill(C.deep); t.alignment={vertical:"middle",indent:1}; ws.getRow(1).height=28;
      ws.mergeCells(2,1,2,cols.length); const o=ws.getCell(2,1); o.value=orient; o.font=F({italic:true,color:{argb:C.mut}}); o.alignment={wrapText:true,vertical:"top",indent:1}; ws.getRow(2).height=Math.max(30,Math.ceil(orient.length/130)*15);

const CAMPOS=[["cnpj","CNPJ"],["razao","Razão social"],["endereco","Endereço"],["telefone","Telefone"],["cnae","CNAE"],["grau","Grau de risco"]];
function formEmp(e={}){ return `<div class="stack"><div class="row" style="align-items:flex-end;flex-wrap:nowrap"><label class="f" style="flex:1">CNPJ<input type="text" id="f_cnpj" inputmode="numeric" placeholder="00.000.000/0000-00" value="${esc(e.cnpj||"")}"></label><button class="btn" type="button" id="buscaCnpj">Buscar dados</button></div><span class="muted" id="cnpjMsg" style="font-size:.85rem">Digite o CNPJ: razão social, endereço, telefone e CNAE são preenchidos automaticamente.</span>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">${CAMPOS.slice(1).map(([k,l])=>`<label class="f">${l}<input type="text" id="f_${k}" value="${esc(e[k]||"")}"></label>`).join("")}</div></div>`; }
const soDig=s=>String(s||"").replace(/\D/g,"");
function mascaraCnpj(v){const d=soDig(v).slice(0,14);return d.replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2");}
function cnpjValido(v){const c=soDig(v);if(c.length!==14||/^(\d)\1+$/.test(c))return false;const dv=n=>{let s=0,p=n-7;for(let i=0;i<n;i++){s+=+c[i]*p--;if(p<2)p=9}const r=s%11;return r<2?0:11-r};return dv(12)===+c[12]&&dv(13)===+c[13];}
let ultimoCnpj="";
async function buscarCnpj(force){
  const inp=$("#f_cnpj"),msg=$("#cnpjMsg"),c=soDig(inp.value); if(c.length<14) return; if(c===ultimoCnpj&&!force) return; ultimoCnpj=c;
  if(!cnpjValido(c)){msg.className="err";msg.textContent="CNPJ inválido. Confira os dígitos.";return}
  msg.className="muted";msg.textContent="Consultando a Receita Federal…";
  try{
    const set=(k,v)=>{if(v) $("#f_"+k).value=v};
    if(window.ELEVA_CNPJ_URL){ // SIGE: consulta pelo backend (/api/cnpj), que já traz o grau de risco aproximado
      const r=await fetch(window.ELEVA_CNPJ_URL+c,{credentials:"same-origin"}); if(r.status===404) throw {nf:1}; if(!r.ok) throw new Error(r.status);
      const x=await r.json(); set("razao",x.RazaoSocial);
      set("endereco",[x.Logradouro,x.Numero,x.Complemento,x.Bairro,[x.Cidade,x.Estado].filter(Boolean).join(" - "),x.CEP&&String(x.CEP).replace(/^(\d{5})(\d{3})$/,"$1-$2")].filter(Boolean).join(", "));
      set("telefone",x.Telefone); set("cnae",x.CNAE); if(x.GrauRiscoNR4) set("grau",x.GrauRiscoNR4);
      msg.className="muted"; msg.textContent=`Dados preenchidos (situação cadastral: ${x.SituacaoCadastral||"—"}). Confira os dados${x.GrauRiscoNR4?" e o grau de risco sugerido":" e informe o grau de risco"}.`; return; }
    const ac=new AbortController(); const to=setTimeout(()=>ac.abort(),8000); const r=await fetch("https://brasilapi.com.br/api/cnpj/v1/"+c,{signal:ac.signal}); clearTimeout(to); if(r.status===404) throw {nf:1}; if(!r.ok) throw new Error(r.status);
    const d=await r.json();
    set("razao",d.razao_social);
    set("endereco",[[d.descricao_tipo_de_logradouro,d.logradouro].filter(Boolean).join(" "),d.numero,d.complemento,d.bairro,[d.municipio,d.uf].filter(Boolean).join(" - "),d.cep&&String(d.cep).replace(/^(\d{5})(\d{3})$/,"$1-$2")].filter(Boolean).join(", "));
    set("telefone",d.ddd_telefone_1);
    set("cnae",d.cnae_fiscal?`${String(d.cnae_fiscal).replace(/^(\d{4})(\d)(\d{2})$/,"$1-$2/$3")} – ${d.cnae_fiscal_descricao||""}`:"");
    msg.className="muted";msg.textContent=`Dados preenchidos (situação cadastral: ${d.descricao_situacao_cadastral||"—"}). Confira e informe o grau de risco.`;
  }catch(e){ msg.className="err"; msg.textContent=e&&e.nf?"CNPJ não encontrado na Receita Federal.":(NO_CLAUDE?"Não foi possível consultar o CNPJ agora. Preencha os campos manualmente.":"A consulta automática do CNPJ só funciona na versão instalada no SIGE. Preencha os campos manualmente."); }
}
function bindCnpj(){ const i=$("#f_cnpj"); ultimoCnpj=soDig(i.value); i.oninput=()=>{i.value=mascaraCnpj(i.value); if(soDig(i.value).length===14) buscarCnpj()}; $("#buscaCnpj").onclick=()=>buscarCnpj(true); }

    <div class="row"><input type="file" id="logoCli" accept="image/png,image/jpeg" aria-label="Logo do cliente">${e.logo?`<button class="btn sm danger" id="logoRm">Remover</button>`:""}</div></div></div>

révio ao gestor","Percentual de gestores apoiados antes de conduzir desligamentos"],["DEM-D04-EST-004","dem","Demandas Emocionais","Exposição a conteúdo perturbador em atividades de moderação/auditoria","Crítico","H1","EST","Proteger trabalhadores expostos a conteúdo perturbador recorrente","Implementar rodízio obrigatório, limite de tempo de exposição contínua e suporte psicológico estruturado para funções de moderação/auditoria de conteúdo sensível. Enquanto o rodízio é estruturado, restringir de imediato o tempo máximo de exposição contínua diária.","EC-00","CP","Casos de sofrimento psíquico associados à função de moderação","Taxa de afastamento por CID F na função de moderação/auditoria"],["DEM-D04-COR-001","dem","Demandas Emocionais","Cobrança emocional por metas comerciais agressivas","Alto","H3","COR","Reduzir a pressão emocional associada à cobrança de metas comerciais","Revisar o estilo de cobrança de metas junto à liderança comercial, substituindo pressão pessoalizada por acompanhamento técnico e plano de suporte ao desempenho.","EC-00","MP","Queixas de pressão excessiva por metas comerciais","Índice de pressão percebida em pesquisa de clima da área comercial"],["DEM-D04-EST-005","dem","Demandas Emocionais","Convivência forçada com clima de medo por reestruturações frequentes","Alto","H1","EST","Reduzir o clima de insegurança gerado por reestruturações","Estruturar processo de comunicação transparente e cronograma claro para reestruturações organizacionais, reduzindo a incerteza prolongada sobre estabilidade no emprego.","EC-00","MP","Rumores e clima de insegurança reportados","Índice de segurança no emprego em pesquisa de clima"],["DEM-D04-PRE-004","dem","Demandas Emocionais","Ausência de reconhecimento após eventos emocionalmente desgastantes","Moderado","H3","PRE","Assegurar reconhecimento formal após eventos emocionalmente desgastantes","Instituir protocolo de reconhecimento e acompanhamento da liderança após eventos de trabalho emocionalmente desgastantes (ex.: atendimentos críticos, acidentes).","EC-00","CP","Eventos desgastantes sem follow-up de liderança registrado","Percentual de eventos críticos com reconhecimento/follow-up formal"],["DEM-D05-COR-004","dem","Demandas Físicas","Exposição a vibração ou ruído com efeito cumulativo sobre atenção/estresse","Alto","H1","COR","Reduzir a exposição a vibração/ruído com efeito sobre atenção","Priorizar medidas de controle de engenharia (isolamento, manutenção preditiva) para redução de vibração/ruído em fontes identificadas no PGR, complementando com pausas de recuperação.","EC-05","MP","Exposição a ruído/vibração registrada em PGR","Índice de exposição a ruído/vibração por posto de trabalho"],["DEM-D05-COR-005","dem","Demandas Físicas","Uso prolongado de EPIs desconfortáveis afetando concentração","Moderado","H2","COR","Reduzir o desconforto de EPIs sem comprometer a proteção","Avaliar alternativas de EPI com melhor ergonomia e conforto, mantendo o nível de proteção exigido, com testes junto aos usuários finais.","EC-01","CP","Queixas de desconforto com EPI","Percentual de trabalhadores satisfeitos com o EPI em pesquisa"],["DEM-D05-COR-006","dem","Demandas Físicas","Deslocamentos físicos extensos dentro da jornada sem tempo computado","Moderado","H2","COR","Reconhecer e otimizar deslocamentos internos extensos","Mapear tempos de deslocamento interno entre postos/áreas e redesenhar o layout ou a distribuição de tarefas para reduzir deslocamentos desnecessários.","EC-04","MP","Tempo de deslocamento interno registrado","Tempo médio de deslocamento interno por turno"],["DEM-D05-COR-007","dem","Demandas Físicas","Levantamento e transporte manual de cargas associado à pressão de tempo","Alto","H1","COR","Reduzir o risco de levantamento manual sob pressão de tempo","Introduzir auxílios mecânicos para levantamento/transporte de cargas e revisar o tempo de ciclo para eliminar a pressão de tempo associada à tarefa manual.","EC-01","MP","Queixas osteomusculares associadas a le ","Reduzir o retrabalho decorrente de decisões informais não registradas","Reforçar o uso de canais formais de registro de decisão para demandas relevantes, evitando retrabalho por decisões informais não documentadas.","EC-00","CP","Retrabalho associado a decisões não documentadas","Percentual de decisões relevantes formalmente registradas"],["DEM-D10-COR-004","dem","Multitarefas","Participação simultânea em múltiplos comitês/grupos de trabalho","Moderado","H3","COR","Limitar a participação simultânea em comitês/grupos de trabalho","Estabelecer limite de participação simultânea em comitês e grupos de trabalho por colaborador, com critério de priorização definido pela liderança.","EC-00","CP","Número de comitês/grupos por colaborador","Número médio de comitês/grupos de trabalho por colaborador"],["DEM-D10-EST-001","dem","Multitarefas","Responsabilidade por atividades de diferentes áreas sem gestor único de referência","Alto","H3","EST","Assegurar gestor único de referência para trabalhadores multifuncionais","Definir formalmente um gestor de referência único para trabalhadores com responsabilidades em múltiplas áreas, evitando demandas conflitantes sem arbitragem.","EC-00","MP","Conflitos de prioridade entre gestores de áreas distintas","Percentual de trabalhadores multifuncionais com gestor de referência definido"],["DEM-D10-PRE-003","dem","Multitarefas","Alternância entre atendimento presencial e virtual sem tempo de transição","Moderado","H2","PRE","Instituir tempo de transição entre modalidades de atendimento","Incluir intervalo mínimo de transição na escala entre atendimentos presenciais e virtuais, reduzindo o custo cognitivo da alternância abrupta.","EC-04","CP","Erros associados à transição entre modalidades de atendimento","Tempo médio de transição entre modalidades de atendimento"],["DEM-D10-EST-002","dem","Multitarefas","Acúmulo de atividades operacionais e estratégicas na mesma função","Alto","H1","EST","Separar adequadamente atividades operacionais e estratégicas por função","Revisar a estrutura organizacional para separar atividades operacionais rotineiras de atividades estratégicas atualmente acumuladas na mesma função, redistribuindo conforme o caso.","EC-06","MP","Tempo dedicado a atividades operacionais em funções estratégicas","Percentual do tempo de funções estratégicas dedicado a atividades operacionais"],["DEM-D10-PRE-004","dem","Multitarefas","Ausência de ferramenta única de gestão de tarefas gerando dispersão de prioridades","Moderado","H2","PRE","Consolidar a gestão de tarefas em ferramenta única","Adotar ferramenta única de gestão de tarefas e prioridades por trabalhador/equipe, eliminando a dispersão entre planilhas, e-mails e sistemas paralelos.","EC-04","CP","Número de ferramentas utilizadas para gestão de tarefas","Percentual de trabalhadores utilizando ferramenta única de gestão de tarefas"],["CTL-C01-EST-001","ctl","Autonomia","Ausência de autonomia para decidir sobre o método de execução da própria tarefa","Alto","H1","EST","Ampliar a autonomia sobre o método de execução das tarefas","Redesenhar os procedimentos operacionais para definir o resultado esperado e as restrições de segurança/qualidade, deixando o método de execução a critério do trabalhador dentro desses limites.","EC-04","MP","Queixas de rigidez excessiva de procedimento","Percentual de procedimentos revisados para focar em resultado, não em método"],["CTL-C01-COR-001","ctl","Autonomia","Necessidade de aprovação de superior para decisões operacionais rotineiras","Moderado","H3","COR","Reduzir aprovações desnecessárias para decisões rotineiras","Revisar a matriz de alçada para elevar o limite de decisão autônoma em decisões operacionais de baixo risco e baixo impacto financeiro.","EC-04","CP","Volume de aprovações rotineiras solicitadas à liderança","Tempo médio de espera por aprovação de decisão rotineira"],["CTL-C01-COR-002","ctl","Autonomia","Monitoramento excessivo de microdecisões do dia a dia","Moderado","H3","COR","Reduzir o monitoramento excessivo de microdecisões","Revisar práticas de supervisão para migrar de controle de microdecisões para acompanhamento por resultados e indicadores agregados.","EC-00","CP","Queixas de microgerenciamento em pesquisa de clima","Índice de percepção de microgerenciamento em pesquisa de clima"],["CTL-C01-COR-003","ctl","Autonomia","Scripts rígidos de atendimento sem margem de adaptação","Moderado","H2","COR","Introduzir margem de adaptação nos scripts de atendimento","Revisar scripts de atendimento para manter pontos obrigatórios (compliance/segurança) e liberar margem de adaptação de linguagem e abordagem ao trabalhador.","EC-04","CP","Reclamações de atendimento robotizado/impessoal","Percentual de scripts revisados com margem de adaptação"],["CTL-C01-PRE-001","ctl","Autonomia","Ausência de autonomia para gerenciar o próprio tempo dentro da jornada","Moderado","H2","PRE","Ampliar a autonomia de gestão do tempo dentro da jornada","Onde a natureza da atividade permitir, substituir o controle rígido de sequência de tarefas por metas de entrega no período, deixando a organização do tempo a critério do trabalhador.","EC-04","MP","Queixas de rigidez na gestão do tempo","Percentual de funções elegíveis com gestão flexível do tempo implementada"],["CTL-C01-COR-004","ctl","Autonomia","Decisões técnicas de especialistas sobrepostas por hierarquia sem justificativa técnica","Alto","H3","COR","Assegurar que decisões técnicas sejam respeitadas ou contestadas com justificativa técnica","Instituir processo formal de registro de divergência técnica, exigindo justificativa documentada quando uma decisão técnica de especialista for sobreposta pela hierarquia.","EC-00","CP","Decisões técnicas revertidas sem justificativa registrada","Percentual de reversões de decisão técnica com justificativa documentada"],["CTL-C01-PRE-002","ctl","Autonomia","Falta de autonomia para recusar tarefas fora do escopo sem retaliação","Alto","H1","PRE","Assegurar canal seguro para recusa fundamentada de tarefas fora do escopo","Estabelecer processo formal e protegido para questionamento de tarefas fora do escopo contratual, com garantia de não retaliação e mediação da liderança superior.","EC-00","MP","Queixas de tarefas fora do escopo sem canal de recusa","Número de casos de recusa fundamentada tratados formalmente"],["CTL-C01-COR-005","ctl","Autonomia","Sistemas que bloqueiam ajustes manuais mesmo quando tecnicamente justificados","Moderado","H2","COR","Permitir ajuste manual justificado em sistemas rígidos","Revisar a parametrização de sistemas para permitir exceções manuais mediante justificativa e trilha de auditoria, evitando bloqueios que forcem contorno informal do processo.","EC-04","MP","Contornos informais de sistema reportados","Número de solicitações de exceção manual não atendidas pelo sistema"],["CTL-C01-PRE-003","ctl","Autonomia","Ausência de autonomia para priorizar entre demandas concorrentes","Moderado","H3","PRE","Assegurar autonomia mínima de priorização entre demandas concorrentes","Estabelecer critério claro (ex.: matriz de urgência x impacto) que permita ao trabalhador priorizar demandas concorrentes sem necessidade de aprovação caso a caso.","EC-00","CP","Conflitos de priorização escalonados à liderança","Número de priorizações resolvidas autonomamente pelo trabalhador"],["CTL-C01-COR-006","ctl","Autonomia","Necessidade de múltiplas aprovações para pequenas exceções operacionais","Baixo","H2","COR","Simplificar o fluxo de aprovação de pequenas exceções operacionais","Mapear o fluxo de aprovação de exceções de baixo risco e eliminar etapas redundantes de aprovação múltipla.","EC-04","CP","Tempo médio de aprovação de exceções de baixo risco","Número médio de aprovações necessárias por exceção de baixo risco"],["CTL-C01-PRE-004","ctl","Autonomia","Ausência de autonomia orçamentária mínima para resolver problemas do dia a dia","Baixo","H1","PRE","Prover autonomia orçamentária mínima para resolução ágil de problemas","Estabelecer alçada orçamentária mínima para resolução imediata de problemas operacionais de baixo valor, evitando paralisação por burocracia financeira.","EC-00","MP","Problemas operacionais não resolvidos por falta de alçada orçamentária","Tempo médio de resolução de problemas de baixo valor"],["CTL-C01-COR-007","ctl","Autonomia","Supervisão constante (vigilância) sem espaço de confiança","Alto","H3","COR","Substituir vigilância constante por relação de confiança baseada em resultados","Capacitar lideranças para migrar de modelo de supervisão por vigilância constante para gestão por confiança e acompanhamento por resultados.","EC-00","MP","Percepção de vigilância excessiva em pesquisa de clima","Índice de percepção de confiança da liderança em pesquisa de clima"],["CTL-C01-COR-008","ctl","Autonomia","Autonomia formalmente concedida mas revertida na prática pela liderança","Moderado","H3","COR","Assegurar coerência entre autonomia formal e prática de liderança","Auditar a prática de lideranças frente às políticas formais de autonomia, com feedback e capacitação para lideranças que revertem autonomia concedida na prática.","EC-00","CP","Divergência entre política formal e prática relatada","Percentual de trabalhadores que reportam autonomia efetiva compatível com a política formal"],["CTL-C01-EST-002","ctl","Autonomia","Ausência de autonomia para interromper processo diante de risco percebido","Crítico","H1","EST","Assegurar autonomia para interromper processo diante de risco percebido","Instituir e comunicar formalmente o direito de qualquer trabalhador interromper um processo diante de risco percebido, com proteção contra retaliação e fluxo claro de escalonamento imediato.","EC-00","IM","Casos de risco percebido não comunicado por medo de retaliação","Número de interrupções de processo por risco percebido registradas formalmente"],["CTL-C01-PRE-005","ctl","Autonomia","Padronização excessiva de processos impedindo adaptação a contextos legítimos","Moderado","H2","PRE","Permitir adaptação legítima de processos padronizados a contextos específicos","Revisar processos altamente padronizados para identificar pontos de adaptação legítima por contexto, formalizando exceções previsíveis em vez de proibir toda variação.","EC-04","MP","Contextos legítimos não previstos em procedimento padrão","Número de exceções legítimas formalizadas no procedimento"],["CTL-C02-EST-001","ctl","Participação nas decisões","Decisões que afetam a rotina da equipe tomadas sem consulta prévia","Alto","H3","EST","Assegurar consulta prévia da equipe em decisões que afetam sua rotina","Instituir etapa obrigatória de consulta à equipe impactada antes da implementação de decisões que alterem significativamente sua rotina de trabalho.","EC-00","MP","Decisões implementadas sem consulta prévia registrada","Percentual de decisões relevantes com consulta prévia registrada"],["CTL-C02-PRE-001","ctl","Participação nas decisões","Ausência de canal formal de consulta antes de mudanças de processo","Moderado","H2","PRE","Instituir canal formal de consulta antes de mudanças de processo","Criar canal estruturado (pesquisa rápida, reunião de validação) para consulta da equipe antes da formalização de mudanças de processo.","EC-00","CP","Mudanças de processo implementadas sem canal de consulta","Percentual de mudanças de processo com consulta formal prévia"],["CTL-C02-COR-001","ctl","Participação nas decisões","Consulta realizada apenas pro forma sem influência real no resultado","Moderado","H3","COR","Assegurar influência real da consulta no resultado da decisão","Revisar o processo de consulta para exigir registro de como o input recebido influenciou (ou não) a decisão final, com justificativa quando não incorporado.","EC-00","CP","Feedback recebido sem impacto identificável na decisão","Percentual de consultas com retorno documentado sobre o uso do input"],["CTL-C02-EST-002","ctl","Participação nas decisões","Exclusão de representantes de base em comitês de mudança organizacional","Alto","H3","EST","Assegurar representação de base em comitês de mudança organizacional","Formalizar a participação de representantes de base (eleitos ou indicados pelos pares) em comitês que deliberam sobre mudanças organizacionais relevantes.","EC-00","MP","Comitês de mudança sem representação de base","Percentual de comitês de mudança com representação de base"],["CTL-C02-COR-002","ctl","Participação nas decisões","Decisões de leiaute/ferramentas de trabalho sem ouvir usuários finais","Moderado","H2","COR","Incorporar a visão dos usuários finais em decisões de leiaute/ferramentas","Incluir etapa de validação com usuários finais antes da implementação definitiva de mudanças de leiaute ou novas ferramentas de trabalho.","EC-04","CP","Retrabalho pós-implementação por leiaute/ferramenta inadequada","Percentual de projetos de leiaute/ferramenta com validação prévia de usuários"],["CTL-C02-PRE-002","ctl","Participação nas decisões","Ausência de espaço para trabalhadores proporem melhorias de processo","Baixo","H2","PRE","Criar espaço formal para proposição de melhorias de processo pelos trabalhadores","Instituir programa estruturado de sugestões de melhoria de processo, com critério de avaliação e retorno obrigatório ao proponente.","EC-00","CP","Ausência de canal de sugestão de melhoria de processo","Número de sugestões de melhoria recebidas e avaliadas por período"],["CTL-C02-COR-003","ctl","Participação nas decisões","Feedback dos trabalhadores coletado mas sem retorno sobre o uso dado","Moderado","H3","COR","Assegurar retorno sobre o uso do feedback coletado dos trabalhadores","Estabelecer prática obrigatória de retorno (fechamento de ciclo) sobre as ações tomadas a partir do feedback coletado em pesquisas ou canais formais.","EC-00","CP","Pesquisas de clima sem retorno de plano de ação","Percentual de pesquisas/consultas com retorno formal de ações"],["CTL-C02-EST-003","ctl","Participação nas decisões","Reestruturações anunciadas sem qualquer etapa de consulta prévia","Alto","H1","EST","Incorporar consulta prévia ao processo de reestruturação organizacional","Estruturar etapa de consulta e comunicação antecipada com lideranças e representantes de trabalhadores antes do anúncio formal de reestruturações relevantes.","EC-00","MP","Reestruturações anunciadas como fato consumado","Percentual de reestruturações com etapa de consulta prévia registrada"],["CTL-C02-COR-004","ctl","Participação nas decisões","Decisões de metas e indicadores definidas sem input das equipes impactadas","Moderado","H3","COR","Incorporar input das equipes impactadas na definição de metas e indicadores","Incluir etapa de validação técnica com as equipes impactadas antes da formalização de novas metas e indicadores de desempenho.","EC-07","CP","Metas contestadas tecnicamente após publicação","Percentual de metas/indicadores validados previamente com as equipes"],["CTL-C02-EST-004","ctl","Participação nas decisões","Ausência de representação de trabalhadores em comitês de saúde e segurança","Alto","H1","EST","Assegurar representação de trabalhadores em comitês de saúde e segurança","Formalizar e ativar a participação efetiva de representantes de trabalhadores (ex.: CIPA) em comitês de saúde e segurança, incluindo temas de risco psicossocial.","EC-00","CP","Comitês de SST sem pauta de risco psicossocial","Percentual de reuniões de comitê de SST com pauta de risco psicossocial"],["CTL-C02-COR-005","ctl","Participação nas decisões","Mudanças de escala/turno implementadas sem consulta aos afetados","Alto","H3","COR","Assegurar consulta prévia em mudanças de escala/turno","Instituir etapa de consulta formal aos trabalhadores afetados antes de qualquer alteração de escala ou turno, com prazo mínimo de antecedência de comunicação.","EC-00","CP","Mudanças de escala implementadas sem aviso prévio","Percentual de mudanças de escala com consulta e aviso prévio"],["CTL-C02-COR-006","ctl","Participação nas decisões","Sistema de sugestões existente mas sem processo de avaliação/retorno","Baixo","H2","COR","Assegurar processo de avaliação e retorno ao sistema de sugestões existente","Formalizar fluxo de avaliação periódica das sugestões recebidas, com retorno obrigatório ao proponente sobre a decisão tomada.","EC-00","CP","Sugestões acumuladas sem avaliação","Percentual de sugestões avaliadas dentro do prazo definido"],["CTL-C02-COR-007","ctl","Participação nas decisões","Decisões relevantes comunicadas apenas como fato consumado","Moderado","H3","COR","Reduzir a prática de comunicar decisões relevantes apenas como fato consumado","Capacitar lideranças em práticas de comunicação de mudança que incluam contexto, racional da decisão e espaço para dúvidas, mesmo quando a decisão já esteja tomada.","EC-00","CP","Queixas de comunicação unilateral de decisões","Índice de percepção de transparência na comunicação de decisões"],["CTL-C02-PRE-003","ctl","Participação nas decisões","Ausência de pesquisa de clima ou consulta periódica estruturada","Moderado","H1","PRE","Instituir pesquisa de clima ou consulta periódica estruturada","Implementar pesquisa de clima organizacional periódica, incluindo dimensões de participação e psicossociais, com plano de ação decorrente.","EC-00","MP","Ausência de dado estruturado de percepção dos trabalhadores","Periodicidade e taxa de resposta da pesquisa de clima"],["CTL-C03-PRE-001","ctl","Flexibilidade","Ausência de flexibilidade de horário para necessidades pessoais/familiares","Moderado","H1","PRE","Prover flexibilidade de horário para necessidades pessoais/familiares","Implementar política de flexibilidade de horário (dentro de faixa núcleo) para necessidades pessoais/familiares, com processo simples de solicitação.","EC-00","MP","Solicitações de ajuste de horário negadas","Percentual de solicitações de flexibilidade de horário atendidas"],["CTL-C03-PRE-002","ctl","Flexibilidade","Rigidez de local de trabalho sem avaliação de viabilidade de modelo híbrido/remoto","Moderado","H1","PRE","Avaliar a viabilidade de
