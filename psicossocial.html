    <p class="muted" style="margin:0">São 35 frases. Para cada uma, marque com que frequência ela acontece no seu trabalho nos <b>últimos 6 meses</b>. Leva cerca de 5 minutos.</p>
    ${RS.retomado?`<p class="aviso" style="margin:0">Encontramos respostas suas guardadas neste aparelho. Você continua de onde parou.</p>`:""}
    <div class="row"><button class="btn primary" id="ini">${RS.retomado?"Continuar":"Começar"}</button><button class="btn" id="naosou">Não sou eu</button></div></div>`;
    $("#ini").onclick=()=>{RS.step="q";rRender()}; $("#naosou").onclick=()=>{RS.step="mat";RS.erro="Se os dados estiverem errados, procure o RH ou o SESMT antes de responder.";rRender()}; return;
  }
  if(RS.step==="q"){ const P=7,ini=RS.page*P,fim=ini+P,feitas=RS.ans.filter(Boolean).length;
    c.innerHTML=head+`<div class="stack"><div class="row" style="justify-content:space-between"><span class="muted">Parte ${RS.page+1} de 5</span><span class="num muted">${feitas}/35</span></div><div class="prog"><span style="width:${feitas/35*100}%"></span></div></div>
    ${ITENS.slice(ini,fim).map((it,j)=>{const i=ini+j;return `<div class="q" id="q${i}"><p><span class="n">${i+1}.</span>${it[1]}</p><div class="opts" role="radiogroup" aria-label="Item ${i+1}">${ESCALA.map((l,v)=>`<button class="opt ${RS.ans[i]===v+1?"on":""}" data-i="${i}" data-v="${v+1}" role="radio" aria-checked="${RS.ans[i]===v+1}">${l}</button>`).join("")}</div></div>`}).join("")}
    <span class="err" id="qe"></span>
    <div class="row" style="justify-content:space-between">${RS.page?`<button class="btn" id="ant">Voltar</button>`:"<span></span>"}<button class="btn primary" id="prox">${RS.page<4?"Próxima":"Enviar respostas"}</button></div>`;
    c.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{const i=+b.dataset.i;RS.ans[i]=+b.dataset.v;b.parentNode.querySelectorAll(".opt").forEach(o=>{o.classList.toggle("on",o===b);o.setAttribute("aria-checked",o===b)});$("#q"+i).classList.remove("miss");salvarRascunho();const f=RS.ans.filter(Boolean).length;c.querySelector(".prog span").style.width=f/35*100+"%";c.querySelector(".num.muted").textContent=f+"/35"});
    if($("#ant")) $("#ant").onclick=()=>{RS.page--;salvarRascunho();rRender();scrollTo(0,0)};
    $("#prox").onclick=async()=>{ const falt=[];for(let i=ini;i<fim;i++) if(!RS.ans[i]) falt.push(i);
      if(falt.length){falt.forEach(i=>$("#q"+i).classList.add("miss"));$("#qe").textContent="Responda todas as frases desta parte para continuar.";$("#q"+falt[0]).scrollIntoView({behavior:"smooth",block:"center"});return}
      if(RS.page<4){RS.page++;salvarRascunho();rRender();scrollTo(0,0)} else await enviar(); };
    return;
  }
  if(RS.step==="fim"){ c.innerHTML=head+`<div class="panel stack" style="text-align:center;padding:2rem 1.2rem"><h1>Obrigado!</h1><p>Sua resposta foi registrada de forma confidencial. Você pode fechar esta página.</p></div>`+sair; return bindSair(); }
}
function bindSair(){ const volta=()=>{ history.replaceState(null,"",location.pathname+location.search); route(); }; const b=$("#sair"); if(b) b.onclick=volta; const d=$("#digitar"); if(d) d.onclick=()=>{ history.replaceState(null,"",location.pathname+location.search); ADMIN?route():landing(); }; }
async function checarMat(v){
  const k=matKey(v); if(!k){RS.erro="Digite sua matrícula.";return rRender()}
  const btn=$("#fm button"); btn.disabled=true; btn.textContent="Verificando…";
  try{
    const r=await API.checarMatricula(RS.eid,k);
    if(r.erro==="nao_encontrada"){RS.erro="Matrícula não encontrada nesta empresa. Confira o número ou procure o RH.";return rRender()}
    if(r.erro==="ja_respondeu"){RS.erro="Esta matrícula já respondeu o questionário. Cada colaborador responde uma única vez.";return rRender()}
    RS.colab=r.colab; const rc=lerRascunho(); RS.retomado=false;
    if(rc&&rc.a.some(Boolean)){ RS.ans=rc.a.slice(); RS.page=Math.min(4,Math.max(0,+rc.p||0)); RS.retomado=true; }
    RS.erro=""; RS.step="conf"; rRender();
  }catch(e){RS.erro="Falha de conexão. Tente novamente.";rRender()}
}
async function enviar(){
  const b=$("#prox"); b.disabled=true; b.textContent="Enviando…"; salvarRascunho();
  try{
    await API.enviarHSE(RS.eid,RS.colab,RS.ans.slice(),n=>{ b.textContent=`Conexão instável, tentando de novo (${n})…`; });
    limparRascunho(); RS.step="fim"; rRender(); scrollTo(0,0);
  }catch(e){
    if(e.code==="dup"){ limparRascunho(); $("#qe").textContent="Esta matrícula já respondeu o questionário."; b.textContent="Enviar respostas"; return; }
    $("#qe").textContent=e.code==="busy"?"Outra resposta com esta matrícula está sendo enviada agora. Aguarde um instante e tente de novo.":"Não foi possível enviar agora. Suas respostas ficaram guardadas neste aparelho: verifique a conexão e toque em Enviar de novo (nada será duplicado).";
    b.disabled=false; b.textContent="Enviar respostas"; }
}


// ===================== API PÚBLICA (telas acessadas por QR code) =====================
// Em produção (SIGE), as telas públicas não devem ler o banco diretamente: defina
// window.ELEVA_API com estas 5 funções apontando para o backend (ver INTEGRACAO_SIGE.md).
const API = window.ELEVA_API || {
  async resolver(x){ // aceita o id interno ou o código curto da coleta
    if(/^e_/.test(x)){ const s=await E(x).get(); if(s.exists) return x; }
    const q=await db.collection("empresas").where("codigo","==",String(x).toUpperCase()).limit(1).get(); return q.docs[0]?.id||null; },
  async empresaPublica(eid){ const s=await E(eid).get(); if(!s.exists) return null; const e=s.data(); return {razao:e.razao,cnpj:e.cnpj,status:e.status,inicio:e.inicio,fim:e.fim}; },
  async checarMatricula(eid,k){
    const ghes=await listAll(E(eid).collection("ghes")); const g=ghes.find(g=>g.colab&&g.colab[k]); if(!g) return {erro:"nao_encontrada"};
    const p=await E(eid).collection("participacao").doc(k).get(); if(p.exists&&p.data().respondido===true) return {erro:"ja_respondeu"};
    const u=await E(eid).collection("unidades").doc(g.unidadeId).get();
    return {colab:{k,gheId:g.k,unidadeId:g.unidadeId,ghe:g.nome,unidade:u.exists?u.data().nome:"—",primeiro:(g.colab[k][1]||"").split(" ")[0]||"colaborador(a)"}}; },
  async enviarHSE(eid,x,respostas){ const eref=E(eid), pref=eref.collection("participacao").doc(x.k);
    const lease=await pref.acquire({holder:uid(),ttlMs:20000}); if(!lease.acquired) throw {code:"busy"};
    const p=await pref.get(); if(p.exists&&p.data().respondido===true) throw {code:"dup"};
    const rid="r"+uid(); // id aleatório, sem relação com a matrícula
    await eref.collection("respostas").doc(rid).set({k:rid,unidadeId:x.unidadeId,gheId:x.gheId,r:respostas,data:hoje()});
    await pref.set({k:x.k,respondido:true,unidadeId:x.unidadeId,gheId:x.gheId}); }, // sem data/hora para não permitir cruzamento
  async isoStatus(eid){ const d=await E(eid).collection("iso").doc("main").get(); return d.exists?d.data():null; },
  async enviarISO(eid,d){ const ref=E(eid).collection("iso").doc("main"); const cur=await ref.get(); if(cur.exists&&isoCompleto(cur.data().r)) throw {code:"dup",doc:cur.data()}; await ref.set(d); },
};

// ===================== BOOT =====================
async function route(){
  if(!db&&!(window.ELEVA_API&&/^#(r|iso)-/.test(location.hash))){ $("#app").innerHTML=`<div class="empty"><h2>Banco de dados indisponível</h2><p>Não foi possível conectar ao banco de dados. Verifique o acesso e recarregue a página.</p></div>`; return; }
  const h=location.hash;
  if(h.startsWith("#r-")||h.startsWith("#iso-")){ const iso=h.startsWith("#iso-"), x=decodeURIComponent(h.slice(iso?5:3));
    $("#app").innerHTML=`<div class="resp"><div class="rcard"><div class="empty">Carregando…</div></div></div>`;
    let eid=null; try{ eid=API.resolver?await API.resolver(x):x; }catch{}
    return iso?respondenteIso(eid||"__"):respondente(eid||"__"); }
  if(!ADMIN&&!CLIENTE) return landing();
  render(); publicarAbas();
  if(S.eid&&!S.data){ if(CLIENTE) loadEmpresaCli(S.eid); else loadEmpresa(S.eid); }
}
(async()=>{
  db = window.ELEVA_DB || (NO_CLAUDE ? null : await claude.use("db")) || (NO_CLAUDE ? criarDbLocal() : null);
  dl = window.ELEVA_DOWNLOADS || (NO_CLAUDE ? null : await claude.use("downloads")) || dlNavegador;
  if(window.ELEVA_AUTH){ try{ AUTH_INFO=await window.ELEVA_AUTH(); ADMIN=!!AUTH_INFO.admin; CLIENTE=!!AUTH_INFO.cliente; }catch{ ADMIN=false; AUTH_INFO={admin:false,status:0}; } }
  if(!NO_CLAUDE){ const u=await claude.use("user"); if(u){ try{ ADMIN=(await u.isOwner())||(await u.canEdit()); PODE_ESCREVER=await u.can("data.write"); }catch{} } else ADMIN=false; }
  PAPEL=CLIENTE?"UsuarioCliente":(AUTH_INFO&&AUTH_INFO.papel==="Consultor")?"Consultor":"Administrador";
  if(CLIENTE&&window.ELEVA_CLI){ try{ S.empresas=(await ELEVA_CLI.empresas()).sort((a,b)=>a.razao.localeCompare(b.razao)); }catch{ S.empresas=[]; } if(S.empresas.length===1) S.eid=S.empresas[0].k; S.tab="diag"; }
  if(db&&ADMIN) db.doc("config/laudo").get().then(x=>{ if(x.exists){ REFERENCIAS=x.data().referencias||null; TEXTOS_SALVOS=x.data().textos||{}; } }).catch(()=>{});
  // V 1.25: as listas se atualizam sozinhas, mas a tela só é redesenhada se algo mudou e ninguém está digitando
  const digitando=()=>{ const a=document.activeElement; return !!(a&&$("#app")?.contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)); };
  let assProfs="", assEmps="";
  // V 1.27: empresas = clientes do SIGE; ergonomistas = cadastro de ergonomistas do SIGE
  if(SIGE()&&ADMIN){ try{ await carregarEmpresas(); }catch(err){ console.error(err); }
    SIGE().listar("ergonomista").then(l=>{ PROFS=l.map(p=>({k:p.id,nome:p.Nome||"",formacao:p.Titulo||"",conselho:p.Registro||"",assinatura:p.Assinatura||null})).filter(p=>p.nome).sort((a,b)=>a.nome.localeCompare(b.nome)); if(S.tab==="laudo"&&!digitando()) render(); }).catch(()=>{}); }
  if(db&&ADMIN&&!SIGE()) db.collection("profissionais").onSnapshot(s=>{ const l=s.docs.map(d=>d.data()).sort((a,b)=>a.nome.localeCompare(b.nome)), ass=JSON.stringify(l); if(ass===assProfs) return; assProfs=ass; PROFS=l; if(profModal&&document.body.contains(profModal)) profModal._draw(); else if(["profs","laudo"].includes(S.tab)&&!digitando()&&!/^#(r|iso)-/.test(location.hash)) render(); },()=>{});
  if(db&&ADMIN&&!SIGE()) db.collection("empresas").onSnapshot(s=>{ const l=s.docs.map(d=>d.data()).sort((a,b)=>a.razao.localeCompare(b.razao)), ass=JSON.stringify(l); if(ass===assEmps) return; const primeira=!assEmps; assEmps=ass; S.empresas=l; if(S.eid&&!S.empresas.find(e=>e.k===S.eid)){S.eid=null;S.data=null;} if(!/^#(r|iso)-/.test(location.hash)&&(primeira||!digitando())) render(); }, ()=>{});
  addEventListener("hashchange",()=>{ if(!/^#(r|iso)-/.test(location.hash)&&S.eid&&ADMIN) loadEmpresa(S.eid); else route(); });
  route();
})();
</script>
